(A) shall\ninclude, in writing--\n(i) a physical or electronic signature of the\nidentifiable individual (or an authorized person\nacting on behalf of such individual);\n(ii) an identification of, and information\nreasonably sufficient for the covered platform to\nlocate, the intimate visual depiction of the\nidentifiable individual;\n(iii) a brief statement that the identifiable\nindividual has a good faith belief that any\nintimate visual depiction identified under clause\n(ii) is not consensual, including any relevant\ninformation for the covered platform to determine\nthe intimate visual depiction was published\nwithout the consent of the identifiable\nindividual; and\n(iv) information sufficient to enable the\ncovered platform to contact the identifiable\nindividual (or an authorized person acting on\nbehalf of such individual).\n(2) Notice of process.--A covered platform shall provide on\nthe platform a clear and conspicuous notice, which may be\nprovided through a clear and conspicuous link to another web\npage or disclosure, of the notice and removal process\nestablished under paragraph (1)(A) that--\n(A) is easy to read and in plain language; and\n(B) provides information regarding the\nresponsibilities of the covered platform under this\nsection, including a description of how an individual\ncan submit a notification and request for removal.\n(3) Removal of nonconsensual intimate visual depictions.--\nUpon \u003c\u003cNOTE: Deadline.>> receiving a valid removal request from\nan identifiable individual (or an authorized person acting on\nbehalf of such individual) using the process described in\nparagraph (1)(A)(ii), a covered platform shall, as soon as\npossible, but not later than 48 hours after receiving such\nrequest--\n(A) remove the intimate visual depiction; and\n(B) make reasonable efforts to identify and remove\nany known identical copies of such depiction.\n(4) Limitation on liability.--A covered platform shall not\nbe liable for any claim based on the covered platform's good\nfaith disabling of access to, or removal of, material claimed to\nbe a nonconsensual intimate visual depiction based on facts or\ncircumstances from which the unlawful publishing of an intimate\nvisual depiction is apparent, regardless of whether the intimate\nvisual depiction is ultimately determined to be unlawful or not.\n[[Page 139 STAT. 61]]\n(b) Enforcement by the Commission.--\n(1) Unfair or deceptive acts or practices.--A failure to\nreasonably comply with the notice and takedown obligations under\nsubsection (a) shall be treated as a violation of a rule\ndefining an unfair or a deceptive act or practice under section\n18(a)(1)(B) of the Federal Trade Commission Act (15 U.S.C.\n57a(a)(1)(B)).\n(2) Powers of the commission.--\n(A) In general.--Except as provided in subparagraph\n(D), the Commission shall enforce this section in the\nsame manner, by the same means, and with the same\njurisdiction, powers, and duties as though all\napplicable terms and provisions of the Federal Trade\nCommission Act (15 U.S.C. 41 et seq.) were incorporated\ninto and made a part of this section.\n(B) Privileges and immunities.--Any person who\nviolates this section shall be subject to the penalties\nand entitled to the privileges and immunities provided\nin the Federal Trade Commission Act (15 U.S.C. 41 et\nseq.).\n(C) Authority preserved.--Nothing in this Act shall\nbe construed to limit the authority of the Federal Trade\nCommission under any other provision of law.\n(D) Scope of jurisdiction.--Notwithstanding sections\n4, 5(a)(2), or 6 of the Federal Trade Commission Act (15\nU.S.C. 44, 45(a)(2), 46), or any jurisdictional\nlimitation of the Commission, the Commission shall also\nenforce this section in the same manner provided in\nsubparagraph (A), with respect to organizations that are\nnot organized to carry on business for their own profit\nor that of their members.","source_id":"SRC-US-PL-119-12"},{"no":"SEC. 4.","ordinal":4,"division":"","text":"\u003c\u003cNOTE: 47 USC 223a note.>> DEFINITIONS.\nIn this Act:\n(1) Commission.--The term ``Commission'' means the Federal\nTrade Commission.\n(2) Consent; digital forgery; identifiable individual;\nintimate visual depiction.--The terms ``consent'', ``digital\nforgery'', ``identifiable individual'', ``intimate visual\ndepiction'', and ``minor'' have the meaning given such terms in\nsection 223(h) of the Communications Act of 1934 (47 U.S.C.\n223), as added by section 2.\n(3) Covered platform.--\n(A) In general.--The term ``covered platform'' means\na website, online service, online application, or mobile\napplication--\n(i) that serves the public; and\n(ii)(I) that primarily provides a forum for\nuser-generated content, including messages,\nvideos, images, games, and audio files; or\n(II) for which it is in the regular course of\ntrade or business of the website, online service,\nonline application, or mobile application to\npublish, curate, host, or make available content\nof nonconsensual intimate visual depictions.\n(B) Exclusions.--The term ``covered platform'' shall\nnot include the following:\n[[Page 139 STAT. 62]]\n(i) A provider of broadband internet access\nservice (as described in section 8.1(b) of title\n47, Code of Federal Regulations, or successor\nregulation).\n(ii) Electronic mail.\n(iii) Except as provided in subparagraph\n(A)(ii)(II), an online service, application, or\nwebsite--\n(I) that consists primarily of\ncontent that is not user generated but\nis preselected by the provider of such\nonline service, application, or website;\nand\n(II) for which any chat, comment, or\ninteractive functionality is incidental\nto, directly related to, or dependent on\nthe provision of the content described\nin subclause (I).","source_id":"SRC-US-PL-119-12"},{"no":"SEC. 5.","ordinal":5,"division":"","text":"\u003c\u003cNOTE: 47 USC 223 note.>> SEVERABILITY.\nIf any provision of this Act, or an amendment made by this Act, is\ndetermined to be unenforceable or invalid, the remaining provisions of\nthis Act and the amendments made by this Act shall not be affected.","source_id":"SRC-US-PL-119-12"}],"amended_by":[],"verification":"VERIFIED","evidence_grade":"A"}],"cases":[{"id":"CN-CASE-AI-COMPANION","jurisdiction":"CN","forum":"北京互联网法院","forum_type":"COURT","case_numbers":["（2020）京0491民初9526号","（2021）京04民终777号"],"caption":"何某诉某人工智能科技有限公司网络侵权责任纠纷案","short_name":"“AI 陪伴”虚拟形象人格权案","decided_at":null,"procedural_stage":"FIRST_INSTANCE","outcome":"CLAIMANT_PARTLY_PREVAILED","is_final":true,"outcome_note":"原告请求在《人民法院报》和案涉软件上公开赔礼道歉（网络致歉不少于 30 日）、赔偿经济损失 18.3 万元（含合理维权支出 3000 元）和精神损害抚慰金 2 万元；判决认定侵害肖像权、姓名权和一般人格权，两项赔偿请求全额支持，赔礼道歉限于在案涉软件页面持续七天（不履行时才由法院择报刊登判决主要内容），其他请求驳回。因赔礼道歉的范围被缩减、主文有驳回项，按本库口径标为部分胜诉。被告上诉后申请撤回，北京市第四中级人民法院 2022 年 1 月 12 日裁定准许（（2021）京04民终777号），一审判决生效。一审判决书取自威科先行，二审裁定书取自北大法宝，均为数据库转载件，不是法院或裁判文书网页面。威科先行所载判决书文本不含当事人、审理经过和落款，故一审裁判日期留空：该库“案件历程”栏写 2021.08.20，北大法宝两个编写条目分别写 2021-08-21 和 2021-08-30，三处都是数据库整理的信息且互不一致。一审案号最初取自另一页面，按案名和裁判要旨对应（该页案名写作“何某诉某科技公司网络侵权责任纠纷案”）；一审判决书和二审裁定书均载有同一案号。","ai_roles":["DEPLOYMENT"],"issues":["ISSUE-PERSONALITY-DEEPFAKE","ISSUE-PROVIDER-LIABILITY"],"field_evidence":{"case_numbers":[{"source_id":"SRC-CN-BJD-BIC-TOP10-2025","quote":"——何某诉某科技公司网络侵权责任纠纷案案例索引北京互联网法院（2020）京0491民初9526号"},{"source_id":"SRC-CN-WK-BIC-9526","quote":"北京互联网法院民事判决书（2020）京0491民初9526号"},{"source_id":"SRC-CN-PKULAW-BJ4-777","quote":"不服北京互联网法院(2020)京0491民初9526号民事判决，向本院提起上诉。"},{"source_id":"SRC-CN-PKULAW-BJ4-777","quote":"(2021)京04民终777号"}],"outcome":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","quote":"判决被告向原告公开赔礼道歉，赔偿原告精神损失及经济损失。"},{"source_id":"SRC-CN-WK-BIC-9526","quote":"2.判令被告赔偿原告经济损失183 000元（包括合理维权支出3000元）、精神损害抚慰金20 000元。"},{"source_id":"SRC-CN-WK-BIC-9526","quote":"最新活动页面持续七天向原告何某公开赔礼道歉，致歉内容应包含本案判决书案号和被告上海自古红蓝人工智能科技有限公司侵害原告何某肖像权、姓名权及一般人格权的情节并经本院审核"},{"source_id":"SRC-CN-WK-BIC-9526","quote":"二、被告上海自古红蓝人工智能科技有限公司于本判决生效之日起七日内赔偿原告何某经济损失183 000元（包括合理维权支出3000元）；"},{"source_id":"SRC-CN-WK-BIC-9526","quote":"三、被告上海自古红蓝人工智能科技有限公司于本判决生效之日起七日内赔偿原告何某精神损害抚慰金20 000元；"},{"source_id":"SRC-CN-WK-BIC-9526","quote":"四、驳回原告何某的其他诉讼请求。"}],"is_final":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","quote":"被告不服一审判决提起上诉，后撤回上诉，一审判决生效。"},{"source_id":"SRC-CN-PKULAW-BJ4-777","quote":"一审判决自之日起发生法律效力。"}],"forum":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","page_level":true,"quote":"近日，北京互联网法院召开涉人工智能案件审理情况新闻发布会，会上发布了八起典型案例。"}],"procedural_stage":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","quote":"被告不服一审判决提起上诉，后撤回上诉，一审判决生效。"},{"source_id":"SRC-CN-PKULAW-BJ4-777","quote":"不服北京互联网法院(2020)京0491民初9526号民事判决，向本院提起上诉。"}]},"legal_anchors":[{"provision":"CN-CIVIL-CODE#第九百九十条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-WK-BIC-9526","quote":"综上，依照《中华人民共和国民法典》第九百九十条、第九百九十八条、第一千零一十二条、第一千零一十八条","note":"判决主文前的裁判依据。法院依该条认定侵害一般人格权（行为发生在民法典施行前，依时间效力规定适用）。"},{"provision":"CN-CIVIL-CODE#第九百九十八条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-WK-BIC-9526","quote":"综上，依照《中华人民共和国民法典》第九百九十条、第九百九十八条、第一千零一十二条、第一千零一十八条","note":"判决主文前的裁判依据。用于确定被告的责任承担。"},{"provision":"CN-CIVIL-CODE#第一千零一十二条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-WK-BIC-9526","quote":"综上，依照《中华人民共和国民法典》第九百九十条、第九百九十八条、第一千零一十二条、第一千零一十八条","note":"判决主文前的裁判依据。用于认定侵害姓名权。"},{"provision":"CN-CIVIL-CODE#第一千零一十八条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-WK-BIC-9526","quote":"综上，依照《中华人民共和国民法典》第九百九十条、第九百九十八条、第一千零一十二条、第一千零一十八条","note":"判决主文前的裁判依据。"},{"provision":"CN-CIVIL-CODE#第一千零一十九条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-WK-BIC-9526","quote":"民法典第一千零一十九条第一款规定：“任何组织或者个人不得以丑化、污损，或者利用信息技术手段伪造等方式侵害他人的肖像权。未经肖像权人同意，不得制作、使用、公开肖像权人的肖像，但是法律另有规定的除外。”","note":"说理部分援引，用于说明侵害肖像权不以营利为目的；不在主文前的裁判依据之列。"},{"provision":"CN-CIVIL-CODE#第一千一百九十五条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-WK-BIC-9526","quote":"或《中华人民共和国民法典》（以下简称民法典）第一千一百九十五条的情形，因采取必要措施而免责？","note":"归纳争议焦点时援引（“通知—删除”规则）。法院认定被告是内容服务提供者，不适用该规则；不在主文前的裁判依据之列。"},{"provision":"CN-CIVIL-CODE#第一千一百九十四条","basis":"EDITORIAL","note":"判决适用的是《侵权责任法》第三十六条第一款（行为发生在民法典施行前），认定被告是内容服务提供者、直接承担侵权责任；判决书没有援引民法典本条。本条前句与该款文字相同，编者据此关联。《侵权责任法》已废止，未入库。"},{"provision":"CN-SPC-AI-OPINION-2026#（四）","basis":"EDITORIAL","note":"该条规定未经同意生成可识别自然人的虚拟数字形象并使用、公开时的人格权保护。该意见晚于本案发布，不是本案裁判依据。"}],"notes":"判决另依据《侵权责任法》第八条、第十五条、第二十条、第二十二条、第三十六条第一款，《最高人民法院关于审理利用信息网络侵害人身权益民事纠纷案件适用法律若干问题的规定》第十五条、第十八条，《最高人民法院关于适用〈中华人民共和国民法典〉时间效力的若干规定》第一条第二款、第二条、第三条，《最高人民法院关于确定民事侵权精神损害赔偿责任若干问题的解释》第十条；上述法律和司法解释未入库。","discovered_via":"北京互联网法院涉人工智能典型案例（北京日报客户端转载）","source_title":{"text":"案例八 何某诉某人工智能科技有限公司网络侵权责任纠纷案——未经同意创造自然人的AI形象构成对人格权的侵害","source_id":"SRC-CN-BJD-BIC-AI-2025"},"history":[],"also_reported_in":[],"scopes":{"SRC-CN-BJD-BIC-TOP10-2025":{"block_start":"“AI陪伴”案：","block_end":"主办法官"},"SRC-CN-PKULAW-BJ4-777":null,"SRC-CN-WK-BIC-9526":{"block_start":"正文","block_end":"审判人员"},"SRC-CN-BJD-BIC-AI-2025":{"block_start":"案例八","block_end":"编辑："}},"scope_links":{"SRC-CN-BJD-BIC-TOP10-2025":"该页案名写作“何某诉某科技公司网络侵权责任纠纷案”，与法院典型案例稿的案名略有出入；编者按当事人称谓和裁判要点认定为同一案件，案号由此而来。该案号的二审裁定书所载上诉人是一家人工智能科技有限公司、被上诉人姓何、案由为网络侵权责任纠纷、上诉后撤回，与典型案例稿相符。"},"excerpts":[{"kind":"facts","text":"某人工智能科技有限公司（以下简称被告）是某款手机记账软件的开发运营者，用户在该软件中可自行创设“AI陪伴者”，设置陪伴者的名称、头像，设置与该陪伴者的人物关系（如男女朋友、兄妹、母子等）。何某系公众人物，知名度较高，在该款软件中被大量用户设置为陪伴人物。用户在设置“何某”为陪伴人物时，上传了大量何某的肖像图片设置人物头像，同时设置了人物关系。被告通过算法部属，将陪伴者“何某”按关系设定分类，并向其他用户推荐该角色。为了使AI角色更加拟人化，被告还为AI角色提供了“调教”算法机制，即用户上传各类文字、肖像图片、动态表情等互动语料，部分用户参与审核，软件进行筛选、分类，形成人物语料。软件可以根据话题类别、角色的人设特点等，在“何某”与用户的对话中向用户推送与其有关的“肖像表情包”和“撩人情话”，营造出与其真人真实互动的使用体验。原告认为，被告的行为侵害了原告的姓名权、肖像权、一般人格权，故诉至法院。","source_id":"SRC-CN-BJD-BIC-AI-2025"},{"kind":"holding","text":"法院认为，被告行为构成对原告姓名权、肖像权、一般人格权的侵害。在被告的软件功能和算法设计下，用户使用何某的姓名、肖像创设虚拟人物，制作互动语料素材，将何某的姓名、肖像、人格特点等综合而成的整体形象投射到AI角色上，形成了何某的虚拟形象，是对包含何某肖像、姓名的整体人格形象的使用。被告使用何某姓名、肖像的行为并未获得何某的许可，构成对何某姓名权、肖像权的侵害。同时，用户可以与AI角色设置虚拟身份关系，设定任意相互称谓，通过制作语料素材“调教”角色，使得AI角色与真实自然人高度关联，容易让用户产生一种与何某真实互动的情感体验。上述使用方式未经何某同意，侵害了何某的人格尊严和人格自由利益，构成对何某一般人格权益的侵害。\n同时，涉案软件的服务与技术服务存在本质不同，被告并非提供简单的用户内容上传服务，而是通过规则设定、算法设计，组织、鼓励用户形成侵权素材，与其共同创设虚拟形象，并使用到用户服务中。被告的产品设计和算法应用鼓励、组织了涉案虚拟形象的创设，直接决定了软件核心功能的实现，不再是中立的技术服务提供者，而应作为网络内容服务提供者承担侵权责任。判决被告向原告公开赔礼道歉，赔偿原告精神损失及经济损失。被告不服一审判决提起上诉，后撤回上诉，一审判决生效。","source_id":"SRC-CN-BJD-BIC-AI-2025"},{"kind":"significance","text":"本案明确自然人的人格权及于其虚拟形象，未经许可擅自创设、使用自然人虚拟形象的，构成对自然人人格权的侵害；网络服务提供者通过算法设计实质参与了侵权内容的生成和提供，应按照内容服务提供者承担侵权责任。本案对加强人格权保护具有重要意义，入选最高人民法院“民法典颁布后人格权司法保护典型民事案例”、北京法院参阅案例。","source_id":"SRC-CN-BJD-BIC-AI-2025"},{"kind":"holding","source_id":"SRC-CN-WK-BIC-9526","text":"综上，案涉软件的模式与侵权责任法第三十六条第二款、第三款规范的仅提供技术服务、未直接实施侵权行为的情形有着本质不同，系通过规则设定、算法设计，组织用户形成素材并提供给用户，故而，被告的行为构成直接的内容服务提供行为，被告属于内容服务提供者。"},{"kind":"holding","source_id":"SRC-CN-WK-BIC-9526","text":"被告未获原告许可以上述方式利用原告的人格要素，侵害原告人格自由利益及人格被尊重的利益，构成侵害原告一般人格权的行为。"},{"kind":"holding","source_id":"SRC-CN-WK-BIC-9526","text":"综上，依照《中华人民共和国民法典》第九百九十条、第九百九十八条、第一千零一十二条、第一千零一十八条"},{"kind":"holding","source_id":"SRC-CN-WK-BIC-9526","text":"二、被告上海自古红蓝人工智能科技有限公司于本判决生效之日起七日内赔偿原告何某经济损失183 000元（包括合理维权支出3000元）；"},{"kind":"holding","source_id":"SRC-CN-WK-BIC-9526","text":"三、被告上海自古红蓝人工智能科技有限公司于本判决生效之日起七日内赔偿原告何某精神损害抚慰金20 000元；"}],"generated_by":"ingest/cases/cn-bic.json","verification":"PARSED","evidence_grade":"B"},{"id":"CN-CASE-AI-DEFACED-PORTRAIT","jurisdiction":"CN","forum":"北京互联网法院","forum_type":"COURT","case_numbers":["（2024）京0491民初21163号"],"caption":"程某诉孙某网络侵权责任纠纷案","short_name":"用 AI 软件丑化他人肖像案","decided_at":null,"procedural_stage":"FIRST_INSTANCE","outcome":"CLAIMANT_PARTLY_PREVAILED","is_final":true,"outcome_note":"原告主张肖像权、名誉权、一般人格权和个人信息权益受侵害，请求书面和公开致歉、赔偿另案诉讼费 800 元、误工费 149 元、拍照费用 2050 元和精神损害抚慰金 1 元。法院认定在微信群发布图片侵害肖像权和名誉权、私信发送图片侵害一般人格权，不构成侵害个人信息权益（属自然人因个人事务处理个人信息）；判决朋友圈公开致歉并出具书面致歉信、赔偿精神损害抚慰金 1 元，三项费用和“承诺不再制作”的请求未获支持。判决书取自威科先行（数据库转载件，不是法院或裁判文书网页面）。案号出自该判决书；典型案例稿没有案号，二者的对应是编者核对的结果（见对应说明）。该页裁判日期显示为“2025.06****”，正文无落款日期，故裁判日期留空。“已生效”出自法院典型案例稿。","ai_roles":["USE_BY_PARTY","OUTPUT"],"issues":["ISSUE-PERSONALITY-DEEPFAKE"],"field_evidence":{"outcome":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","quote":"构成对原告肖像权、名誉权的侵害。"},{"source_id":"SRC-CN-BJD-BIC-AI-2025","quote":"构成对原告一般人格权的侵害。"},{"source_id":"SRC-CN-BJD-BIC-AI-2025","quote":"判决孙某向程某公开赔礼道歉，赔偿原告精神损失。"},{"source_id":"SRC-CN-WK-BIC-21163","quote":"被告的涉案行为构成对原告肖像权、名誉权及一般人格权的侵害，被告应当承担相应的侵权责任。"},{"source_id":"SRC-CN-WK-BIC-21163","quote":"综上，被告的行为一不构成对原告个人信息权益的侵害。"},{"source_id":"SRC-CN-WK-BIC-21163","quote":"2.被告赔偿原告（2024）京0491民初5988号案诉讼费800元、误工费149元、拍照费用2050元；3.被告赔偿原告精神损害抚慰金1元。"},{"source_id":"SRC-CN-WK-BIC-21163","quote":"二、自本判决生效之日起七日内，被告孙某赔偿原告程某精神损害抚慰金1元；"},{"source_id":"SRC-CN-WK-BIC-21163","quote":"三、驳回原告程某的其他诉讼请求。"}],"is_final":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","quote":"宣判后，双方均未提起上诉，该判决已生效。"}],"forum":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","page_level":true,"quote":"近日，北京互联网法院召开涉人工智能案件审理情况新闻发布会，会上发布了八起典型案例。"}],"procedural_stage":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","quote":"宣判后，双方均未提起上诉，该判决已生效。"}],"case_numbers":[{"source_id":"SRC-CN-WK-BIC-21163","quote":"北京互联网法院民 事 判 决 书（2024）京0491民初21163号"}]},"legal_anchors":[{"provision":"CN-CIVIL-CODE#第一百七十九条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-WK-BIC-21163","quote":"综上，依照《中华人民共和国民法典》第一百七十九条、第九百九十条、第九百九十五条、第一千条、第一千零一十八条、第一千零一十九条、第一千零二十四条、第一千一百八十二条、第一千一百八十三条，《中华人民共和国个人信息保护法》第二条、第七十二条之规定，判决如下：","note":"判决主文前的裁判依据。"},{"provision":"CN-CIVIL-CODE#第九百九十条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-WK-BIC-21163","quote":"综上，依照《中华人民共和国民法典》第一百七十九条、第九百九十条、第九百九十五条、第一千条、第一千零一十八条、第一千零一十九条、第一千零二十四条、第一千一百八十二条、第一千一百八十三条，《中华人民共和国个人信息保护法》第二条、第七十二条之规定，判决如下：","note":"判决主文前的裁判依据。"},{"provision":"CN-CIVIL-CODE#第九百九十五条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-WK-BIC-21163","quote":"综上，依照《中华人民共和国民法典》第一百七十九条、第九百九十条、第九百九十五条、第一千条、第一千零一十八条、第一千零一十九条、第一千零二十四条、第一千一百八十二条、第一千一百八十三条，《中华人民共和国个人信息保护法》第二条、第七十二条之规定，判决如下：","note":"判决主文前的裁判依据。"},{"provision":"CN-CIVIL-CODE#第一千条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-WK-BIC-21163","quote":"综上，依照《中华人民共和国民法典》第一百七十九条、第九百九十条、第九百九十五条、第一千条、第一千零一十八条、第一千零一十九条、第一千零二十四条、第一千一百八十二条、第一千一百八十三条，《中华人民共和国个人信息保护法》第二条、第七十二条之规定，判决如下：","note":"判决主文前的裁判依据。"},{"provision":"CN-CIVIL-CODE#第一千零一十八条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-WK-BIC-21163","quote":"综上，依照《中华人民共和国民法典》第一百七十九条、第九百九十条、第九百九十五条、第一千条、第一千零一十八条、第一千零一十九条、第一千零二十四条、第一千一百八十二条、第一千一百八十三条，《中华人民共和 ","basis":"EDITORIAL","note":"该条规定操控可识别特定自然人的生成合成形象、降低其社会评价的，构成侵害名誉权。该意见晚于本案发布，不是本案裁判依据。"}],"notes":"判决说理另援引民法典第一百一十一条（个人信息受法律保护），该条未入库。","discovered_via":"北京互联网法院涉人工智能典型案例（北京日报客户端转载）","source_title":{"text":"案例六 程某诉孙某网络侵权责任纠纷案——利用AI软件恶搞、丑化他人肖像构成人格权侵权","source_id":"SRC-CN-BJD-BIC-AI-2025"},"history":[],"also_reported_in":[],"scopes":{"SRC-CN-WK-BIC-21163":{"block_start":"正文","block_end":"审判人员"},"SRC-CN-BJD-BIC-AI-2025":{"block_start":"案例六","block_end":"案例七"}},"scope_links":{"SRC-CN-WK-BIC-21163":"典型案例稿没有案号。编者认定该判决书属于本案的依据：同为北京互联网法院、网络侵权责任纠纷、原告程某诉被告孙某；案情同为被告用 AI 软件把原告的微信头像照片生成衣着暴露的图片发到微信群，又生成肢体畸形的图片私信原告；裁判要点同为群内发布侵害肖像权和名誉权、私信发送侵害一般人格权；判项同为赔礼道歉并赔偿精神损失。"},"excerpts":[{"kind":"facts","text":"原告程某与被告孙某同为摄影交流微信群成员，被告孙某未经原告程某同意，使用AI软件将原告程某用作微信头像的肖像照片生成衣着暴露的动漫风格图片，并发送至该摄影交流微信群内，后原告程某多次制止，被告孙某仍继续使用涉案AI软件将原告程某的上述微信头像肖像照片AI生成衣着暴露且身体畸形的动漫风格图片并微信私信原告。原告程某认为被告孙某群发和私信的上述被诉侵权图片，能够识别出为原告本人形象，且图片带有严重的性暗示和丑化性质，使得原告的社会评价降低，构成对原告肖像权、名誉权及一般人格权的侵害。原告程某据此要求被告赔礼道歉，并赔偿精神损失和经济损失。","source_id":"SRC-CN-BJD-BIC-AI-2025"},{"kind":"holding","text":"法院认为，被告孙某发布于微信群内的被诉侵权图片系擅自利用原告程某微信头像肖像照片AI生成，与原告程某微信头像肖像照片所呈现的自然人外部形象在脸型、姿势、造型等方面均具有高度的对应关系，微信群成员能够通过上述人物体貌及群聊的前后语境识别出被诉侵权图片的人物外部形象所对应的主体为原告，因此被告的群发行为构成对原告肖像权的侵害。原告通过微信头像展示的个人肖像照片是其网络虚拟身份的标识。被告利用AI软件生成的上述被诉侵权图片将原告穿着得体的微信头像肖像照片生成为胸部暴露的图片，引发了微信群内针对原告的不当讨论，客观上导致了他人对原告的低俗化评价，构成对原告肖像权、名誉权的侵害。此外，被告孙某利用AI软件将原告程某微信头像肖像照片生成人物腿部为木头状，甚至存在三只手臂的图片，图片中的人物体型明显不符合人类基本身体结构，亦将人物的胸部进行了暴露展示。被告将上述图片私信原告，势必会造成原告心理屈辱，侵害了原告的人格尊严，构成对原告一般人格权的侵害。判决孙某向程某公开赔礼道歉，赔偿原告精神损失。宣判后，双方均未提起上诉，该判决已生效。","source_id":"SRC-CN-BJD-BIC-AI-2025"},{"kind":"significance","text":"本案中，法院认定行为人未经许可利用AI软件恶搞、丑化他人肖像构成对他人人格权的侵害，强调生成式人工智能技术的使用者应当遵守法律、行政法规，尊重社会公德和伦理道德，尊重他人合法权益，不得危害他人身心健康，明确了普通网络用户使用生成式人工智能技术的行为边界，对人工智能时代下加强自然人人格权保护具有典型意义。","source_id":"SRC-CN-BJD-BIC-AI-2025"},{"kind":"holding","source_id":"SRC-CN-WK-BIC-21163","text":"本院认为，涉案AI软件是一种AI工具，被告是该工具的使用者，被诉侵权图片是由被告自主决定生成，并在涉案微信群中发布。"},{"kind":"holding","source_id":"SRC-CN-WK-BIC-21163","text":"综上，被告的行为二不构成对原告名誉权的侵害，但构成对原告一般人格权的侵害。"},{"kind":"holding","source_id":"SRC-CN-WK-BIC-21163","text":"综上，依照《中华人民共和国民法典》第一百七十九条、第九百九十条、第九百九十五条、第一千条、第一千零一十八条、第一千零一十九条、第一千零二十四条、第一千一百八十二条、第一千一百八十三条，《中华人民共和国个人信息保护法》第二条、第七十二条之规定，判决如下："},{"kind":"holding","source_id":"SRC-CN-WK-BIC-21163","text":"二、自本判决生效之日起七日内，被告孙某赔偿原告程某精神损害抚慰金1元；"}],"generated_by":"ingest/cases/cn-bic.json","verification":"PARSED","evidence_grade":"B"},{"id":"CN-CASE-AI-DETECTION-PLATFORM","jurisdiction":"CN","forum":"北京互联网法院","forum_type":"COURT","case_numbers":[],"caption":"唐某某诉某科技有限公司网络服务合同纠纷案","short_name":"平台误判“AI 生成内容未标识”案","decided_at":null,"procedural_stage":"FIRST_INSTANCE","outcome":"CLAIMANT_PREVAILED","is_final":true,"outcome_note":"原告请求撤销隐藏和禁言处理并删除后台记录；法院判决展开被折叠的回答并删除后台记录。被告上诉后撤回，一审判决生效。案号和裁判日期来源未载。","ai_roles":["DETECTION"],"issues":["ISSUE-CONTENT-LABELLING"],"field_evidence":{"outcome":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","quote":"法院判决被告展开折叠的回答并删除相关后台记录。"}],"is_final":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","quote":"被告不服一审判决提起上诉，后撤回上诉，一审判决生效。"}],"forum":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","page_level":true,"quote":"近日，北京互联网法院召开涉人工智能案件审理情况新闻发布会，会上发布了八起典型案例。"}],"procedural_stage":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","quote":"被告不服一审判决提起上诉，后撤回上诉，一审判决生效。"}]},"legal_anchors":[{"provision":"CN-CAC-LABEL-2025#第十条","basis":"EDITORIAL","note":"该条规定用户发布生成合成内容应主动声明并标识。本案平台处理的依据是其社区公告（服务协议），来源未载援引该办法；该办法自 2025 年 9 月 1 日起施行，本案裁判日期不详，不能认定该办法适用于本案。"}],"notes":"","discovered_via":"北京互联网法院涉人工智能典型案例（北京日报客户端转载）","source_title":{"text":"案例五 唐某某诉某科技有限公司网络服务合同纠纷案——网络平台利用算法工具检测AI生成内容但未尽到合理适度说明义务的应承担违约责任","source_id":"SRC-CN-BJD-BIC-AI-2025"},"history":[],"also_reported_in":[],"scopes":{"SRC-CN-BJD-BIC-AI-2025":{"block_start":"案例五","block_end":"案例六"}},"scope_links":{},"excerpts":[{"kind":"facts","text":"原告唐某某在被告某科技有限公司运营的网络平台上发布二百多字文字内容“打工并不能让你真的赚到多少钱，但可以开启你的新视角……如果你对学车感兴趣的话并且以后打算开车的话，可以在你最清闲的一个假期完成它……工作之后就没有太多完整的时间学驾照了”。被告某科技有限公司运营的平台将该内容判定为“包含AI生成内容但未标识”的违规情况，并将该内容隐藏并作出将用户禁言一天的处理。后原告唐某某进行申诉未成功。原告唐某某主张其并未使用AI创作，被告某科技有限公司的行为违约，请求法院判令被告撤销隐藏涉案内容和禁言账号一天的违规处理，并在后台系统中删除违规处理记录。","source_id":"SRC-CN-BJD-BIC-AI-2025"},{"kind":"holding","text":"法院认为，网络用户在使用AI工具进行创作并将相关内容发布到网络平台时，应依照诚信原则如实标记。被告发布社区公告要求创作者在发布包含AIGC生成的内容时，应主动使用标识，对发布时未主动声明的内容，平台将采取适当措施进行流通限制并添加相关标识；未经标签声明，使用人工智能生成的内容构成违规。原告系平台注册用户，上述公告属于平台服务协议的组成部分，被告有权根据协议对用户发布内容是否属于AI生成合成内容进行审查和处理。在一般情况下，原告应该提供如创作底稿、原件、源文件、源数据等证明人类创作属性的初步证据，但本案中原告回答内容系即时性创作文本，客观上无法提供上述证据，由其提供上述证据不存在合理性和现实可行性。被告基于算法工具的运算结果得出涉案内容为AI生成合成的审查结论，被告既是算法工具掌控方又是结果判断方，算法工具运算过程和审查结果由被告掌控，被告应就该事实进行合理举证或解释说明。虽然被告提供了算法的备案信息，但无法确认备案信息与本案争议的关联性。被告未对算法决策依据和结果进行适度的解释和说明，未对涉案内容属于AI生成合成的判断依据和结果作出合理解释，应对其没有事实依据的情况下对涉案账户的处理行为承担违约责任。被告进行人工复核的标准要求具有非常明显的人类情感特征，该判断并不具有科学依据以及较强的说服力和可信度。法院判决被告展开折叠的回答并删除相关后台记录。被告不服一审判决提起上诉，后撤回上诉，一审判决生效。","source_id":"SRC-CN-BJD-BIC-AI-2025"},{"kind":"significance","text":"本案是对AI生成合成内容标识的标记、平台识别和治理在司法审查规则方面的有益探索，一方面肯定了网络内容服务平台利用算法工具对AI生成合成内容进行审查和处理，履行信息内容管理主体责任的积极作用；另一方面，认定网络内容服务平台在即时性创作文本场景下对使用算法自动化决策结果承担适度说明义务，并为司法审查阶段的算法解释说明程度确立了一定的标准。本案通过司法个案裁判，合理分配网络内容服务平台和用户的举证责任，推动网络内容服务平台提高算法的识别能力和决策能力，切实提升人工智能信息内容治理水平。","source_id":"SRC-CN-BJD-BIC-AI-2025"}],"generated_by":"ingest/cases/cn-bic.json","verification":"PARSED","evidence_grade":"B"},{"id":"CN-CASE-AI-FAKE-REVIEWS","jurisdiction":"CN","forum":"江苏省无锡市新吴区人民法院","forum_type":"COURT","case_numbers":["（2024）苏0214民初9489号"],"caption":"某科技公司与某软件公司等侵害商标权及不正当竞争纠纷案","short_name":"AI 批量生成测评文章引流案","decided_at":"2025-06-16","procedural_stage":"FIRST_INSTANCE","outcome":"CLAIMANT_PARTLY_PREVAILED","is_final":true,"outcome_note":"原告请求赔偿经济损失及合理开支共 5 万元并消除影响（停止侵权的两项请求在诉讼中放弃）；判决认定被诉行为不侵害商标专用权、构成不正当竞争，赔偿 3000 元，另一被告杭州某公司承担连带责任，其他请求驳回。判决书取自北大法宝（数据库转载件，不是法院或裁判文书网页面）。判决书称原告为“四川某公司”，典型案例稿称“某科技公司”。“已生效”出自最高法典型案例稿。","ai_roles":["USE_BY_PARTY"],"issues":["ISSUE-AI-UNFAIR-COMPETITION"],"field_evidence":{"case_numbers":[{"source_id":"SRC-CN-SPC-511301","quote":"一审：江苏省无锡市新吴区人民法院（2024）苏0214民初9489号"},{"source_id":"SRC-CN-PKULAW-XW-9489","quote":"(2024)苏0214民初9489号"}],"outcome":[{"source_id":"SRC-CN-SPC-511301","quote":"一审法院遂判令某软件公司赔偿某科技公司相应经济损失。"},{"source_id":"SRC-CN-PKULAW-XW-9489","quote":"4.判令某软件公司赔偿四川某公司经济损失及合理维权费用开支(包括但不限于律师费、交通费、取证费)共计5万元；"},{"source_id":"SRC-CN-PKULAW-XW-9489","quote":"故不侵犯四川某公司的案涉商标专用权。"},{"source_id":"SRC-CN-PKULAW-XW-9489","quote":"一、某软件公司于本判决发生法律效力之日起十日内赔偿四川某公司经济损失及为制止侵权行为所支付的合理开支3000元；"},{"source_id":"SRC-CN-PKULAW-XW-9489","quote":"三、驳回四川某公司的其他诉讼请求。"}],"is_final":[{"source_id":"SRC-CN-SPC-511301","quote":"该一审判决已生效。"}],"forum":[{"source_id":"SRC-CN-SPC-511301","quote":"一审：江苏省无锡市新吴区人民法院（2024）苏0214民初9489号"}],"procedural_stage":[{"source_id":"SRC-CN-SPC-511301","quote":"一审：江苏省无锡市新吴区人民法院（2024）苏0214民初9489号"}],"decided_at":[{"source_id":"SRC-CN-PKULAW-XW-9489","quote":"二〇二五年六月十六日"}]},"legal_anchors":[{"provision":"CN-AUCL-2019#第二条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-XW-9489","quote":"《中华人民共和国反不正当竞争法》第二条、第十七条","note":"判决主文前的裁判依据。判决以该条（一般条款）认定被诉行为构成不正当竞争。判决作出时适用的是 2019 年修正文本。"},{"provision":"CN-AUCL-2019#第十七条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-XW-9489","quote":"《中华人民共和国反不正当竞争法》第二条、第十七条","note":"判决主文前的裁判依据。判决作出时适用的是 2019 年修正文本。"},{"provision":"CN-SPC-AI-OPINION-2026#（十二）","basis":"EDITORIAL","note":"该条末句规定利用人工智能实施虚假宣传、刷量刷单等构成不正当竞争的责任。该意见晚于本案判决发布，不是本案裁判依据。"}],"notes":"判决另依据商标法第四十八条、公司法第二十三条第三款、《最高人民法院关于适用〈中华人民共和国反不正当竞争法〉若干问题的解释》第一条、第三条、第二十三条，这些未入库，故不设锚点。","discovered_via":"最高人民法院 2026 年反不正当竞争典型案例发布页","source_title":{"text":"案例六 利用AI虚构他人产品测评文章搭车引流构成不正当竞争——某科技公司与某软件公司等侵害商标权及不正当竞争纠纷案","source_id":"SRC-CN-SPC-511301"},"history":[],"also_reported_in":[],"scopes":{"SRC-CN-PKULAW-XW-9489":null,"SRC-CN-SPC-511301":{"block_start":"案例六","block_end":"案例七"}},"scope_links":{},"excerpts":[{"kind":"facts","text":"某科技公司主营销售进销存软件产品等业务。某软件公司为同业经营者。某软件公司以“进销存”为词根，利用AI批量生成文章标题，再交由AI自动生成相应文章，文章内容均为对某科技公司进销存软件的介绍和点评。某软件公司在自有网站发布上述文章，并在文章前后位置设置了指向其自有进销存软件产品的链接。某科技公司认为，某软件公司的上述行为构成不正当竞争，遂诉至法院。","source_id":"SRC-CN-SPC-511301"},{"kind":"holding","text":"江苏省无锡市新吴区人民法院一审认为，某软件公司利用人工智能等工具批量生成大量针对他人“进销存”软件的介绍、点评文章，并将其中含有“某进销存软件”字样的多篇文章发布至其官网，目的是利用搜索引擎的自然检索规则，使其官网发布的多篇涉案文章可以被检索并呈现至相关公众的检索结果中，以吸引相关公众点击文章中设置的其自有产品链接，实现引流目的。该行为降低了某科技公司的用户流量和交易机会，同时在网络中制造了大量垃圾信息，造成数据污染，扰乱了竞争秩序，构成不正当竞争。一审法院遂判令某软件公司赔偿某科技公司相应经济损失。该一审判决已生效。","source_id":"SRC-CN-SPC-511301"},{"kind":"significance","text":"本案是适用反不正当竞争法一般条款规制新类型不正当竞争行为的典型案例。判决明确，利用AI技术批量生成、发布虚构测评文章，搭载自身产品或服务进行引流的行为，有违诚实信用原则和商业道德，构成不当截取他人交易机会的不正当竞争行为。本案对稳妥适用反不正当竞争法一般条款，有效规制新类型不正当竞争行为，依法规范新兴领域竞争秩序具有示范作用。","source_id":"SRC-CN-SPC-511301"},{"kind":"holding","source_id":"SRC-CN-PKULAW-XW-9489","text":"综上所述，依照《中华人民共和国商标法》第四十八条，《中华人民共和国反不正当竞争法》第二条、第十七条，《中华人民共和国公司法》第二十三条第三款，《最高人民法院关于适用\u003c中华人民共和国反不正当竞争法>若干问题的解释》第一条、第三条、第二十三条，《最高人民法院关于适用\u003c中华人民共和国民事诉讼法>的解释》第九十条规定，判决如下："},{"kind":"holding","source_id":"SRC-CN-PKULAW-XW-9489","text":"一、某软件公司于本判决发生法律效力之日起十日内赔偿四川某公司经济损失及为制止侵权行为所支付的合理开支3000元；"}],"generated_by":"ingest/cases/cn-spc.json","verification":"PARSED","evidence_grade":"B"},{"id":"CN-CASE-AI-IMAGE-AUTHORSHIP","jurisdiction":"CN","forum":"北京互联网法院","forum_type":"COURT","case_numbers":["（2023）京0491民初11279号"],"caption":"李某某诉刘某某侵害作品署名权和信息网络传播权纠纷案","short_name":"“AI 文生图”著作权案","decided_at":"2023-11-27","procedural_stage":"FIRST_INSTANCE","outcome":"CLAIMANT_PARTLY_PREVAILED","is_final":true,"outcome_note":"原告请求赔偿经济损失 5000 元，判决赔偿 500 元并赔礼道歉，其他请求驳回。判决书取自维基文库的裁判文书网存档件（第三方存档，当事人姓名已隐去）；其裁判依据条文与北京互联网法院英文网站发布的英译本一致。“已生效”出自法院典型案例稿。","ai_roles":["OUTPUT"],"issues":["ISSUE-AI-OUTPUT-COPYRIGHTABILITY"],"field_evidence":{"case_numbers":[{"source_id":"SRC-CN-BJD-BIC-TOP10-2025","quote":"——李某某诉刘某某侵害作品署名权和信息网络传播权纠纷案案例索引北京互联网法院（2023）京0491民初11279号"},{"source_id":"SRC-CN-WS-BIC-11279","quote":"（2023）京0491民初11279号"}],"outcome":[{"source_id":"SRC-CN-WS-BIC-11279","quote":"2.请求判令被告赔偿原告经济损失5000元。"},{"source_id":"SRC-CN-WS-BIC-11279","quote":"二、被告刘 于本判决生效之日起七日内赔偿原告李 经济损失500元；"},{"source_id":"SRC-CN-WS-BIC-11279","quote":"三、驳回原告李 的其他诉讼请求。"}],"is_final":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","quote":"宣判后，双方均未提起上诉，该判决已生效。"}],"forum":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","page_level":true,"quote":"近日，北京互联网法院召开涉人工智能案件审理情况新闻发布会，会上发布了八起典型案例。"}],"procedural_stage":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","quote":"宣判后，双方均未提起上诉，该判决已生效。"}],"decided_at":[{"source_id":"SRC-CN-WS-BIC-11279","quote":"二〇二三年十一月二十七日"}]},"legal_anchors":[{"provision":"CN-COPYRIGHT-LAW#第十条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-WS-BIC-11279","quote":"综上，依据《中华人民共和国著作权法》第十条第一款第二项、第十二项，第五十三条，第五十四条，本院判决如下：","note":"判决主文前的裁判依据。判决适用的是第一款第二项（署名权）和第十二项（信息网络传播权）。"},{"provision":"CN-COPYRIGHT-LAW#第五十三条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-WS-BIC-11279","quote":"综上，依据《中华人民共和国著作权法》第十条第一款第二项、第十二项，第五十三条，第五十四条，本院判决如下：","note":"判决主文前的裁判依据。"},{"provision":"CN-COPYRIGHT-LAW#第五十四条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-WS-BIC-11279","quote":"综上，依据《中华人民共和国著作权法》第十条第一款第二项、第十二项，第五十三条，第五十四条，本院判决如下：","note":"判决主文前的裁判依据。"},{"provision":"CN-COPYRIGHT-LAW#第三条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-WS-BIC-11279","quote":"《中华人民共和国著作权法》（以下简称著作权法）第三条规定：“本法所称的作品，是指文学、艺术和科学领域内具有独创性并能以一定形式表现的智力成果。”","note":"说理部分援引，用于判断涉案图片是否构成作品；不在主文前的裁判依据之列。"},{"provision":"CN-COPYRIGHT-LAW#第十一条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-WS-BIC-11279","quote":"著作权法第十一条第一款规定：“著作权属于作者，本法另有规定的除外。”","note":"说理部分援引，用于认定作者；不在主文前的裁判依据之列。"}],"notes":"","discovered_via":"北京互联网法院涉人工智能典型案例（北京日报客户端转载）","also_reported_in":[{"source_id":"SRC-CN-BIC-11279-EN","locator":"","note":"北京互联网法院英文网站发布的本案判决书英译本。其所载裁判依据为著作权法第十条第一款第二项、第十二项，第五十三条，第五十四条，日期为 2023 年 11 月 27 日，与中文存档件一致。英译本不含中文案名和案号写法，未用作字段出处。"}],"source_title":{"text":"案例一 李某某诉刘某某侵害作品署名权和信息网络传播权纠纷案——AI文生图的法律属性及权利归属的认定","source_id":"SRC-CN-BJD-BIC-AI-2025"},"history":[],"scopes":{"SRC-CN-BJD-BIC-TOP10-2025":{"block_start":"“AI文生图”著作权侵权案：","block_end":"主办法官"},"SRC-CN-WS-BIC-11279":{"block_start":"民 事 判 决 书","block_end":"本作品是"},"SRC-CN-BJD-BIC-AI-2025":{"block_start":"案例一","block_end":"案例二"}},"scope_links":{},"excerpts":[{"kind":"facts","text":"2023年2月24日，原告李某某为画出一幅在黄昏的光线条件下具有摄影风格的少女特写，使用生成式人工智能大模型Stable Diffusion，通过选取模型、输入提示词及反向提示词、设置生成参数等操作生成图片，并于2023年2月26日发布在小红书平台。2023年3月2日，被告刘某某在其注册及使用的百家号账号发布文章，将涉案图片作为配图，配图中截去了原告的署名水印，未说明图片具体来源。据此，原告李某某提起诉讼，请求判令被告刘某某赔礼道歉并赔偿经济损失。经当庭勘验，在使用生成式人工智能大模型Stable Diffusion时，通过变更个别提示词或者变更个别参数，大模型生成的图片不同。","source_id":"SRC-CN-BJD-BIC-AI-2025"},{"kind":"holding","text":"法院认为，从涉案图片的外观上来看，涉案图片与通常人们见到的照片、绘画无异，显然属于艺术领域，且具有一定的表现形式。涉案图片系原告利用生成式人工智能技术生成的，从原告构思涉案图片起，到最终选定涉案图片止，原告进行了一定的智力投入，故涉案图片具备“智力成果”要件。从涉案图片本身来看，体现出了与在先作品存在可以识别的差异性，体现了原告的选择和安排，调整修正过程亦体现了原告的审美选择和个性判断。在无相反证据的情况下，可以认定涉案图片由原告独立完成，体现出了原告的个性化表达，故涉案图片具备“独创性”要件。涉案图片是以线条、色彩构成的有审美意义的平面造型艺术作品，属于美术作品，受到著作权法的保护。就涉案作品的权利归属而言，著作权法规定，作者限于自然人、法人或非法人组织，因此人工智能模型本身无法成为我国著作权法上的作者。原告根据需要对涉案人工智能模型进行相关设置，并最终选定涉案图片的人，涉案图片是基于原告的智力投入直接产生，且体现出原告的个性化表达，故原告是涉案图片的作者，享有涉案图片的著作权。被告未经许可，使用涉案图片作为配图并发布在自己的账号中，使公众可以在其选定的时间和地点获得涉案图片，侵害了原告就涉案图片享有的信息网络传播权。此外，被告将涉案图片进行去除署名水印的处理，侵害了原告的署名权，应当承担侵权责任。判决被告刘某某赔礼道歉并赔偿经济损失。宣判后，双方均未提起上诉，该判决已生效。","source_id":"SRC-CN-BJD-BIC-AI-2025"},{"kind":"significance","text":"本案明确人利用人工智能生成的内容，若符合作品的定义，则应被认定为作品，受到著作权法保护。同时人工智能生成内容的著作权权属可根据开发者、使用者、所有者等各参与方对人工智能生成内容的独创性智力贡献进行认定。本案在回应技术变革带来权利认定新问题的同时，为人工智能生成内容的司法审查提供了制度适应与规则回应的实践范式，具有引领性和方向性意义。本案入选新时代推动法治进程2024年度十大提名案件，2024中国数字经济发展与法治建设十个重大影响力事件、2023年度中国法治实施十大事件等。","source_id":"SRC-CN-BJD-BIC-AI-2025"},{"kind":"holding","source_id":"SRC-CN-WS-BIC-11279","text":"综上，依据《中华人民共和国著作权法》第十条第一款第二项、第十二项，第五十三条，第五十四条，本院判决如下："},{"kind":"holding","source_id":"SRC-CN-WS-BIC-11279","text":"二、被告刘 于本判决生效之日起七日内赔偿原告李 经济损失500元；"}],"generated_by":"ingest/cases/cn-bic.json","verification":"PARSED","evidence_grade":"B"},{"id":"CN-CASE-AI-VOICE","jurisdiction":"CN","forum":"北京互联网法院","forum_type":"COURT","case_numbers":["（2023）京0491民初12142号"],"caption":"殷某某诉某智能科技公司等人格权侵权纠纷案","short_name":"AI 生成声音人格权案","decided_at":"2024-04-23","procedural_stage":"FIRST_INSTANCE","outcome":"CLAIMANT_PARTLY_PREVAILED","is_final":true,"outcome_note":"原告请求五被告连带赔偿经济损失 50 万元、精神损失 10 万元；判决由被告某文化传媒公司、某软件公司连带赔偿经济损失 25 万元，其他请求驳回。判决书取自知识产权律师网的转载件（注明来源中国裁判文书网），不是法院或裁判文书网页面。“已生效”出自法院典型案例稿。","ai_roles":["TRAINING","OUTPUT"],"issues":["ISSUE-PERSONALITY-DEEPFAKE"],"field_evidence":{"case_numbers":[{"source_id":"SRC-CN-BJD-BIC-TOP10-2025 ITED_IN_SOURCE","source_id":"SRC-CN-CIP-BIC-12142","quote":"综上，本院依照《中华人民共和国民法典》第九百九十五条、第一千条、第一千零一十八条、第一千零一十九条、第一千零二十三条第二款、第一千一百六十五条、第一千一百六十八条、第一千一百八十二条、第一千一百八十三条","note":"判决主文前的裁判依据。"},{"provision":"CN-CIVIL-CODE#第一千一百六十八条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-CIP-BIC-12142","quote":"综上，本院依照《中华人民共和国民法典》第九百九十五条、第一千条、第一千零一十八条、第一千零一十九条、第一千零二十三条第二款、第一千一百六十五条、第一千一百六十八条、第一千一百八十二条、第一千一百八十三条","note":"判决主文前的裁判依据。"},{"provision":"CN-CIVIL-CODE#第一千一百八十二条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-CIP-BIC-12142","quote":"综上，本院依照《中华人民共和国民法典》第九百九十五条、第一千条、第一千零一十八条、第一千零一十九条、第一千零二十三条第二款、第一千一百六十五条、第一千一百六十八条、第一千一百八十二条、第一千一百八十三条","note":"判决主文前的裁判依据。"},{"provision":"CN-CIVIL-CODE#第一千一百八十三条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-CIP-BIC-12142","quote":"综上，本院依照《中华人民共和国民法典》第九百九十五条、第一千条、第一千零一十八条、第一千零一十九条、第一千零二十三条第二款、第一千一百六十五条、第一千一百六十八条、第一千一百八十二条、第一千一百八十三条","note":"判决主文前的裁判依据。"},{"provision":"CN-SPC-AI-OPINION-2026#（四）","basis":"EDITORIAL","note":"该条规定未经同意以自然人声音作训练语料、生成可识别的合成人声时的声音权益保护。该意见晚于本案发布，不是本案裁判依据。"},{"provision":"CN-CAC-DEEPSYN-2022#第十四条","basis":"EDITORIAL","note":"该条要求提供人声等生物识别信息编辑功能时提示使用者取得被编辑个人的单独同意。来源未载本案援引该规定。"}],"notes":"","discovered_via":"北京互联网法院涉人工智能典型案例（北京日报客户端转载）","source_title":{"text":"案例二 殷某某诉某智能科技公司等人格权侵权纠纷案——自然人声音权益可及于AI生成声音","source_id":"SRC-CN-BJD-BIC-AI-2025"},"history":[],"also_reported_in":[],"scopes":{"SRC-CN-BJD-BIC-TOP10-2025":{"block_start":"自然人声音权益可及于AI生成声音","block_end":"主办法官"},"SRC-CN-CIP-BIC-12142":{"block_start":"民 事 判 决 书","block_end":"上一篇"},"SRC-CN-BJD-BIC-AI-2025":{"block_start":"案例二","block_end":"案例三"}},"scope_links":{"SRC-CN-BJD-BIC-TOP10-2025":"该页案名写作“殷某某诉某智能公司等人格权侵权案”，与法院典型案例稿的案名略有出入；编者按当事人称谓和裁判要点认定为同一案件，案号由此而来。该案号的判决书所载原告殷某某、五名被告和案情与典型案例稿相符。"},"excerpts":[{"kind":"facts","text":"原告殷某某是一名配音演员，发现他人利用其配音制作的作品在多个知名APP广泛流传。经声音筛选和溯源，发现上述作品中的声音来自于被告一某智能科技公司运营的平台中的文本转语音产品。原告曾接受被告二某文化传媒公司的委托录制录音制品，被告二为录音制品的著作权人。后被告二将原告为其录制的录音制品的音频提供给被告三某软件公司。被告三仅以原告录制的一部录音制品作为素材进行AI化处理，生成了涉案文本转语音产品并在被告四某网络科技公司运营的云服务平台对外出售。被告一某智能科技公司与被告五某科技发展公司签订在线服务买卖合同，由被告五向被告三下单采购，其中包括了涉案文本转语音产品。被告一某智能科技公司采取应用程序接口形式，在未经技术处理的情况下，直接调取并生成文本转语音产品在其平台中使用。原告主张，被告的行为已经严重侵犯了原告的声音权益，被告一某智能科技公司、被告三某软件公司应立即停止侵权、赔礼道歉，五被告应当赔偿原告经济损失、精神损失。","source_id":"SRC-CN-BJD-BIC-AI-2025"},{"kind":"holding","text":"法院认为，自然人声音以声纹、音色、频率为区分，具有独特性、唯一性、稳定性特点，能够给他人形成或引起一般人产生与该自然人有关的思想或感情活动，可以对外展示个人的行为和身份。自然人声音的可识别性是指在他人反复多次或长期聆听的基础上，通过该声音特征能识别出特定自然人。利用人工智能合成的声音，如果能使一般社会公众或者相关领域的公众根据其音色、语调和发音风格，关联到该自然人，可以认定为具有可识别性。本案中，因被告三系仅使用原告个人声音开发涉案文本转语音产品，而且经当庭勘验，该AI声音与原告的音色、语调、发音风格等具有高度一致性，能够引起一般人产生与原告有关的思想或感情活动，能够将该声音联系到原告本人，进而识别出原告的主体身份。被告二对录音制品享有著作权等权利，但不包括授权他人对原告声音进行AI化使用的权利。被告二与被告三公司签订数据协议，在未经原告本人知情同意的情况下，授权被告三AI化使用原告声音的行为无合法权利来源。因此，被告二、被告三关于获得原告合法授权的抗辩不能成立。被告二、被告三未经原告许可AI化使用了原告声音，构成对原告声音权益的侵犯，其侵权行为造成了原告声音权益受损的后果，应承担相应的法律责任。被告一、被告四、被告五主观上不存在过错，不承担损害赔偿责任。因此，综合考量被告侵权情节、同类市场产品价值、产品播放量等因素，对损害赔偿予以酌定。判决被告一、被告三向原告书面赔礼道歉，被告二、被告三赔偿原告经济损失。宣判后，双方均未提起上诉，该判决已生效。","source_id":"SRC-CN-BJD-BIC-AI-2025"},{"kind":"significance","text":"本案明确了经人工智能技术处理的声音受声音权保护的认定标准，为新业态、新技术的应用划定了行为界限，有助于规范和引导人工智能技术沿着为民、向善的方向发展。本案入选最高人民法院发布的民法典颁布五周年典型案例，利用网络、信息技术侵害人格权典型案例，2024年度中国十大传媒法事例。","source_id":"SRC-CN-BJD-BIC-AI-2025"},{"kind":"holding","source_id":"SRC-CN-CIP-BIC-12142","text":"综上，本院依照《中华人民共和国民法典》第九百九十五条、第一千条、第一千零一十八条、第一千零一十九条、第一千零二十三条第二款、第一千一百六十五条、第一千一百六十八条、第一千一百八十二条、第一千一百八十三条"},{"kind":"holding","source_id":"SRC-CN-CIP-BIC-12142","text":"二、被告某文化传媒公司、被告某软件公司连带赔偿原告殷某某经济损失25万元；"}],"generated_by":"ingest/cases/cn-bic.json","verification":"PARSED","evidence_grade":"B"},{"id":"CN-CASE-FACE-SWAP-COPYRIGHT","jurisdiction":"CN","forum":"上海市嘉定区人民法院","forum_type":"COURT","case_numbers":["（2024）沪0114民初1326号"],"caption":"陈某与上海易某网络科技有限公司侵害作品信息网络传播权纠纷","short_name":"“AI 换脸”著作权侵权案","decided_at":"2024-04-29","procedural_stage":"FIRST_INSTANCE","outcome":"CLAIMANT_PARTLY_PREVAILED","is_final":true,"outcome_note":"原告请求赔偿经济损失 4.8 万元和合理维权费用 2000 元，法院判赔共计 7500 元；下架视频、赔礼道歉的请求由原告撤回，其余请求不予支持。判决书取自北大法宝（数据库转载件，不是法院或裁判文书网页面）。来源载“双方当事人均未上诉”，未逐字写明“已生效”。","ai_roles":["DEPLOYMENT","OUTPUT"],"issues":["ISSUE-PROVIDER-LIABILITY"],"field_evidence":{"case_numbers":[{"source_id":"SRC-CN-SPC-462881","quote":"一审：上海市嘉定区人民法院（2024）沪0114民初1326号"},{"source_id":"SRC-CN-PKULAW-JD-1326","quote":"(2024)沪0114民初1326号"}],"outcome":[{"source_id":"SRC-CN-SPC-462881","quote":"赔偿损失4.8万元和合理开支2000元。"},{"source_id":"SRC-CN-SPC-462881","quote":"据此，判决上海易某网络科技有限公司赔偿陈某经济损失及合理开支共计7500元。"},{"source_id":"SRC-CN-PKULAW-JD-1326","quote":"2.判令被告赔偿原告经济损失48,000元及合理维权费用2,000元，共计50,000元。"},{"source_id":"SRC-CN-PKULAW-JD-1326","quote":"原告对此表示谅解并撤回要求被告下架视频、赔礼道歉的诉讼请求。"},{"source_id":"SRC-CN-PKULAW-JD-1326","quote":"一、被告某某公司1应于本判决生效之日起十日内赔偿原告陈某经济损失及合理维权费用共计7,500元；"},{"source_id":"SRC-CN-PKULAW-JD-1326","quote":"二、原告陈某的其余诉讼请求，不予支持。"}],"is_final":[{"source_id":"SRC-CN-SPC-462881","quote":"一审判决后，双方当事人均未上诉。"}],"forum":[{"source_id":"SRC-CN-SPC-462881","quote":"一审：上海市嘉定区人民法院（2024）沪0114民初1326号"}],"procedural_stage":[{"source_id":"SRC-CN-SPC-462881","quote":"一审：上海市嘉定区人民法院（2024）沪0114民初1326号"}],"decided_at":[{"source_id":"SRC-CN-PKULAW-JD-1326","quote":"二〇二四年四月二十九日"}]},"legal_anchors":[{"provision":"CN-COPYRIGHT-LAW#第三条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-JD-1326","quote":"综上所述，依照《中华人民共和国著作权法》第三条第六项、第十条第一款第十二项、第五十三条第一项、第五十四条第一款、第二款、第三款","note":"判决主文前的裁判依据。判决适用的是第六项（视听作品）。"},{"provision":"CN-COPYRIGHT-LAW#第十条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-JD-1326","quote":"综上所述，依照《中华人民共和国著作权法》第三条第六项、第十条第一款第十二项、第五十三条第一项、第五十四条第一款、第二款、第三款","note":"判决主文前的裁判依据。判决适用的是第一款第十二项（信息网络传播权）。"},{"provision":"CN-COPYRIGHT-LAW#第五十三条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-JD-1326","quote":"综上所述，依照《中华人民共和国著作权法》第三条第六项、第十条第一款第十二项、第五十三条第一项、第五十四条第一款、第二款、第三款","note":"判决主文前的裁判依据。判决适用的是第一项。"},{"provision":"CN-COPYRIGHT-LAW#第五十四条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-JD-1326","quote":"综上所述，依照《中华人民共和国著作权法》第三条第六项、第十条第一款第十二项、第五十三条第一项、第五十四条第一款、第二款、第三款","note":"判决主文前的裁判依据。"},{"provision":"CN-SPC-AI-OPINION-2026#（十二）","basis":"EDITORIAL","note":"该条规定人工智能生成内容侵害著作权时开发者、提供者、使用者责任的考量因素。该意见晚于本案判决发布，不是本案裁判依据。"}],"notes":"判决另依据《最高人民法院关于审理著作权民事纠纷案件适用法律若干问题的解释》第七条、《最高人民法院关于审理侵害信息网络传播权民事纠纷案件适用法律若干问题的规定》第三条，这两件司法解释未入库。","discovered_via":"最高人民法院 2024 年知识产权典型案例发布页","source_title":{"text":"案例4.“AI换脸”著作权侵权案 【陈某与上海易某网络科技有限公司侵害作品信息网络传播权纠纷】一审：上海市嘉定区人民法院（2024）沪0114民初1326号","source_id":"SRC-CN-SPC-462881"},"history":[],"also_reported_in":[],"scopes":{"SRC-CN-PKULAW-JD-1326":null,"SRC-CN-SPC-462881":{"block_start":"案例4.","block_end":"案例5."}},"scope_links":{},"excerpts":[{"kind":"facts","text":"陈某在抖音平台实名认证账号“摄影师某某”，发布13段其拍摄的女子身着古装展示的短视频，每段时长10秒左右。上海易某网络科技有限公司开发抖音小程序“某颜”，使用AI视频合成算法为用户提供换脸技术。“某颜”上展示的13段短视频与陈某发布的13段短视频，仅在人物面部五官特征上存在差别，视频场景、镜头、人物造型、动作则基本一致。“某颜”用户可通过观看广告或购买会员，将小程序上展示的视频中的人脸换成用户自己的人脸并进行保存。陈某提起诉讼，请求判令上海易某网络科技有限公司停止侵权、赔礼道歉，赔偿损失4.8万元和合理开支2000元。","source_id":"SRC-CN-SPC-462881"},{"kind":"holding","text":"上海市嘉定区人民法院一审认为，陈某拍摄的原始视频在内容编排、景别选取、拍摄角度等方面体现了独创性的选择安排，属于受著作权法保护的视听作品。“某颜”小程序展示的涉案视频，系通过AI算法将原始视频进行局部替换合成，二者构成实质性相似。上海易某网络科技有限公司以“AI换脸”为卖点，提供平台、素材和技术，使用户能够在任意选定的时间和地点以“换脸”方式使用原始视频，谋取商业利益，侵害了陈某作品信息网络传播权。该行为既非独创性改编，亦不构成合理使用，也不适用技术中立抗辩。上海易某网络科技有限公司在诉讼中积极配合删除视频、履行算法备案手续等整改行为，并接受关于运用算法技术提供网络服务的司法建议，作出规范经营承诺。陈某表示谅解并撤回停止侵权、赔礼道歉的诉请。据此，判决上海易某网络科技有限公司赔偿陈某经济损失及合理开支共计7500元。一审判决后，双方当事人均未上诉。","source_id":"SRC-CN-SPC-462881"},{"kind":"significance","text":"本案系生成合成类算法应用场景下的典型纠纷，涉及使用人工智能技术对他人作品进行局部合成行为的性质认定。本案判决明确了“AI换脸”不构成对原作品的独创性改编与合理使用；使用人工智能技术提供网络服务者负有合理注意义务，不得利用算法技术侵害他人著作权。本案平衡兼顾技术创新和权利保护，明晰了人工智能技术应用的合法边界。人民法院聚焦新兴技术创新应用和算法治理需求，促使企业加强对素材来源及生成内容的合法性审查和算法安全评估，强化知识产权和人格权益保护，引导企业规范数字化转型。","source_id":"SRC-CN-SPC-462881"},{"kind":"holding","source_id":"SRC-CN-PKULAW-JD-1326","text":"综上所述，依照《中华人民共和国著作权法》第三条第六项、第十条第一款第十二项、第五十三条第一项、第五十四条第一款、第二款、第三款，《最高人民法院关于审理著作权民事纠纷案件适用法律若干问题的解释》第七条，《最高人民法院关于审理侵害信息网络传播权民事纠纷案件适用法律若干问题的规定》第三条及《中华人民共和国民事诉讼法》第十三条第二款、第六十七条第一款之规定，判决如下："},{"kind":"holding","source_id":"SRC-CN-PKULAW-JD-1326","text":"一、被告某某公司1应于本判决生效之日起十日内赔偿原告陈某经济损失及合理维权费用共计7,500元；"}],"generated_by":"ingest/cases/cn-spc.json","verification":"PARSED","evidence_grade":"B"},{"id":"CN-CASE-FACE-SWAP-PERSONAL-INFO","jurisdiction":"CN","forum":"北京互联网法院","forum_type":"COURT","case_numbers":["（2023）京0491民初3820号"],"caption":"廖某诉某科技文化有限公司网络侵权责任纠纷案","short_name":"“AI 换脸”个人信息权益案","decided_at":"2024-06-26","procedural_stage":"FIRST_INSTANCE","outcome":"CLAIMANT_PARTLY_PREVAILED","is_final":true,"outcome_note":"原告主张肖像权和个人信息权益受侵害，请求书面赔礼道歉、赔偿经济损失 3 万元和精神损失 2 万元；法院不支持肖像权主张，认定侵害个人信息权益，判决书面赔礼道歉、赔偿精神损失 500 元和财产损失（含合理维权费用）1500 元，其他请求驳回。判决书取自北大法宝（数据库转载件，不是法院或裁判文书网页面）。案号和裁判日期出自该判决书；典型案例稿没有案号，二者的对应是编者核对的结果（见对应说明）。“已生效”出自法院典型案例稿。","ai_roles":["DEPLOYMENT"],"issues":["ISSUE-PERSONALITY-DEEPFAKE"],"field_evidence":{"outcome":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","quote":"因此，被告的行为不构成对原告肖像权的侵害。"},{"source_id":"SRC-CN-BJD-BIC-AI-2025","quote":"被告处理该信息未经过原告同意，因此构成对原告个人信息权益的侵害。"},{"source_id":"SRC-CN-BJD-BIC-AI-2025","quote":"判决被告向原告书面致歉，赔偿原告精神损失及精神抚慰金。"},{"source_id":"SRC-CN-PKULAW-BIC-3820","quote":"2.被告赔偿原告经济损失3万元(含律师费4000元、取证费1000元)；3.被告赔偿原告精神损失2万元。"},{"source_id":"SRC-CN-PKULAW-BIC-3820","quote":"二、被告某文化有限公司于本判决生效之日起七日内赔偿原告廖某精神损失500元；"},{"source_id":"SRC-CN-PKULAW-BIC-3820","quote":"三、被告某文化有限公司于本判决生效之日起七日内赔偿原告廖某财产损失(含合理维权费用)1500元；"},{"source_id":"SRC-CN-PKULAW-BIC-3820","quote":"四、驳回原告廖某的其他诉讼请求。"}],"is_final":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","quote":"宣判后，双方均未提起上诉，该判决已生效。"}],"forum":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","page_level":true,"quote":"近日，北京互联网法院召开涉人工智能案件审理情况新闻发布会，会上发布了八起典型案例。"}],"procedural_stage":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","quote":"宣判后，双方均未提起上诉，该判决已生效。"}],"case_numbers":[{"source_id":"SRC-CN-PKULAW-BIC-3820","quote":"(2023)京0491民初3820号"}],"decided_at":[{"source_id":"SRC-CN-PKULAW-BIC-3820","quote":"二〇二四年六月二十六日"}]},"legal_anchors":[{"provision":"CN-PIPL-2021#第四条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-BIC-3820","quote":"综上，依照《中华人民共和国个人信息保护法》第四条、第二十七条、第四十四条、第六十九条","note":"判决主文前的裁判依据。"},{"provision":"CN-PIPL-2021#第二十七条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-BIC-3820","quote":"综上，依照《中华人民共和国个人信息保护法》第四条、第二十七条、第四十四条、第六十九条","note":"判决主文前的裁判依据。"},{"provision":"CN-PIPL-2021#第四十四条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-BIC-3820","quote":"综上，依照《中华人民共和国个人信息保护法》第四条、第二十七条、第四十四条、第六十九条","note":"判决主文前的裁判依据。"},{"provision":"CN-PIPL-2021#第六十九条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-BIC-3820","quote":"综上，依照《中华人民共和国个人信息保护法》第四条、第二十七条、第四十四条、第六十九条","note":"判决主文前的裁判依据。"},{"provision":"CN-CIVIL-CODE#第九百九十五条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-BIC-3820","quote":"《中华人民共和国民法典》第九百九十五条、第一千一百八十二条、第一千一百八十三条","note":"判决主文前的裁判依据。"},{"provision":"CN-CIVIL-CODE#第一千一百八十二条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-BIC-3820","quote":"《中华人民共和国民法典》第九百九十五条、第一千一百八十二条、第一千一百八十三条","note":"判决主文前的裁判依据。"},{"provision":"CN-CIVIL-CODE#第一千一百八十三条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-BIC-3820","quote":"《中华人民共和国民法典》第九百九十五条、第一千一百八十二条、第一千一百八十三条","note":"判决主文前的裁判依据。"},{"provision":"CN-CAC-DEEPSYN-2022#第十四条","basis":"EDITORIAL","note":"该条规定训练数据含个人信息时应遵守个人信息保护规定，提供人脸编辑功能应提示取得单独同意。判决书未援引该规定。"}],"notes":"判决另依据《最高人民法院关于审理利用信息网络侵害人身权益民事纠纷案件适用法律若干问题的规定》第十一条、第十二条，该司法解释未入库。","discovered_via":"北京互联网法院涉人工智能典型案例（北京日报客户端转载）","source_title":{"text":"案例四 廖某诉某科技文化有限公司网络侵权责任纠纷案——未经授权对包含他人肖像的视频进行“AI换脸”处理构成对他人个人信息权益的侵害","source_id":"SRC-CN-BJD-BIC-AI-2025"},"history":[],"also_reported_in":[],"scopes":{"SRC-CN-PKULAW-BIC-3820":null,"SRC-CN-BJD-BIC-AI-2025":{"block_start":"案例四","block_end":"案例五"}},"scope_links":{"SRC-CN-PKULAW-BIC-3820":"典型案例稿没有案号，案名写作“廖某诉某科技文化有限公司”，判决书写作“廖某诉某文化有限公司”。编者认定为同一案件的依据：同为北京互联网法院、网络侵权责任纠纷、原告廖某；案情同为被告用原告出镜的古风视频制作换脸模板供用户付费使用；裁判要点同为不构成侵害肖像权、构成侵害个人信息权益；判项同为书面赔礼道歉并赔偿。"},"excerpts":[{"kind":"facts","text":"原告廖某是一名古风短视频博主，在全网拥有较多粉丝，被告某科技文化有限公司在未经其授权同意的情况下，使用原告出镜的系列视频制作换脸模板，并上传至涉案软件中，提供给用户付费以此牟利。原告认为被告的行为侵犯其肖像权与个人信息权益，要求被告书面赔礼道歉、并赔偿原告经济损失与精神损失。被告某科技文化有限公司认为，被告平台发布的视频均有合法来源，并且面部特征并非原告，并未侵害原告肖像权。此外，涉案软件所使用的“换脸技术”实际由第三方提供，被告并未处理原告的个人信息，并未侵害原告的个人信息权益。经法院查明，涉案换脸模板视频与原告创作的系列视频的妆容、发型、服饰、动作、灯光及镜头切换呈现一致特征，但出镜人的面部特征均不相同且并非原告。涉案软件通过第三方公司的服务实现换脸功能，用户交纳会员费可以解锁所有换脸功能。","source_id":"SRC-CN-BJD-BIC-AI-2025"},{"kind":"holding","text":"法院认为，判断是否侵犯肖像权的关键在于是否具备可识别性，可识别性强调肖像的本质在于指向特定的人，而肖像的范围以面部为核心，也可能涉及独特的身体部位、声音、识别性较高的特定动作等能够与特定自然人对应的部分。本案中，被告虽然使用原告的视频制作视频模板，但并未利用原告的肖像，而是通过技术手段将原告面部特征替换，模板中所保留的妆容、发型、服饰、灯光、镜头切换等要素并非与特定自然人不可分割，与自然人与生俱来的人格要素存在区别，一般公众通过替换后的视频识别的主体为案外人而非本案原告。同时，被告将视频模板提供给用户使用的行为并未丑化、污损、伪造原告肖像。因此，被告的行为不构成对原告肖像权的侵害。但是，被告收集了包含原告人脸信息的出镜视频，将该视频中的原告面部替换成自己提供的照片中面部，该合成过程需要将新的静态图片中的特征与原视频部分面部特征、表情等通过算法进行融合。上述过程，涉及对原告个人信息的收集、使用、分析等，属于对原告个人信息的处理。被告处理该信息未经过原告同意，因此构成对原告个人信息权益的侵害。对于被告擅自使用他人制作的视频侵害他人创造性劳动成果的，应由相应权利人主张权利。判决被告向原告书面致歉，赔偿原告精神损失及精神抚慰金。宣判后，双方均未提起上诉，该判决已生效。","source_id":"SRC-CN-BJD-BIC-AI-2025"},{"kind":"significance","text":"本案围绕“AI换脸”这一新商业模式，对于生成合成式人工智能应用过程中的肖像权、个人信息权益及基于劳动创造投入的合法权益进行准确区分，既维护自然人的合法权益，又为人工智能技术和新兴产业发展留有合理空间，对于服务和保障数字经济规范健康发展有重要意义。","source_id":"SRC-CN-BJD-BIC-AI-2025"},{"kind":"holding","source_id":"SRC-CN-PKULAW-BIC-3820","text":"综上，依照《中华人民共和国个人信息保护法》第四条、第二十七条、第四十四条、第六十九条，《中华人民共和国民法典》第九百九十五条、第一千一百八十二条、第一千一百八十三条，《最高人民法院关于审理利用信息网络侵害人身权益民事纠纷案件适用法律若干问题的规定》第十一条、第十二条的规定，判决如下："},{"kind":"holding","source_id":"SRC-CN-PKULAW-BIC-3820","text":"二、被告某文化有限公司于本判决生效之日起七日内赔偿原告廖某精神损失500元；"},{"kind":"holding","source_id":"SRC-CN-PKULAW-BIC-3820","text":"三、被告某文化有限公司于本判决生效之日起七日内赔偿原告廖某财产损失(含合理维权费用)1500元；"}],"generated_by":"ingest/cases/cn-bic.json","verification":"PARSED","evidence_grade":"B"},{"id":"CN-CASE-LI-VOICE-LIVESTREAM","jurisdiction":"CN","forum":"北京互联网法院","forum_type":"COURT","case_numbers":["（2024）京0491民初10085号"],"caption":"李某瑾诉某文化公司网络侵权责任纠纷案","short_name":"AI 合成名人声音带货案","decided_at":"2025-07-18","procedural_stage":"FIRST_INSTANCE","outcome":"CLAIMANT_PARTLY_PREVAILED","is_final":true,"outcome_note":"原告请求赔偿经济损失及合理开支 25 万元，法院判赔 12 万元（含维权合理支出 1500 元）并公开致歉，其他请求驳回。判决书取自北大法宝（数据库转载件，不是法院或裁判文书网页面）。案号出自该判决书；典型案例稿没有案号，二者的对应是编者核对的结果（见对应说明）。“已生效”出自最高法典型案例稿。","ai_roles":["OUTPUT","USE_BY_PARTY"],"issues":["ISSUE-PERSONALITY-DEEPFAKE"],"field_evidence":{"decided_at":[{"source_id":"SRC-CN-SPC-512041","quote":"2025年7月18日，北京互联网法院判决某文化公司向李某瑾赔礼道歉、赔偿经济损失及维权合理支出12万元。"},{"s 一百六十五条、第一千一百六十八条、第一千一百八十二条","note":"判决主文前的裁判依据。"},{"provision":"CN-CIVIL-CODE#第一千零一十九条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-BIC-10085","quote":"综上所述，依照《中华人民共和国民法典》第一百七十八条、第一百七十九条、第九百九十五条、第一千条、第一千零一十八条、第一千零一十九条、第一千零二十三条第二款、第一千一百六十五条、第一千一百六十八条、第一千一百八十二条","note":"判决主文前的裁判依据。"},{"provision":"CN-CIVIL-CODE#第一千零二十三条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-BIC-10085","quote":"综上所述，依照《中华人民共和国民法典》第一百七十八条、第一百七十九条、第九百九十五条、第一千条、第一千零一十八条、第一千零一十九条、第一千零二十三条第二款、第一千一百六十五条、第一千一百六十八条、第一千一百八十二条","note":"判决主文前的裁判依据。判决适用的是该条第二款（声音保护参照肖像权）。"},{"provision":"CN-CIVIL-CODE#第一千一百六十五条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-BIC-10085","quote":"综上所述，依照《中华人民共和国民法典》第一百七十八条、第一百七十九条、第九百九十五条、第一千条、第一千零一十八条、第一千零一十九条、第一千零二十三条第二款、第一千一百六十五条、第一千一百六十八条、第一千一百八十二条","note":"判决主文前的裁判依据。"},{"provision":"CN-CIVIL-CODE#第一千一百六十八条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-BIC-10085","quote":"综上所述，依照《中华人民共和国民法典》第一百七十八条、第一百七十九条、第九百九十五条、第一千条、第一千零一十八条、第一千零一十九条、第一千零二十三条第二款、第一千一百六十五条、第一千一百六十八条、第一千一百八十二条","note":"判决主文前的裁判依据。"},{"provision":"CN-CIVIL-CODE#第一千一百八十二条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-BIC-10085","quote":"综上所述，依照《中华人民共和国民法典》第一百七十八条、第一百七十九条、第九百九十五条、第一千条、第一千零一十八条、第一千零一十九条、第一千零二十三条第二款、第一千一百六十五条、第一千一百六十八条、第一千一百八十二条","note":"判决主文前的裁判依据。"},{"provision":"CN-SPC-AI-OPINION-2026#（四）","basis":"EDITORIAL","note":"该条规定未经同意生成可识别特定自然人的合成人声时的声音权益保护。该意见晚于本案判决发布，不是本案裁判依据。"},{"provision":"CN-SPC-AI-OPINION-2026#（十）","basis":"EDITORIAL","note":"该条涉及“仿冒名人带货”构成欺诈时消费者的惩罚性赔偿，与本案的人格权请求不是同一请求权基础，列入仅供对照。"}],"also_reported_in":[{"source_id":"SRC-CN-BJD-BIC-AI-2025","locator":"案例三","basis":"INFERRED","note":"北京互联网法院涉人工智能典型案例之案例三（李某某诉某文化传媒有限公司）的法院、案由、案情和裁判要点与本案一致，编者推断为同一纠纷；该稿没有案号，不能以案号确认，故只建一条记录。判决书所载被告称谓“某文化传媒有限公司”与该稿相同。"}],"notes":"判决另依据《最高人民法院关于审理利用信息网络侵害人身权益民事纠纷案件适用法律若干问题的规定》第十二条，该司法解释未入库。","discovered_via":"最高人民法院网络法治典型案例发布页","source_title":{"text":"【案例二】明确带货主播侵害他人人格权的责任认定规则，强化网络空间人格权益保护——李某瑾诉某文化公司网络侵权责任纠纷案","source_id":"SRC-CN-SPC-512041"},"history":[],"scopes":{"SRC-CN-PKULAW-BIC-10085":null,"SRC-CN-SPC-512041":{"block_start":"【案例二】","block_end":"【案例三】"}},"scope_links":{"SRC-CN-PKULAW-BIC-10085":"典型案例稿没有案号，案名写作“李某瑾诉某文化公司”，判决书写作“李某与某文化传媒有限公司”。编者认定为同一案件的依据：同为北京互联网法院、网络侵权责任纠纷；判决日期同为 2025 年 7 月 18 日；请求 25 万元、判赔 12 万元两个数额相同；案情同为图书带货视频使用原告肖像和 AI 合成声音。北大法宝也把该判决书列为这件典型案例的文书原文。"},"excerpts":[{"kind":"facts","text":"2024年，某文化公司为推广销售家庭育儿类图书，与某带货主播订立协议，委托带货主播制作并发布短视频为其店铺进行网络宣传。该协议约定，带货主播发布的视频侵犯第三方合法权益的，委托方某文化公司应当承担责任。随后，前述带货主播在某网络平台的个人账号发布了多个宣传视频，使用了李某瑾公开演讲、授课的视频片段，并配以与李某瑾声音在音色、语调、发音风格上高度近似的AI合成音频。用户点击宣传视频一侧的按钮，可以直接跳转至某文化公司网络店铺购买相关图书。经查，案涉视频中的相关素材并未取得李某瑾的授权，某文化公司对案涉视频的素材来源、授权材料等未进行审核。李某瑾向法院提起诉讼，请求判令某文化公司赔礼道歉、赔偿经济损失及合理开支25万元。","source_id":"SRC-CN-SPC-512041"},{"kind":"holding","text":"北京互联网法院经审理认为，案涉视频未经李某瑾同意，擅自使用李某瑾肖像并结合使用与其声纹特征高度吻合的AI合成声音，案涉行为构成对李某瑾肖像权和声音权益的侵害。某文化公司未对视频素材的来源、视频素材是否获得李某瑾授权等事项进行审核，存在未尽合理审核义务的过失，构成共同侵权。2025年7月18日，北京互联网法院判决某文化公司向李某瑾赔礼道歉、赔偿经济损失及维权合理支出12万元。宣判后，双方当事人均未提起上诉，判决已发生法律效力。","source_id":"SRC-CN-SPC-512041"},{"kind":"significance","text":"强化网络空间人格权益保护，是加强网络生态治理、营造清朗网络空间的重要内容。当前，带货主播擅自使用他人肖像、AI合成声音等实施“仿冒名人带货”的商业推广行为时有发生，破坏网络生态环境，侵害他人人格权益，应当依法予以规制。本案例明确，带货主播受电子商务经营者委托，通过制作发布视频等方式进行商品推广时，故意使用侵害他人人格权等权益的素材的，构成侵权；委托人电子商务经营者对宣传推广内容未尽到法律规定或者合同约定的审核义务，对损害结果发生存在过失的，与带货主播成立共同侵权，应依法承担连带责任。本案中，某文化公司与带货主播形成委托关系，案涉协议明确了某文化公司对推广内容的审核责任和管理权限。在案涉视频明显、大量使用知名人士李某瑾肖像和高度仿真的AI合成声音，侵权风险显而易见的情况下，某文化公司未对视频素材来源、视频素材是否获得李某瑾授权等事项进行审核，存在未尽合理审核义务的过失。该过失与带货主播的侵权故意相结合，共同造成了损害后果，应当认定构成共同侵权。本案的处理，有效规制“仿冒名人带货”违法行为，依法保护网络空间人格权益，促推电子商务经营者对宣传推广内容切实履行审核义务，进一步推进网络生态治理法治化。","source_id":"SRC-CN-SPC-512041"},{"kind":"holding","source_id":"SRC-CN-PKULAW-BIC-10085","text":"综上所述，依照《中华人民共和国民法典》第一百七十八条、第一百七十九条、第九百九十五条、第一千条、第一千零一十八条、第一千零一十九条、第一千零二十三条第二款、第一千一百六十五条、第一千一百六十八条、第一千一百八十二条，《最高人民法院关于审理利用信息网络侵害人身权益民事纠纷案件适用法律若干问题的规定》第十二条之规定，判决如下："},{"kind":"holding","source_id":"SRC-CN-PKULAW-BIC-10085","text":"于本判决生效之日起十日内，被告某文化传媒有限公司赔偿原告李某经济损失120000元(含维权合理支出1500元)；"}],"generated_by":"ingest/cases/cn-spc.json","verification":"PARSED","evidence_grade":"B"},{"id":"CN- H-2432","quote":"依照《中华人民共和国民法典》第一千一百九十四条、第一千一百九十七条","note":"一审判决主文前的裁判依据；二审判决书未取得，二审所依据的条文不详。最高法典型案例稿的“典型意义”部分也引用了该条。"},{"provision":"CN-COPYRIGHT-LAW#第十条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-XH-2432","quote":"《中华人民共和国著作权法》第十条第十二项、第十七条第一款","note":"一审判决主文前的裁判依据；二审判决书未取得，二审所依据的条文不详。判决适用的是第十二项（信息网络传播权）。"},{"provision":"CN-COPYRIGHT-LAW#第十七条","basis":"CITED_IN_SOURCE","source_id":"SRC-CN-PKULAW-XH-2432","quote":"《中华人民共和国著作权法》第十条第十二项、第十七条第一款","note":"一审判决主文前的裁判依据；二审判决书未取得，二审所依据的条文不详。判决适用的是第一款（电影、电视剧作品的著作权归属）。"},{"provision":"CN-SPC-AI-OPINION-2026#（十二）","basis":"EDITORIAL","note":"该条规定认定人工智能提供者著作权侵权责任时的考量因素和举证。该意见晚于本案二审判决发布，不是本案裁判依据。"}],"notes":"一审判决另依据《最高人民法院关于审理侵害信息网络传播权民事纠纷案件适用法律若干问题的规定》第二条、第三条、第四条、第七条第三款、第八条第一款、第二款、第九条、第十条，该司法解释未入库。","discovered_via":"最高人民法院网络法治典型案例发布页","source_title":{"text":"【案例三】厘清搜索引擎服务提供者的侵权责任边界，平衡技术创新与权利保护——某文化公司诉某网络科技公司侵害作品信息网络传播权纠纷案","source_id":"SRC-CN-SPC-512041"},"also_reported_in":[],"scopes":{"SRC-CN-PKULAW-XH-2432":null,"SRC-CN-SPC-512041":{"block_start":"【案例三】","block_end":"【案例四】"}},"scope_links":{"SRC-CN-PKULAW-XH-2432":"典型案例稿没有案号。编者认定该一审判决书属于本案的依据：同为上海市徐汇区人民法院、判决日期同为 2025 年 7 月 1 日；当事人称谓同为某文化公司诉某网络科技公司；权利作品同为电视剧《某兵》《某花》；取证日 2024 年 11 月 28 日和结果“驳回原告全部诉讼请求”均相同。"},"excerpts":[{"kind":"facts","text":"某网络科技公司基于某大语言模型（已通过国家网信办的生成合成类算法备案），使用检索增强生成技术（使用外部知识源对搜索结果进行补充完善，以提供精准搜索服务）开发并运营某AI搜索引擎平台。某文化公司享有《某兵》《某花》两部电视剧的信息网络传播权。2024年11月28日，某文化公司在案涉搜索引擎平台分别搜索上述两部电视剧，首位搜索结果是第三方网盘分享链接，链接提供的视频内容与两部电视剧内容一致。2024年12月5日，某文化公司向某网络科技公司提出下架搜索结果等要求，某网络科技公司当日即删除了案涉搜索结果。某文化公司向法院起诉，请求判令某网络科技公司赔偿经济损失。","source_id":"SRC-CN-SPC-512041"},{"kind":"holding","text":"上海市徐汇区人民法院经审理认为，案涉网盘分享链接侵害了某文化公司对《某兵》《某花》两部电视剧的信息网络传播权，但某网络科技公司作为某AI搜索引擎平台的网络服务提供者，未主动上传案涉侵权视频的网盘分享链接，不构成直接侵权。由于某AI搜索引擎平台展示的是源自公共互联网网页的内容，在现阶段现有技术无法自动识别侵权信息，且某网络科技公司已履行模型算法的备案义务，在获悉侵权信息后及时作出有效处理，尽到了注意义务，亦不构成帮助侵权。2025年7月1日，上海市徐汇区人民法院判决驳回某文化公司全部诉讼请求。宣判后，某文化公司不服，提起上诉。2025年12月25日，上海知识产权法院作出二审判决，驳回上诉，维持原判。","source_id":"SRC-CN-SPC-512041"},{"kind":"significance","text":"人工智能、大数据等新技术新应用不断涌现，给网络生态治理带来新挑战。人民法院依法办理涉新技术应用案件，既依法规范技术应用，也尊重技术发展规律，依法支持技术迭代发展，为数智化转型提供司法保障。本案是一起厘清使用检索增强生成技术的搜索引擎服务提供者侵权责任边界的典型案例。民法典第一千一百九十七条规定：“网络服务提供者知道或者应当知道网络用户利用其网络服务侵害他人民事权益，未采取必要措施的，与该网络用户承担连带责任。”《最高人民法院关于审理侵害信息网络传播权民事纠纷案件适用法律若干问题的规定》细化了认定网络服务提供者对网络用户侵害信息网络传播权的情形是否“明知或者应知”的考量因素。与一般搜索引擎的网络服务不同，使用检索增强生成技术的搜索引擎服务的检索结果精准性、个性化更强，人民法院在适用上述法律规定认定网络服务提供者侵权责任时应当考虑技术特点、服务模式、检索结果生成过程等因素。本案例明确，搜索引擎服务提供者应当依法承担与其算法、数据优势程度相匹配的注意义务，对检索增强生成技术的算法合规负有更重的证明责任；检索信息来源于互联网，搜索引擎服务提供者未主动上传、编辑、推荐该信息，不符合明知或者应知的主观状态，且在知悉侵权信息后及时作出有效处理的，不具有侵权过错，不构成侵权。本案的处理，有利于实现著作权人、技术创新者、社会公共利益三者之间的利益平衡，推动形成支持和规范网络领域科技创新的法治环境。","source_id":"SRC-CN-SPC-512041"},{"kind":"holding","source_id":"SRC-CN-PKULAW-XH-2432","text":"依照《中华人民共和国民法典》第一千一百九十四条、第一千一百九十七条，《中华人民共和国著作权法》第十条第十二项、第十七条第一款，《最高人民法院关于审理侵害信息网络传播权民事纠纷案件适用法律若干问题的规定》第二条、第三条、第四条、第七条第三款、第八条第一款、第二款、第九条、第十条规定，判决如下："},{"kind":"holding","source_id":"SRC-CN-PKULAW-XH-2432","text":"驳回原告某文化公司全部诉讼请求。"}],"generated_by":"ingest/cases/cn-spc.json","verification":"PARSED","evidence_grade":"B"},{"id":"US-CASE-BARTZ-V-ANTHROPIC","jurisdiction":"US","forum":"United States District Court Northern District of California","forum_type":"COURT","case_numbers":["No. C 24-05417 WHA"],"caption":"Bartz v. Anthropic PBC","short_name":"Bartz 案：用图书训练模型与合理使用","decided_at":"2025-06-23","procedural_stage":"FIRST_INSTANCE","outcome":"PENDING","is_final":false,"outcome_note":"库内只有 2025 年 6 月 23 日的合理使用命令（简易判决阶段）：训练使用和纸本转数字被认定为合理使用，盗版来源的馆藏副本不在此列并交付审理。二手来源称本案其后达成和解，尚未取得法院文书核验，故结果仍按该命令记为未决。","ai_roles":["TRAINING"],"issues":["ISSUE-TRAINING-COPYRIGHT"],"field_evidence":{"case_numbers":[{"source_id":"SRC-US-NDCAL-BARTZ-FAIRUSE","quote":"No. C 24-05417 WHA ORDER ON FAIR USE"}],"decided_at":[{"source_id":"SRC-US-NDCAL-BARTZ-FAIRUSE","quote":"IT IS SO ORDERED. Dated: June 23, 2025."}],"outcome":[{"source_id":"SRC-US-NDCAL-BARTZ-FAIRUSE","quote":"We will have a trial on the pirated copies used to create Anthropic’s central library"}],"is_final":[{"source_id":"SRC-US-NDCAL-BARTZ-FAIRUSE","quote":"We will have a tr 3-5233"],"caption":"Thaler v. Perlmutter","short_name":"Thaler 案：机器能否作为作者","decided_at":"2025-03-18","procedural_stage":"APPEAL","outcome":"RESPONDENT_PREVAILED","is_final":null,"outcome_note":"上诉法院维持版权局拒绝登记的决定。其后是否申请全院复审或向最高法院申请调卷，未核查，故不标终局。","ai_roles":["OUTPUT"],"issues":["ISSUE-AI-OUTPUT-COPYRIGHTABILITY"],"field_evidence":{"case_numbers":[{"source_id":"SRC-US-CADC-THALER-2025","quote":"Decided March 18, 2025 No. 23-5233"}],"decided_at":[{"source_id":"SRC-US-CADC-THALER-2025","quote":"Decided March 18, 2025"}],"outcome":[{"source_id":"SRC-US-CADC-THALER-2025","quote":"We affirm the denial of Dr. Thaler’s copyright application."}],"forum":[{"source_id":"SRC-US-CADC-THALER-2025","quote":"United States Court of Appeals FOR THE DISTRICT OF COLUMBIA CIRCUIT"}],"caption":[{"source_id":"SRC-US-CADC-THALER-2025","quote":"STEPHEN THALER, AN INDIVIDUAL, APPELLANT v. SHIRA PERLMUTTER"}],"procedural_stage":[{"source_id":"SRC-US-CADC-THALER-2025","quote":"United States Court of Appeals FOR THE DISTRICT OF COLUMBIA CIRCUIT"}]},"legal_anchors":[],"notes":"法院解释的是 1976 年版权法；该法尚未入库，故暂无条文锚点。法院明确没有处理人借助 AI 创作时本人能否作为作者的问题。","discovered_via":"二手来源提及后，自 D.C. 巡回上诉法院网站取得判决书","history":[],"also_reported_in":[],"scopes":{"SRC-US-CADC-THALER-2025":null},"scope_links":{},"excerpts":[{"kind":"facts","source_id":"SRC-US-CADC-THALER-2025","text":"On the application, Dr. Thaler listed the Creativity Machine as the work’s sole author and himself as just the work’s owner."},{"kind":"holding","source_id":"SRC-US-CADC-THALER-2025","text":"The Creativity Machine cannot be the recognized author of a copyrighted work because the Copyright Act of 1976 requires all eligible work to be authored in the first instance by a human being."},{"kind":"holding","source_id":"SRC-US-CADC-THALER-2025","text":"Given that holding, we need not address the Copyright Office’s argument that the Constitution itself requires human authorship of all copyrighted material."},{"kind":"holding","source_id":"SRC-US-CADC-THALER-2025","text":"Nor do we reach Dr. Thaler’s argument that he is the work’s author by virtue of making and using the Creativity Machine because that argument was waived before the agency."}],"generated_by":"ingest/cases/us-federal.json","verification":"VERIFIED","evidence_grade":"A"},{"id":"US-CASE-THOMSON-REUTERS-V-ROSS","jurisdiction":"US","forum":"United States District Court for the District of Delaware","forum_type":"COURT","case_numbers":["No. 1:20-cv-613-SB"],"caption":"Thomson Reuters Enterprise Centre GmbH v. Ross Intelligence Inc.","short_name":"Thomson Reuters 诉 Ross 案：用判例提要训练检索工具","decided_at":"2025-02-11","procedural_stage":"FIRST_INSTANCE","outcome":"PENDING","is_final":false,"outcome_note":"库内只有 2025 年 2 月 11 日的备忘录意见（部分简易判决）：法院否定 Ross 的合理使用抗辩，部分事实问题留待陪审团。其后的上诉或审理进展未核查。","ai_roles":["TRAINING"],"issues":["ISSUE-TRAINING-COPYRIGHT"],"field_evidence":{"case_numbers":[{"source_id":"SRC-US-DDEL-ROSS-2025","quote":"No. 1:20-cv-613-SB"}],"decided_at":[{"source_id":"SRC-US-DDEL-ROSS-2025","quote":"MEMORANDUM OPINION February 11, 2025"}],"outcome":[{"source_id":"SRC-US-DDEL-ROSS-2025","quote":"Weighing them all together, I grant summary judgment for Thomson Reuters on fair use."},{"source_id":"SRC-US-DDEL-ROSS-2025","quote":"This factual question underlying copyright validity is for the jury."}],"is_final":[{"source_id":"SRC-US-DDEL-ROSS-2025","quote":"This factual question underlying copyright validity is for the jury."}],"forum":[{"source_id":"SRC-US-DDEL-ROSS-2025","quote":"IN THE UNITED STATES DISTRICT COURT FOR THE DISTRICT OF DELAWARE"}],"caption":[{"source_id":"SRC-US-DDEL-ROSS-2025","quote":"THOMSON REUTERS ENTERPRISE CENTRE GMBH"},{"source_id":"SRC-US-DDEL-ROSS-2025","quote":"v. ROSS INTELLIGENCE INC."}],"procedural_stage":[{"source_id":"SRC-US-DDEL-ROSS-2025","quote":"IN THE UNITED STATES DISTRICT COURT FOR THE DISTRICT OF DELAWARE"}]},"legal_anchors":[],"notes":"涉案系统不是生成式 AI，法院自己限定了适用范围；列入“训练数据与著作权”争点仅供对照。17 U.S.C. § 107 尚未入库，故暂无条文锚点。","discovered_via":"二手来源提及后，自 govinfo（美国政府出版局）取得法院意见","history":[],"also_reported_in":[],"scopes":{"SRC-US-DDEL-ROSS-2025":null},"scope_links":{},"excerpts":[{"kind":"facts","source_id":"SRC-US-DDEL-ROSS-2025","text":"Ross was using Thomson Reuters’s headnotes as AI data to create a legal research tool to compete with Westlaw."},{"kind":"facts","source_id":"SRC-US-DDEL-ROSS-2025","text":"It is undisputed that Ross’s AI is not generative AI (AI that writes new content itself)."},{"kind":"holding","source_id":"SRC-US-DDEL-ROSS-2025","text":"Weighing them all together, I grant summary judgment for Thomson Reuters on fair use."},{"kind":"significance","source_id":"SRC-US-DDEL-ROSS-2025","text":"Because the AI landscape is changing rapidly, I note for readers that only non-generative AI is before me today."}],"generated_by":"ingest/cases/us-federal.json","verification":"VERIFIED","evidence_grade":"A"}],"issues":[{"id":"ISSUE-TRAINING-COPYRIGHT","title":"用受著作权保护的作品训练模型","question":"未经许可使用他人作品训练 AI 模型，是否侵权，或可否主张合理使用？","status":"OPEN","editor_note":"三个法域在库内的材料性质不同：中国和欧盟是规范性文件，美国是个案裁判，不能直接比较“结论”。","positions":[{"jurisdiction":"CN","summary":"部门规章要求训练数据来源合法、不得侵害知识产权（生成式 AI 办法第七条）。最高法意见把“训练数据来源”列为认定生成内容著作权侵权责任的考量因素，并规定开发者提出不侵权抗辩时应提供训练数据来源等佐证（第十二条）。库内文件没有直接规定训练行为本身是否构成侵权或合理使用，库内也没有就此作出认定的中国案例。","provisions":["CN-CAC-GENAI-2023#第七条","CN-SPC-AI-OPINION-2026#（十二）","CN-SPC-AI-OPINION-2026#（十六）"],"cases":[]},{"jurisdiction":"EU","summary":"AI Act 第 53 条要求通用目的 AI 模型提供者制定遵守欧盟著作权法的政策（包括识别并遵守权利保留），并公开训练内容的摘要。这是合规义务，不直接回答训练是否侵权；该条所引的 2019/790 号指令未入库。库内条文是 2024 年原始文本，2026/1744 号条例对该条有无修改尚未核对。库内无欧盟案例。","provisions":["EU-AI-ACT-2024#Article 53"],"cases":[]},{"jurisdiction":"US","summary":"库内两份地区法院文书结论不同，事实也不同。Bartz 案法院认定用图书训练大语言模型属于合理使用，但从盗版网站取得并留存的馆藏副本不在此列。Thomson Reuters 诉 Ross 案法院否定合理使用抗辩，同时说明涉案系统不是生成式 AI。两者都是一审阶段的中间裁判，不是终局结论。版权法第 107 条未入库。","provisions":[],"cases":["US-CASE-BARTZ-V-ANTHROPIC","US-CASE-THOMSON-REUTERS-V-ROSS"]}]},{"id":"ISSUE-AI-OUTPUT-COPYRIGHTABILITY","title":"AI 生成内容能否受著作权保护","question":"AI 生成的内容是否构成作品？作者是谁？","status":"OPEN","editor_note":"库内中美两案的事实不同：中国案是使用者主张自己为作者，美国案是申请人把机器列为唯一作者。两案不构成对同一问题的相反回答。","positions":[{"jurisdiction":"CN","summary":"北京互联网法院在“AI 文生图”案中认定：使用者通过选取模型、输入提示词、设置参数生成的图片体现其智力投入和个性化表达，构成美术作品，著作权归使用者；人工智能模型本身不能成为作者。判决书在说理中援引著作权法第三条（作品定义）和第十一条（作者），主文前的裁判依据是第十条、第五十三条、第五十四条。该判决为已生效的一审判决。著作权法没有专门针对 AI 生成物的条文。","provisions":["CN-COPYRIGHT-LAW#第三条","CN-COPYRIGHT-LAW#第十一条"],"cases":["CN-CASE-AI-IMAGE-AUTHORSHIP"]},{"jurisdiction":"EU","summary":"库内无相关条文或案例。","provisions":[],"cases":[]},{"jurisdiction":"US","summary":"D.C. 巡回上诉法院在 Thaler 案中认定：1976 年版权法要求作品首先由人创作，机器不能被登记为作者。法院没有处理人借助 AI 创作时本人能否作为作者的问题，该主张因未在行政程序中提出而未予审理。","provisions":[],"cases":["US-CASE-THALER-V-PERLMUTTER"]}]},{"id":"ISSUE-PROVIDER-LIABILITY","title":"AI 服务提供者的侵权责任与注意义务","question":"AI 服务生成或呈现侵权内容时，服务提供者在什么条件下承担责任？","status":"OPEN","editor_note":"","positions":[{"jurisdiction":"CN","summary":"最高法意见以过错责任为一般归责原则（第三条），并就生成内容侵害人格权益规定了通知与必要措施规则（第七条）。库内三件案例显示法院按服务提供者对内容的介入程度区分处理：AI 搜索服务未主动上传、编辑、推荐且及时处理的，不构成侵权；以“AI 换脸”为卖点并提供平台、素材和技术的，构成侵权，不适用技术中立抗辩；通过规则设定和算法设计组织用户生成侵权内容的，按内容服务提供者承担责任。","provisions":["CN-SPC-AI-OPINION-2026#（三）","CN-SPC-AI-OPINION-2026#（七）","CN-SPC-AI-OPINION-2026#（十二）","CN-CIVIL-CODE#第一千一百六十五条","CN-CIVIL-CODE#第一千一百九十五条","CN-CIVIL-CODE#第一千一百九十七条","CN-CAC-GENAI-2023#第九条","CN-CAC-GENAI-2023#第十四条"],"cases":["CN-CASE-RAG-SEARCH","CN-CASE-FACE-SWAP-COPYRIGHT","CN-CASE-AI-COMPANION"]},{"jurisdiction":"EU","summary":"AI Act 规定的是投放市场和使用环节的合规义务，不是民事责任规则。库内无欧盟民事责任文件或案例。","provisions":[],"cases":[]},{"jurisdiction":"US","summary":"库内无相关条文或案例。","provisions":[],"cases":[]}]},{"id":"ISSUE-PERSONALITY-DEEPFAKE","title":"换脸、拟声与虚拟形象：人格权益保护","question":"未经同意用 AI 生成或合成他人的肖像、声音、虚拟形象，侵害何种权益？","status":"OPEN","editor_note":"","positions":[{"jurisdiction":"CN","summary":"民法典第一千零二十三条第二款规定声音的保护参照适用肖像权保护的规定，第一千零一十九条禁止利用信息技术手段伪造等方式侵害肖像权；AI 生成声音案的判决书以这些条文为裁判依据。最高法意见第四条规定：未经同意生成可识别特定自然人的虚拟形象或合成人声并使用的，构成对肖像权、声音权益等的侵害。库内五件北京互联网法院案例涉及合成声音、换脸模板、丑化肖像和“AI 陪伴”角色，其中换脸模板案法院不认定侵害肖像权，而认定侵害个人信息权益。","provisions":["CN-CIVIL-CODE#第一千零二十三条","CN-CIVIL-CODE#第一千零一十九条","CN-CIVIL-CODE#第一千零一十八条","CN-SPC-AI-OPINION-2026#（四）","CN-SPC-AI-OPINION-2026#（八）","CN-CAC-DEEPSYN-2022#第十四条","CN-CAC-GENAI-2023#第四条"],"cases":["CN-CASE-AI-VOICE","CN-CASE-LI-VOICE-LIVESTREAM","CN-CASE-FACE-SWAP-PERSONAL-INFO","CN-CASE-AI-DEFACED-PORTRAIT","CN-CASE-AI-COMPANION"]},{"jurisdiction":"EU","summary":"AI Act 第 50 条第 4 款要求部署者披露深度伪造内容系人工生成或操纵。这是透明度义务，不是人格权救济。2026/1744 号条例对相关禁止性规定的修改尚未核对入库（见线索）。","provisions":["EU-AI-ACT-2024#Article 50"],"cases":[]},{"jurisdiction":"US","summary":"联邦 TAKE IT DOWN Act 把故意公开未经同意的私密影像（含 digital forgery）规定为犯罪，并要求平台建立通知与删除程序。规制范围限于私密影像，不是一般的肖像或声音权益保护。库内无美国案例。","provisions":["US-TAKE-IT-DOWN-2025#SEC. 2.","US-TAKE-IT-DOWN-2025#SEC. 3."],"cases":[]}]},{"id":"ISSUE-CONTENT-LABELLING","title":"生成合成内容的标识与识别","question":"谁负有标识 AI 生成内容的义务？平台识别错误时如何处理？","status":"OPEN","editor_note":"","positions":[{"jurisdiction":"CN","summary":"标识办法要求服务提供者对生成合成内容添加显式标识和隐式标识（第四、五条），用户发布此类内容应主动声明并标识（第十条）；深度合成规定第十六、十七条和生成式 AI 办法第十二条是其上游依据。库内一件案例处理的是反向问题：平台用算法把用户内容判定为“AI 生成未标识”并处罚，法院认定平台未就算法判断作出合理说明，应承担违约责任。","provisions":["CN-CAC-LABEL-2025#第四条","CN-CAC-LABEL-2025#第五条","CN-CAC-LABEL-2025#第十条","CN-CAC-DEEPSYN-2022#第十六条","CN-CAC-DEEPSYN-2022#第十七条","CN-CAC-GENAI-2023#第十二条"],"cases":["CN-CASE-AI-DETECTION-PLATFORM"]},{"jurisdiction":"EU","summary":"AI Act 第 50 条要求提供者确保生成内容以机器可读方式标记并可被检测为人工生成（第 2 款），部署者披露深度伪造（第 4 款）。库内条文是 2024 年原始文本，该条的适用日期是否被 2026/1744 号条例调整尚未核对。","provisions":["EU-AI-ACT-2024#Article 50"],"cases":[]},{"jurisdiction":"US","summary":"库内无相关条文或案例。","provisions":[],"cases":[]}]},{"id":"ISSUE-AI-UNFAIR-COMPETITION","title":"利用 AI 实施不正当竞争","question":"用 AI 批量生成内容引流、仿冒、刷量，是否构成不正当竞争？","status":"OPEN","editor_note":"","positions":[{"jurisdiction":"CN","summary":"最高法意见第十二条末句规定，利用人工智能实施虚假宣传、刷量刷单等行为构成不正当竞争的，依法承担责任；第十六条规定数据集合可受反不正当竞争法保护。库内一件案例：利用 AI 批量生成针对竞争对手产品的测评文章并导流，被认定构成不正当竞争。","provisions":["CN-SPC-AI-OPINION-2026#（十二）","CN-SPC-AI-OPINION-2026#（十六）","CN-CAC-GENAI-2023#第四条"],"cases":["C /* DOM and text helpers. Strings from the dataset only ever become text nodes. */

/* Build an element. Children are nodes or strings; strings become text nodes. */
function h(tag, attrs) {
  var node = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (key) {
    var value = attrs[key];
    if (value === null || value === undefined || value === false) { return; }
    if (key === "class") { node.className = value; } else { node.setAttribute(key, value); }
  });
  for (var i = 2; i < arguments.length; i++) { append(node, arguments[i]); }
  return node;
}
function append(node, child) {
  if (child === null || child === undefined || child === false) { return; }
  if (Array.isArray(child)) { child.forEach(function (item) { append(node, item); }); return; }
  node.appendChild(typeof child === "string" || typeof child === "number" ? document.createTextNode(String(child)) : child);
}
function link(route, children, cls) { return h("a", { href: "#/" + route, class: cls }, children); }
/* Only http(s) addresses become links; anything else is shown as text. */
function external(url, label) {
  if (!/^https?:\/\//i.test(url || "")) { return h("span", { class: "mono" }, label || url || ""); }
  return h("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, label || url);
}

/* Search compares text with case and spacing removed. */
function fold(text) { return String(text || "").toLowerCase().replace(/\s+/g, ""); }
/* A short stretch of text around the first match, with the match marked. */
function snippet(text, query) {
  var at = text.toLowerCase().indexOf(query.toLowerCase());
  if (at < 0) { return h("p", null, text.slice(0, 90) + (text.length > 90 ? "…" : "")); }
  var from = Math.max(0, at - 36), to = Math.min(text.length, at + query.length + 60);
  return h("p", null, from ? "…" : "", text.slice(from, at), h("mark", null, text.slice(at, at + query.length)), text.slice(at + query.length, to), to < text.length ? "…" : "");
}
/* A malformed escape in the address bar is shown as typed instead of throwing. */
function safeDecode(text) {
  try { return decodeURIComponent(text); } catch (error) { return text; }
}

      }
      var uses = usesOf(id + "#" + provision.no);
      var node = h("article", { class: "prov" + (provision.no === label ? " hit" : ""), lang: item.language },
        h("h3", null, provision.no, provision.heading ? h("small", null, provision.heading) : null),
        h("p", null, provision.text),
        uses.length ? h("div", { class: "tags" }, h("span", { class: "meta" }, "关联案例"), uses) : null);
      if (provision.no === label) { target = node; }
      out.push(node);
    });
    if (target) { setTimeout(function () { target.scrollIntoView({ block: "start" }); }, 0); }
    return out;
  }

  function viewCases() {
    var out = page("CASES", "案例", "案名、审理机关、审级、案号、裁判日期由脚本对照本案原文核对。“结果”和“是否终局”是编者对原句的解读，卡片上圈在“编者解读”里。来源没有写的，一律标“未载”或“未核实”。");
    out.push(h("div", { class: "grid" }, inOrder(DB.cases).map(caseCard)));
    return out;
  }

  function viewCase(id) {
    var item = CASE[id];
    if (!item) { return notFound(); }
    var out = page("CASE · " + item.jurisdiction, item.short_name, item.caption);
    out.push(caseTags(item));
    out.push(h("p", { class: "meta" }, VERIFICATION_HELP[item.verification] + "。"));
    if (item.outcome_note) { out.push(h("p", { class: "note" }, item.outcome_note)); }
    out.push(facts([
      ["审理机关", item.forum],
      ["案号", item.case_numbers.length ? item.case_numbers.join("、") + (linked(item) ? "（与本案的对应系编者比对，见“字段出处”）" : "") : "来源未载"],
      ["裁判日期", item.decided_at || "来源未载"], ["AI 的角色", item.ai_roles.map(function (role) { return ROLE[role] || role; }).join("、")],
      ["争点", item.issues.map(function (issue, i) { return [i ? "、" : "", link("issue/" + issue, ISSUE[issue].title)]; })],
      ["来源标题", item.source_title ? item.source_title.text : null]
    ]));

    if (item.history.length) {
      out.push(h("h2", null, "审级"));
      item.history.forEach(function (step) {
        out.push(h("div", { class: "ev" }, h("b", null, (STAGE[step.stage] || step.stage) + " · " + step.forum + " · " + (step.decided_at || "")), "“" + step.result.quote + "”"));
      });
    }

    out.push(h("h2", null, "原文摘录"));
    item.excerpts.forEach(function (excerpt) {
      out.push(h("blockquote", { lang: item.jurisdiction === "US" ? "en" : null }, excerpt.text,
        h("footer", null, (EXCERPT[excerpt.kind] || excerpt.kind) + " · ", sourceLine(excerpt.source_id))));
    });

    out.push(h("h2", null, "关联条文"));
    if (!item.legal_anchors.length) { out.push(h("p", { class: "empty" }, "暂无。原因见下方备注。")); }
    item.legal_anchors.forEach(function (anchor) {
      out.push(h("div", { class: "card" },
        h("h3", null, link(refRoute(anchor.provision), refLabel(anchor.provision))),
        h("div", { class: "tags" }, tag(BASIS[anchor.basis] || anchor.basis, anchor.basis === "CITED_IN_SOURCE" ? "ok" : "warn")),
        anchor.quote ? h("p", null, "“" + anchor.quote + "”") : null,
        anchor.note ? h("p", { class: "meta" }, anchor.note) : null));
    });
    if (item.legal_anchors.some(function (anchor) { return anchor.basis === "EDITORIAL"; })) {
      out.push(h("p", { class: "meta" }, "“编者关联”表示来源没有写明本案适用了该条文，是编者按主题对应上的，不能当作裁判依据引用。"));
    }

    out.push(h("h2", null, "字段出处"));
    out.push(h("p", { class: "meta" }, "每条出处都只在本案自己的段落里核对，不借用同一页面上其他案件的句子。“结果”和“是否终局”是编者对下列原句的解读。"));
    Object.keys(item.field_evidence).forEach(function (field) {
      item.field_evidence[field].forEach(function (evidence) {
        out.push(h("div", { class: "ev" }, h("b", null, [(FIELD[field] || field) + (evidence.page_level ? "（取自页面导语）" : "") + " · ", sourceLine(evidence.source_id)]), "“" + evidence.quote + "”"));
      });
    });
    Object.keys(item.scope_links || {}).forEach(function (sourceId) {
      out.push(h("p", { class: "note" }, "编者对应 · " + sourceId + "：" + item.scope_links[sourceId]));
    });
    item.also_reported_in.forEach(function (other) {
      out.push(h("p", { class: "note" }, "编者注 · 另见 " + other.source_id + (other.locator ? " " + other.locator : "") + "：" + other.note));
    });
    if (item.notes) { out.push(h("h2", null, "备注"), h("p", null, item.notes)); }
    out.push(h("p", { class: "meta" }, "线索来源：" + (item.discovered_via || "")));
    return out;
  }

  function leadNode(lead) {
    return h("div", { class: "lead" }, h("div", { class: "band" }, "未核验线索 · 不是库内记录"),
      h("div", { class: "body" },
        h("h3", null, lead.title),
        h("div", { class: "tags" }, jur(lead.jurisdiction), tag(lead.type === "CASE" ? "案例线索" : "法规线索")),
        h("p", null, lead.claim),
        h("p", { class: "meta" }, "见于：" + lead.seen_in.join("；")),
        h("p", { class: "meta" }, "下一步：" + lead.next_step)));
  }
  function viewLeads() {
    var out = page("LEADS", "线索", "这里是从二手材料和第三方数据库看到、还没有取到原文的条目。其中的案号、日期、金额和结论都没有核对过，不能引用。");
    DB.leads.forEach(function (lead) { out.push(leadNode(lead)); });
    return out;
  }

  function viewSources() {
    var out = page("SOURCES", "来源快照", "库内每一处引文都指向下面某一份快照。SHA-256 是取回当时文件的指纹，用来确认本地文件没有被改动。");
    var body = h("tbody");
    DB.sources.forEach(function (source) {
      append(body, h("tr", null,
        h("td", null, h("span", { class: "mono" }, source.id), h("br"), source.publisher, source.note ? h("div", { class: "meta" }, source.note) : null),
        h("td", null, KIND[source.kind] || source.kind, h("br"), tag(source.official ? "发布机关页面" : "转载页", source.official ? "ok" : "warn")),
        h("td", null, source.fetched_at),
        h("td", null, external(source.url, "打开原址"), h("div", { class: "mono" }, source.sha256.slice(0, 16) + "…"))));
    });
    out.push(h("table", null, h("thead", null, h("tr", null, h("th", null, "快照"), h("th", null, "类型"), h("th", null, "取回日期"), h("th", null, "地址与指纹"))), body));
    return out;
  }

  function figure(value, label) { return h("div", null, h("b", null, String(value)), h("span", null, label)); }
  function viewAbout() {
    var s = DB.stats;
    var out = page("SCOPE", "口径", "这个库收什么、没收什么、每个数字怎么来的。");
    out.push(h("p", { class: "note" }, "覆盖范围：试点只做“生成式 AI × 中国、欧盟、美国”。它不是全球库，也不是三地的全量库。数据截至 " + DB.built_at + "。"));
    out.push(h("div", { class: "figures" }, figure(s.instruments, "部法规"), figure(s.provisions, "条条文"), figure(s.obligations, "条义务"),
      figure(s.countermeasures, "条对外措施"), figure(s.cases, "件案例"), figure(s.issues, "个争点"),
      figure(s.leads_open, "条待核线索"), figure(s.sources, "份快照")));
    out.push(h("p", { class: "meta" }, "以上数字由构建脚本从数据文件清点得出。"));

    out.push(h("h2", null, "核验等级"));
    Object.keys(VERIFICATION).forEach(function (level) {
      out.push(h("p", null, seal(level), " " + VERIFICATION_HELP[level] + "。"));
    });
    out.push(h("p", null, "等级不是人工填写的，由构建脚本按记录所引快照的性质算出。任何一处引文与快照对不上，构建即失败。"));
    out.push(h("p", null, "案例 " + s.cases + " 件中：" + Object.keys(s.cases_by_verification).map(function (level) { return (VERIFICATION[level] || level) + " " + s.cases_by_verification[level] + " 件"; }).join("，") +
      "；取得裁判文书（判决书或裁定书）的 " + s.cases_with_judgment + " 件；载有案号的 " + s.cases_with_case_number + " 件，其中 " + s.cases_with_editorial_link + " 件的案号与本案的对应是编者比对的；标为终局的 " + s.cases_final + " 件。"));

    out.push(h("h2", null, "案例与条文的关联"));
    out.push(h("p", null, "共 " + s.anchors + " 处关联，其中“来源明文援引” " + (s.anchors_by_basis.CITED_IN_SOURCE || 0) + " 处，“编者关联” " + (s.anchors_by_basis.EDITORIAL || 0) + " 处；" + s.cases_without_anchor + " 件案例暂无关联条文。"));
    out.push(h("p", null, "“来源明文援引”只在取得判决书全文的案例上才有。其余中国案例取自法院发布的典型案例稿，稿中通常不写条文序号；美国案例适用的版权法条文尚未入库。"));

    out.push(h("h2", null, "义务层与涉外标记"));
    out.push(h("p", null, "库内 " + s.obligations + " 条义务，其中“应当” " + (s.obligations_by_modality.MUST || 0) +
      " 条、“不得” " + (s.obligations_by_modality.MUST_NOT || 0) + " 条，标注域外效力的 " + s.obligations_extraterritorial + " 条。"));
    out.push(h("p", null, "每条义务的“原句”必须逐字出现在它所指向的条文里，而那条条文早已与快照逐字比对；所以义务的证据链是：原句 ⊆ 条文 ⊆ 快照。义务不会比它读的那条法更可靠。"));
    out.push(h("p", null, "涉外标记是编者的分类，脚本不核对：" + Object.keys(s.instruments_by_foreign_related).map(function (key) {
      return (FOREIGN[key] || key) + " " + s.instruments_by_foreign_related[key] + " 部";
    }).join("，" ) + "。"));
    out.push(h("p", null, "争点层多了两项：每栏声明所依据材料的性质（规范性文件、个案裁判、库内无材料等），整个争点声明各栏是否可比，不可比时要写明理由。"));

    out.push(h("h2", null, "对外措施层"));
    out.push(h("p", null, "库内 " + s.countermeasures + " 条措施，按方向分列：" + Object.keys(s.countermeasures_by_direction).map(function (key) {
      return (DIRECTION[key] || key) + " " + s.countermeasures_by_direction[key] + " 条";
    }).join("，") + "。境外对华措施与中国对外措施分表列出，不合并统计。"));
    out.push(h("p", null, "措施的标题必须逐字出现在发布机关的页面上，生效日期必须由一句原文写明。公告只写“自公布之日起实施”的，生效日取公布日，并在页面上单独标出，不当作原文写明了日期。"));

    out.push(h("h2", null, "已知缺口"));
    out.push(h("ul", null,
      h("li", null, "欧盟《人工智能法》收的是 2024 年公报原始文本。2026/1744 号修订条例只登记了元数据，对各条的修改尚未逐条标注。"),
      h("li", null, "欧盟部分没有案例。"),
      h("li", null, "中国案例的摘录来自法院案例稿，不是判决书。" + (s.cases_by_verification.PARSED || 0) + " 件取自新闻客户端转载的法院发布稿，所以只到“转载核对”。"),
      h("li", null, "法规“现行”状态只依据原文所载的施行日期，没有逐部核查此后是否被修订或废止。"),
      h("li", null, "条文之间的引用关系（例如标识办法援引深度合成规定）尚未结构化。")));

    var agora = DB.reference.agora;
    if (agora) {
      out.push(h("h2", null, "对照：AGORA 数据集"));
      out.push(h("p", null, "AGORA（乔治城大学 CSET）是目前公开可下载的最大的 AI 治理文件库。下表是对其 " + agora.version + " 版（" + agora.published + "，" + agora.license + "）整包实测的结果，不是其官网的自述。"));
      var body = h("tbody");
      Object.keys(agora.by_jurisdiction).forEach(function (name) {
        append(body, h("tr", null, h("td", null, name), h("td", { class: "num" }, String(agora.by_jurisdiction[name])), h("td", { class: "num" }, (100 * agora.by_jurisdiction[name] / agora.documents).toFixed(1) + "%")));
      });
      out.push(h("table", null, h("thead", null, h("tr", null, h("th", null, "法域"), h("th", null, "文件数"), h("th", null, "占比"))), body));
      out.push(h("p", null, "共 " + agora.documents + " 件文件。中国 " + agora.china_documents + " 件，其“文件链接”指向 .gov.cn 域名的有 " + agora.china_links_on_gov_cn + " 件，其余指向英译本或研究机构页面。该数据集不收案例。"));
      out.push(h("p", { class: "meta" }, "本库只把 AGORA 当线索，条文一律另取中文官方原文。AGORA 为非商业许可，其数据不随本库分发。"));
    }
    return out;
  }

  /* ---- search ---- */

  function viewSearch(query) {
    var out = page("SEARCH", "检索：" + query);
    var key = fold(query);
    if (key.length < 2) { out.push(h("p", { class: "empty" }, "请输入至少两个字。")); return out; }
    var hits = 0;
    function section(title, nodes) {
      if (!nodes.length) { return; }
      hits += nodes.length;
      out.push(h("h2", null, title + "（" + nodes.length + "）"));
      nodes.slice(0, 40).forEach(function (node) { out.push(node); });
      if (nodes.length > 40) { out.push(h("p", { class: "meta" }, "只显示前 40 条。")); }
    }
    var provisions = [];
    DB.instruments.forEach(function (item) {
      item.provisions.forEach(function (provision) {
        if (fold(provision.text + (provision.heading || "") + provision.no).indexOf(key) < 0) { return; }
        provisions.push(link(refRoute(item.id + "#" + provision.no), [h("h3", null, item.short_title + " " + provision.no), snippet(provision.text, query)], "card"));
      });
    });
    section("条文", provisions);
    section("案例", DB.cases.filter(function (item) {
      var text = item.caption + item.short_name + item.forum + item.case_numbers.join("") + item.excerpts.map(function (e) { return e.text; }).join("");
      return fold(text).indexOf(key) >= 0;
    }).map(function (item) {
      var hit = item.excerpts.filter(function (e) { return fold(e.text).indexOf(key) >= 0; })[0];
      return link("case/" + item.id, [h("h3", null, item.short_name), caseTags(item), hit ? snippet(hit.text, query) : null], "card");
    }));
    section("争点", DB.issues.filter(function (issue) {
      return fold(issue.title + issue.question + issue.positions.map(function (p) { return p.summary; }).join("")).indexOf(key) >= 0;
    }).map(function (issue) { return link("issue/" + issue.id, [h("h3", null, issue.title), h("p", null, issue.question)], "card"); }));
    section("未核验线索", DB.leads.filter(function (lead) { return fold(lead.title + lead.claim).indexOf(key) >= 0; }).map(leadNode));
    if (!hits) { out.push(h("p", { class: "empty" }, "库内没有匹配的内容。这只说明本库没有收，不说明不存在。")); }
    return out;
  }

  function notFound() { return page("404", "没有这条记录", "地址可能有误，或者该记录尚未入库。"); }

  /* ---- routing ---- */

  function route() {
    var parts = location.hash.replace(/^#\/?/, "").split("/");
    var name = parts[0] || "issues";
    var arg = safeDecode(parts[1] || "");
    var views = {
      issues: viewIssues, issue: function () { return viewIssue(arg); },
      obligations: viewObligations, obligation: function () { return viewObligation(arg); },
      countermeasures: viewCountermeasures, measure: function () { return viewMeasure(arg); },
      instruments: viewInstruments, instrument: function () { return viewInstrument(arg, safeDecode(parts.slice(2).join("/"))); },
      cases: viewCases, "case": function () { return viewCase(arg); },
      leads: viewLeads, sources: viewSources, about: viewAbout,
      search: function () { return viewSearch(safeDecode(parts.slice(1).join("/"))); }
    };
    var render = Object.prototype.hasOwnProperty.call(views, name) ? views[name] : notFound;
    view.textContent = "";
    append(view, render());
    var section = { issue: "issues", obligation: "obligations", measure: "countermeasures", instrument: "instruments", "case": "cases" }[name] || name;
    Array.prototype.forEach.call(document.querySelectorAll("#nav a"), function (item) {
      if (item.getAttribute("data-section") === section) { item.setAttribute("aria-current", "page"); } else { item.removeAttribute("aria-current"); }
    });
    if (!(name === "instrument" && parts[2])) { window.scrollTo(0, 0); }
    document.title = (view.querySelector("h1") ? view.querySelector("h1").textContent + " · " : "") + "涉外法治与人工智能治理对应库";
  }

  NAV.forEach(function (entry) {
    append(document.getElementById("nav"), h("a", { href: "#/" + entry[0], "data-section": entry[0] }, entry[1], h("span", null, String(entry[2]()))));
  });
  append(document.getElementById("rail-foot"), ["试点范围：涉外数据 · AI 治理", h("br"), "中国 · 欧盟 · 美国", h("br"), "数据截至 " + DB.built_at]);
  append(document.getElementById("top-note"), ["红色“已核验”章：引文与发布机关的原文逐字一致。", link("about", "口径说明")]);
  append(document.getElementById("foot"), "本库供研究检索使用，不构成法律意见。摘录为原文节录，概述为编者撰写；引用前请打开原址核对。结构版本 " + DB.schema + "。");
  document.getElementById("search-form").addEventListener("submit", function (event) {
    event.preventDefault();
    var query = document.getElementById("q").value.trim();
    if (query) { location.hash = "#/search/" + encodeURIComponent(query); }
  });
  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body>
</html>
