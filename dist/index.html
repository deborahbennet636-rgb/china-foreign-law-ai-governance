<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'sha256-4tCjLWI2EJ9zwzfr7DnlBvGbz2u/Pw5g9Og2hXfE4yE='; script-src 'sha256-NzFam9cntpINerFvSuFiTzqfRUgKAE1Hm9xJIr5tbrE='; img-src data:; base-uri 'none'; form-action 'none'">
<title>涉外法治与人工智能治理对应库</title>
<style>
/* Law-report look: paper, ink, and one seal red reserved for verification. */
:root {
  --paper: #f6f1e7;
  --sheet: #fffdf8;
  --ink: #1d1a16;
  --ink-2: #5a5247;
  --rule: #cfc5b2;
  --seal: #a8261b;
  --seal-wash: #f4ded9;
  --moss: #33543f;
  --warn: #8a5a00;
  --warn-wash: #f5e9cc;
  --serif: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
  --sans: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "Cascadia Mono", "SF Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh;
  background: var(--paper); color: var(--ink); font-family: var(--serif); line-height: 1.75;
}
a { color: inherit; text-decoration-color: var(--rule); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--seal); }
:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
.sr { position: absolute; left: -9999px; }

.rail {
  position: sticky; top: 0; height: 100vh; padding: 28px 22px; background: var(--ink); color: #efe8da;
  display: flex; flex-direction: column; gap: 26px;
}
.rail-title { font-size: 1.3rem; line-height: 1.4; letter-spacing: .12em; text-decoration: none; border-bottom: 3px double #6f665a; padding-bottom: 18px; }
.rail-nav { display: flex; flex-direction: column; }
.rail-nav a { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; text-decoration: none; border-bottom: 1px solid #39342d; font-family: var(--sans); font-size: .95rem; }
.rail-nav a span { font-family: var(--mono); font-size: .8rem; color: #a79d8c; }
.rail-nav a[aria-current="page"] { color: #fff; box-shadow: inset 3px 0 0 var(--seal); padding-left: 12px; }
.rail-foot { margin-top: auto; font-family: var(--sans); font-size: .78rem; line-height: 1.6; color: #a79d8c; }

main { padding: 26px clamp(20px, 4vw, 56px) 60px; max-width: 1180px; }
.top { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; padding-bottom: 18px; border-bottom: 1px solid var(--rule); }
#search-form { display: flex; flex: 1 1 320px; max-width: 460px; }
#q { flex: 1; padding: 9px 12px; border: 1px solid var(--ink); border-right: 0; background: var(--sheet); font: inherit; font-family: var(--sans); font-size: .95rem; }
button { padding: 9px 16px; border: 1px solid var(--ink); background: var(--ink); color: #fff; font-family: var(--sans); font-size: .9rem; cursor: pointer; }
.top-note { margin: 0; font-family: var(--sans); font-size: .82rem; color: var(--ink-2); }
#view { outline: none; padding-top: 28px; }
.foot { margin-top: 56px; padding-top: 16px; border-top: 3px double var(--rule); font-family: var(--sans); font-size: .8rem; color: var(--ink-2); }

h1 { font-size: 1.9rem; line-height: 1.35; margin: 0 0 6px; font-weight: 700; }
h2 { font-size: 1.15rem; margin: 34px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--ink); letter-spacing: .06em; }
h3 { font-size: 1rem; margin: 0 0 6px; }
.lede { margin: 0 0 22px; color: var(--ink-2); max-width: 46em; }
.kicker { font-family: var(--sans); font-size: .78rem; letter-spacing: .18em; color: var(--seal); margin: 0 0 6px; }
.meta { font-family: var(--sans); font-size: .84rem; color: var(--ink-2); }
.mono { font-family: var(--mono); font-size: .8rem; word-break: break-all; }
.note { margin: 14px 0; padding: 10px 14px; border-left: 3px solid var(--warn); background: var(--warn-wash); font-family: var(--sans); font-size: .88rem; line-height: 1.65; }
.empty { color: var(--ink-2); font-family: var(--sans); font-size: .9rem; }

/* Verification marks. Seal red means: every quote matched an official snapshot. */
.seal { display: inline-block; padding: 1px 8px; font-family: var(--sans); font-size: .76rem; letter-spacing: .1em; white-space: nowrap; vertical-align: middle; border: 1.5px solid; border-radius: 2px; }
.seal.VERIFIED { color: var(--seal); border-color: var(--seal); background: var(--seal-wash); font-weight: 700; }
.seal.PARSED { color: var(--ink); border-color: var(--ink); }
.seal.PENDING { color: var(--ink-2); border-style: dashed; }
.tag { display: inline-block; padding: 0 7px; font-family: var(--sans); font-size: .76rem; border: 1px solid var(--rule); background: var(--sheet); white-space: nowrap; }
.tag.jur { background: var(--ink); color: #fff; border-color: var(--ink); font-family: var(--mono); }
.tag.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-wash); }
.tag.ok { border-color: var(--moss); color: var(--moss); }
.reading { display: inline-flex; gap: 6px; align-items: center; padding: 2px 6px 2px 8px; border: 1px dashed var(--ink-2); font-family: var(--sans); font-size: .72rem; color: var(--ink-2); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }

.card { display: block; padding: 16px 18px; margin: 0 0 12px; background: var(--sheet); border: 1px solid var(--rule); text-decoration: none; }
a.card:hover { border-color: var(--ink); box-shadow: 4px 4px 0 var(--rule); }
.card p { margin: 6px 0 0; font-size: .93rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.grid .card { margin: 0; }

.matrix { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--ink); background: var(--sheet); }
.matrix > section { padding: 18px 18px 20px; border-right: 1px solid var(--rule); }
.matrix > section:last-child { border-right: 0; }
.matrix h3 { font-family: var(--mono); font-size: .9rem; letter-spacing: .2em; border-bottom: 1px solid var(--ink); padding-bottom: 6px; margin-bottom: 10px; }
.matrix p { margin: 0 0 12px; font-size: .92rem; }
.matrix section.blank { background: repeating-linear-gradient(135deg, transparent 0 9px, rgba(0,0,0,.035) 9px 10px); }
.matrix section.blank p { color: var(--ink-2); font-family: var(--sans); }
.reflist { list-style: none; margin: 0 0 10px; padding: 0; font-family: var(--sans); font-size: .85rem; }
.reflist li { padding: 4px 0; border-top: 1px dotted var(--rule); }
.reflist b { font-weight: 400; color: var(--ink-2); margin-right: 6px; }

dl.facts { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 4px 16px; margin: 14px 0; font-family: var(--sans); font-size: .9rem; }
dl.facts dt { color: var(--ink-2); }
dl.facts dd { margin: 0; }
.prov { padding: 12px 0 12px 16px; border-top: 1px solid var(--rule); border-left: 3px solid transparent; scroll-margin-top: 16px; }
.prov:target, .prov.hit { border-left-color: var(--seal); background: var(--sheet); }
.prov h3 { font-family: var(--sans); font-size: .88rem; color: var(--seal); }
.prov h3 small { color: var(--ink-2); font-weight: 400; margin-left: 8px; }
.prov p { margin: 0; white-space: pre-wrap; font-size: .95rem; }
.prov[lang="en"] p, blockquote[lang="en"] { font-family: Georgia, "Iowan Old Style", serif; line-height: 1.6; }
.division { margin: 26px 0 4px; font-family: var(--sans); font-size: .82rem; letter-spacing: .14em; color: var(--ink-2); }
blockquote { margin: 0 0 12px; padding: 12px 16px; background: var(--sheet); border: 1px solid var(--rule); border-left: 3px solid var(--ink); white-space: pre-wrap; font-size: .95rem; }
blockquote footer { margin-top: 8px; font-family: var(--sans); font-size: .78rem; color: var(--ink-2); white-space: normal; }
.ev { margin: 0 0 8px; padding: 8px 12px; border: 1px dashed var(--rule); font-size: .88rem; }
.ev b { font-family: var(--sans); font-size: .78rem; color: var(--ink-2); font-weight: 400; display: block; }

/* Leads are not records. Hatching and a band keep them from being read as findings. */
.lead { padding: 0; margin: 0 0 14px; border: 1.5px dashed var(--warn); background: repeating-linear-gradient(135deg, var(--sheet) 0 11px, #f7efdc 11px 12px); }
.lead .band { padding: 3px 14px; background: var(--warn); color: #fff; font-family: var(--sans); font-size: .76rem; letter-spacing: .2em; }
.lead .body { padding: 12px 16px 14px; }
.lead p { margin: 6px 0 0; font-size: .92rem; }

table { width: 100%; border-collapse: collapse; font-family: var(--sans); font-size: .85rem; background: var(--sheet); }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--rule); }
th { border-bottom: 1px solid var(--ink); font-weight: 600; white-space: nowrap; }
td.num { font-family: var(--mono); text-align: right; white-space: nowrap; }
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0; border: 1px solid var(--ink); background: var(--sheet); margin: 0 0 8px; }
.figures div { padding: 14px 16px; border-right: 1px solid var(--rule); }
.figures b { display: block; font-family: var(--mono); font-size: 1.7rem; line-height: 1.2; font-weight: 400; }
.figures span { font-family: var(--sans); font-size: .8rem; color: var(--ink-2); }
mark { background: #f2d98a; color: inherit; padding: 0 1px; }

@media (max-width: 860px) {
  body { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; padding: 18px; gap: 12px; }
  .rail-nav { flex-direction: row; flex-wrap: wrap; gap: 0 18px; }
  .rail-nav a { border: 0; }
  .rail-foot { display: none; }
  .matrix { grid-template-columns: 1fr; }
  .matrix > section { border-right: 0; border-bottom: 1px solid var(--rule); }
}
@media print {
  body { display: block; background: #fff; }
  .rail, .top { display: none; }
}

</style>

 2 条。正文第三十三条写的是 2017 年修订文本的施行日，不是本次修正的施行日，故施行日期留空。据编者所知该法 2025 年又经修订，修订文本未入库、未在本库核对，故不标“现行”","published_at":"2019-04-23","effective_at":null,"language":"zh","discovered_via":"江苏省无锡市新吴区人民法院（2024）苏0214民初9489号判决书的裁判依据","foreign_related":"DOMESTIC","source_id":"SRC-CN-NPC-AUCL-2019","source_ids":["SRC-CN-NPC-AUCL-2019"],"complete":false,"expected_provisions":null,"meta_evidence":{"title":"中华人民共和国反不正当竞争法","issuer":"根据2019年4月23日第十三届全国人民代表大会常务委员会第十次会议《关于修改〈中华人民共和国建筑法〉等八部法律的决定》修正","published_at":"根据2019年4月23日第十三届全国人民代表大会常务委员会第十次会议《关于修改〈中华人民共和国建筑法〉等八部法律的决定》修正"},"derived_dates":{},"generated_by":"ingest/instruments/CN-AUCL-2019.json","provisions":[{"no":"第二条","ordinal":2,"division":"第一章 总 则","text":"经营者在生产经营活动中，应当遵循自愿、平等、公平、诚信的原则，遵守法律和商业道德。\n本法所称的不正当竞争行为，是指经营者在生产经营活动中，违反本法规定，扰乱市场竞争秩序，损害其他经营者或者消费者的合法权益的行为。\n本法所称的经营者，是指从事商品生产、经营或者提供服务（以下所称商品包括服务）的自然人、法人和非法人组织。","source_id":"SRC-CN-NPC-AUCL-2019"},{"no":"第十七条","ordinal":17,"division":"第四章 法律责任","text":"经营者违反本法规定，给他人造成损害的，应当依法承担民事责任。\n经营者的合法权益受到不正当竞争行为损害的，可以向人民法院提起诉讼。\n因不正当竞争行为受到损害的经营者的赔偿数额，按照其因被侵权所受到的实际损失确定；实际损失难以计算的，按照侵权人因侵权所获得的利益确定。经营者恶意实施侵犯商业秘密行为，情节严重的，可以在按照上述方法确定数额的一倍以上五倍以下确定赔偿数额。赔偿数额还应当包括经营者为制止侵权行为所支付的合理开支。\n经营者违反本法第六条、第九条规定，权利人因被侵权所受到的实际损失、侵权人因侵权所获得的利益难以确定的，由人民法院根据侵权行为的情节判决给予权利人五百万元以下的赔偿。","source_id":"SRC-CN-NPC-AUCL-2019"}],"amended_by":[],"verification":"VERIFIED","evidence_grade":"A"},{"id":"CN-CAC-ALGO-2022","jurisdiction":"CN","title":"互联网信息服务算法推荐管理规定","short_title":"算法推荐规定","issuer":"国家互联网信息办公室、工业和信息化部、公安部、国家市场监督管理总局","doc_number":"国家互联网信息办公室 中华人民共和国工业和信息化部 中华人民共和国公安部 国家市场监督管理总局 令 第9号","level":"部门规章","instrument_type":"AI_SPECIFIC","status":"IN_FORCE","status_note":"施行日期见原文；后续修订未专门核查","published_at":"2021-12-31","effective_at":"2022-03-01","language":"zh","discovered_via":"AGORA 266（英译本线索）；原文取自中国网信网","foreign_related":"DOMESTIC","source_id":"SRC-CN-CAC-ALGO-2022","source_ids":["SRC-CN-CAC-ALGO-2022"],"complete":true,"expected_provisions":35,"meta_evidence":{"doc_number":"国家互联网信息办公室 中华人民共和国工业和信息化部 中华人民共和国公安部 国家市场监督管理总局 令 第9号","published_at":"2021年12月31日","effective_at":"自2022年3月1日起施行","issuer":"已经2021年11月16日国家互联网信息办公室2021年第20次室务会议审议通过，并经工业和信息化部、公安部、国家市场监督管理总局同意"},"derived_dates":{},"generated_by":"ingest/instruments/CN-CAC-ALGO-2022.json","provisions":[{"no":"第一条","ordinal":1,"division":"第一章 总 则","text":"为了规范互联网信息服务算法推荐活动，弘扬社会主义核心价值观，维护国家安全和社会公共利益，保护公民、法人和其他组织的合法权益，促进互联网信息服务健康有序发展，根据《中华人民共和国网络安全法》、《中华人民共和国数据安全法》、《中华人民共和国个人信息保护法》、《互联网信息服务管理办法》等法律、行政法规，制定本规定。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第二条","ordinal":2,"division":"第一章 总 则","text":"在中华人民共和国境内应用算法推荐技术提供互联网信息服务（以下简称算法推荐服务），适用本规定。法律、行政法规另有规定的，依照其规定。\n前款所称应用算法推荐技术，是指利用生成合成类、个性化推送类、排序精选类、检索过滤类、调度决策类等算法技术向用户提供信息。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第三条","ordinal":3,"division":"第一章 总 则","text":"国家网信部门负责统筹协调全国算法推荐服务治理和相关监督管理工作。国务院电信、公安、市场监管等有关部门依据各自职责负责算法推荐服务监督管理工作。\n地方网信部门负责统筹协调本行政区域内的算法推荐服务治理和相关监督管理工作。地方电信、公安、市场监管等有关部门依据各自职责负责本行政区域内的算法推荐服务监督管理工作。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第四条","ordinal":4,"division":"第一章 总 则","text":"提供算法推荐服务，应当遵守法律法规，尊重社会公德和伦理，遵守商业道德和职业道德，遵循公正公平、公开透明、科学合理和诚实信用的原则。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第五条","ordinal":5,"division":"第一章 总 则","text":"鼓励相关行业组织加强行业自律，建立健全行业标准、行业准则和自律管理制度，督促指导算法推荐服务提供者制定完善服务规范、依法提供服务并接受社会监督。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第六条","ordinal":6,"division":"第二章 信息服务规范","text":"算法推荐服务提供者应当坚持主流价值导向，优化算法推荐服务机制，积极传播正能量，促进算法应用向上向善。\n算法推荐服务提供者不得利用算法推荐服务从事危害国家安全和社会公共利益、扰乱经济秩序和社会秩序、侵犯他人合法权益等法律、行政法规禁止的活动，不得利用算法推荐服务传播法律、行政法规禁止的信息，应当采取措施防范和抵制传播不良信息。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第七条","ordinal":7,"division":"第二章 信息服务规范","text":"算法推荐服务提供者应当落实算法安全主体责任，建立健全算法机制机理审核、科技伦理审查、用户注册、信息发布审核、数据安全和个人信息保护、反电信网络诈骗、安全评估监测、安全事件应急处置等管理制度和技术措施，制定并公开算法推荐服务相关规则，配备与算法推荐服务规模相适应的专业人员和技术支撑。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第八条","ordinal":8,"division":"第二章 信息服务规范","text":"算法推荐服务提供者应当定期审核、评估、验证算法机制机理、模型、数据和应用结果等，不得设置诱导用户沉迷、过度消费等违反法律法规或者违背伦理道德的算法模型。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第九条","ordinal":9,"division":"第二章 信息服务规范","text":"算法推荐服务提供者应当加强信息安全管理，建立健全用于识别违法和不良信息的特征库，完善入库标准、规则和程序。发现未作显著标识的算法生成合成信息的，应当作出显著标识后，方可继续传输。\n发现违法信息的，应当立即停止传输，采取消除等处置措施，防止信息扩散，保存有关记录，并向网信部门和有关部门报告。发现不良信息的，应当按照网络信息内容生态治理有关规定予以处置。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第十条","ordinal":10,"division":"第二章 信息服务规范","text":"算法推荐服务提供者应当加强用户模型和用户标签管理，完善记入用户模型的兴趣点规则和用户标签管理规则，不得将违法和不良信息关键词记入用户兴趣点或者作为用户标签并据以推送信息。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第十一条","ordinal":11,"division":"第二章 信息服务规范","text":"算法推荐服务提供者应当加强算法推荐服务版面页面生态管理，建立完善人工干预和用户自主选择机制，在首页首屏、热搜、精选、榜单类、弹窗等重点环节积极呈现符合主流价值导向的信息。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第十二条","ordinal":12,"division":"第二章 信息服务规范","text":"鼓励算法推荐服务提供者综合运用内容去重、打散干预等策略，并优化检索、排序、选择、推送、展示等规则的透明度和可解释性，避免对用户产生不良影响，预防和减少争议纠纷。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第十三条","ordinal":13,"division":"第二章 信息服务规范","text":"算法推荐服务提供者提供互联网新闻信息服务的，应当依法取得互联网新闻信息服务许可，规范开展互联网新闻信息采编发布服务、转载服务和传播平台服务，不得生成合成虚假新闻信息，不得传播非国家规定范围内的单位发布的新闻信息。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第十四条","ordinal":14,"division":"第二章 信息服务规范","text":"算法推荐服务提供者不得利用算法虚假注册账号、非法交易账号、操纵用户账号或者虚假点赞、评论、转发，不得利用算法屏蔽信息、过度推荐、操纵榜单或者检索结果排序、控制热搜或者精选等干预信息呈现，实施影响网络舆论或者规避监督管理行为。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第十五条","ordinal":15,"division":"第二章 信息服务规范","text":"算法推荐服务提供者不得利用算法对其他互联网信息服务提供者进行不合理限制，或者妨碍、破坏其合法提供的互联网信息服务正常运行，实施垄断和不正当竞争行为。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第十六条","ordinal":16,"division":"第三章 用户权益保护","text":"算法推荐服务提供者应当以显著方式告知用户其提供算法推荐服务的情况，并以适当方式公示算法推荐服务的基本原理、目的意图和主要运行机制等。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第十七条","ordinal":17,"division":"第三章 用户权益保护","text":"算法推荐服务提供者应当向用户提供不针对其个人特征的选项，或者向用户提供便捷的关闭算法推荐服务的选项。用户选择关闭算法推荐服务的，算法推荐服务提供者应当立即停止提供相关服务。\n算法推荐服务提供者应当向用户提供选择或者删除用于算法推荐服务的针对其个人特征的用户标签的功能。\n算法推荐服务提供者应用算法对用户权益造成重大影响的，应当依法予以说明并承担相应责任。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第十八条","ordinal":18,"division":"第三章 用户权益保护","text":"算法推荐服务提供者向未成年人提供服务的，应当依法履行未成年人网络保护义务，并通过开发适合未成年人使用的模式、提供适合未成年人特点的服务等方式，便利未成年人获取有益身心健康的信息。\n算法推荐服务提供者不得向未成年人推送可能引发未成年人模仿不安全行为和违反社会公德行为、诱导未成年人不良嗜好等可能影响未成年人身心健康的信息，不得利用算法推荐服务诱导未成年人沉迷网络。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第十九条","ordinal":19,"division":"第三章 用户权益保护","text":"算法推荐服务提供者向老年人提供服务的，应当保障老年人依法享有的权益，充分考虑老年人出行、就医、消费、办事等需求，按照国家有关规定提供智能化适老服务，依法开展涉电信网络诈骗信息的监测、识别和处置，便利老年人安全使用算法推荐服务。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第二十条","ordinal":20,"division":"第三章 用户权益保护","text":"算法推荐服务提供者向劳动者提供工作调度服务的，应当保护劳动者取得劳动报酬、休息休假等合法权益，建立完善平台订单分配、报酬构成及支付、工作时间、奖惩等相关算法。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第二十一条","ordinal":21,"division":"第三章 用户权益保护","text":"算法推荐服务提供者向消费者销售商品或者提供服务的，应当保护消费者公平交易的权利，不得根据消费者的偏好、交易习惯等特征，利用算法在交易价格等交易条件上实施不合理的差别待遇等违法行为。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第二十二条","ordinal":22,"division":"第三章 用户权益保护","text":"算法推荐服务提供者应当设置便捷有效的用户申诉和公众投诉、举报入口，明确处理流程和反馈时限，及时受理、处理并反馈处理结果。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第二十三条","ordinal":23,"division":"第四章 监督管理","text":"网信部门会同电信、公安、市场监管等有关部门建立算法分级分类安全管理制度，根据算法推荐服务的舆论属性或者社会动员能力、内容类别、用户规模、算法推荐技术处理的数据重要程度、对用户行为的干预程度等对算法推荐服务提供者实施分级分类管理。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第二十四条","ordinal":24,"division":"第四章 监督管理","text":"具有舆论属性或者社会动员能力的算法推荐服务提供者应当在提供服务之日起十个工作日内通过互联网信息服务算法备案系统填报服务提供者的名称、服务形式、应用领域、算法类型、算法自评估报告、拟公示内容等信息，履行备案手续。\n算法推荐服务提供者的备案信息发生变更的，应当在变更之日起十个工作日内办理变更手续。\n算法推荐服务提供者终止服务的，应当在终止服务之日起二十个工作日内办理注销备案手续，并作出妥善安排。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第二十五条","ordinal":25,"division":"第四章 监督管理","text":"国家和省、自治区、直辖市网信部门收到备案人提交的备案材料后，材料齐全的，应当在三十个工作日内予以备案，发放备案编号并进行公示；材料不齐全的，不予备案，并应当在三十个工作日内通知备案人并说明理由。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第二十六条","ordinal":26,"division":"第四章 监督管理","text":"完成备案的算法推荐服务提供者应当在其对外提供服务的网站、应用程序等的显著位置标明其备案编号并提供公示信息链接。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第二十七条","ordinal":27,"division":"第四章 监督管理","text":"具有舆论属性或者社会动员能力的算法推荐服务提供者应当按照国家有关规定开展安全评估。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第二十八条","ordinal":28,"division":"第四章 监督管理","text":"网信部门会同电信、公安、市场监管等有关部门对算法推荐服务依法开展安全评估和监督检查工作，对发现的问题及时提出整改意见并限期整改。\n算法推荐服务提供者应当依法留存网络日志，配合网信部门和电信、公安、市场监管等有关部门开展安全评估和监督检查工作，并提供必要的技术、数据等支持和协助。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第二十九条","ordinal":29,"division":"第四章 监督管理","text":"参与算法推荐服务安全评估和监督检查的相关机构和人员对在履行职责中知悉的个人隐私、个人信息和商业秘密应当依法予以保密，不得泄露或者非法向他人提供。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第三十条","ordinal":30,"division":"第四章 监督管理","text":"任何组织和个人发现违反本规定行为的，可以向网信部门和有关部门投诉、举报。收到投诉、举报的部门应当及时依法处理。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第三十一条","ordinal":31,"division":"第五章 法律责任","text":"算法推荐服务提供者违反本规定第七条、第八条、第九条第一款、第十条、第十四条、第十六条、第十七条、第二十二条、第二十四条、第二十六条规定，法律、行政法规有规定的，依照其规定；法律、行政法规没有规定的，由网信部门和电信、公安、市场监管等有关部门依据职责给予警告、通报批评，责令限期改正；拒不改正或者情节严重的，责令暂停信息更新，并处一万元以上十万元以下罚款。构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第三十二条","ordinal":32,"division":"第五章 法律责任","text":"算法推荐服务提供者违反本规定第六条、第九条第二款、第十一条、第十三条、第十五条、第十八条、第十九条、第二十条、第二十一条、第二十七条、第二十八条第二款规定的，由网信部门和电信、公安、市场监管等有关部门依据职责，按照有关法律、行政法规和部门规章的规定予以处理。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第三十三条","ordinal":33,"division":"第五章 法律责任","text":"具有舆论属性或者社会动员能力的算法推荐服务提供者通过隐瞒有关情况、提供虚假材料等不正当手段取得备案的，由国家和省、自治区、直辖市网信部门予以撤销备案，给予警告、通报批评；情节严重的，责令暂停信息更新，并处一万元以上十万元以下罚款。\n具有舆论属性或者社会动员能力的算法推荐服务提供者终止服务未按照本规定第二十四条第三款要求办理注销备案手续，或者发生严重违法情形受到责令关闭网站、吊销相关业务许可证或者吊销营业执照等行政处罚的，由国家和省、自治区、直辖市网信部门予以注销备案。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第三十四条","ordinal":34,"division":"第六章 附 则","text":"本规定由国家互联网信息办公室会同工业和信息化部、公安部、国家市场监督管理总局负责解释。","source_id":"SRC-CN-CAC-ALGO-2022"},{"no":"第三十五条","ordinal":35,"division":"第六章 附 则","text":"本规定自2022年3月1日起施行。","source_id":"SRC-CN-CAC-ALGO-2022"}],"amended_by":[],"verification":"VERIFIED","evidence_grade":"A"},{"id":"CN-CAC-CROSSBORDER-2024","jurisdiction":"CN","title":"促进和规范数据跨境流动规定","short_title":"数据跨境流动规定","issuer":"国家互联网信息办公室","doc_number":"国家互联网信息办公室令第16号","level":"部门规章","instrument_type":"RELATED_LAW","foreign_related":"FOREIGN_SPECIFIC","status":"IN_FORCE","status_note":"自公布之日起施行，故生效日取公布日；本规定第十三条改写了 11 号令、13 号令的若干要求，逐条变动未标注","published_at":"2024-03-22","effective_at":"2024-03-22","language":"zh","discovered_via":"中国网信网原文页","source_id":"SRC-CN-CAC-CROSSBORDER-2024","source_ids":["SRC-CN-CAC-CROSSBORDER-2024"],"complete":true,"expected_provisions":14,"meta_evidence":{"doc_number":"国家互联网信息办公室令 第16号","published_at":"2024年3月22日","effective_at":"现予公布，自公布之日起施行","issuer":"国家互联网信息办公室令"},"derived_dates":{"effective_at":{"from":"published_at","plus_days":0,"basis":"effective_at"}},"generated_by":"ingest/instruments/CN-CAC-CROSSBORDER-2024.json","provisions":[{"no":"第一条","ordinal":1,"division":"","text":"为了保障数据安全，保护个人信息权益，促进数据依法有序自由流动，根据《中华人民共和国网络安全法》、《中华人民共和国数据安全法》、《中华人民共和国个人信息保护法》等法律法规，对于数据出境安全评估、个人信息出境标准合同、个人信息保护认证等数据出境制度的施行，制定本规定。","source_id":"SRC-CN-CAC-CROSSBORDER-2024"},{"no":"第二条","ordinal":2,"division":"","text":"数据处理者应当按照相关规定识别、申报重要数据。未被相关部门、地区告知或者公开发布为重要数据的，数据处理者不需要作为重要数据申报数据出境安全评估。","source_id":"SRC-CN-CAC-CROSSBORDER-2024"},{"no":"第三条","ordinal":3,"division":"","text":"国际贸易、跨境运输、学术合作、跨国生产制造和市场营销等活动中收集和产生的数据向境外提供，不包含个人信息或者重要数据的，免予申报数据出境安全评估、订立个人信息出境标准合同、通过个人信息保护认证。","source_id":"SRC-CN-CAC-CROSSBORDER-2024"},{"no":"第四条","ordinal":4,"division":"","text":"数据处理者在境外收集和产生的个人信息传输至境内处理后向境外提供，处理过程中没有引入境内个人信息或者重要数据的，免予申报数据出境安全评估、订立个人信息出境标准合同、通过个人信息保护认证。","source_id":"SRC-CN-CAC-CROSSBORDER-2024"},{"no":"第五条","ordinal":5,"division":"","text":"数据处理者向境外提供个人信息，符合下列条件之一的，免予申报数据出境安全评估、订立个人信息出境标准合同、通过个人信息保护认证：\n（一）为订立、履行个人作为一方当事人的合同，如跨境购物、跨境寄递、跨境汇款、跨境支付、跨境开户、机票酒店预订、签证办理、考试服务等，确需向境外提供个人信息的；\n（二）按照依法制定的劳动规章制度和依法签订的集体合同实施跨境人力资源管理，确需向境外提供员工个人信息的；\n（三）紧急情况下为保护自然人的生命健康和财产安全，确需向境外提供个人信息的；\n（四）关键信息基础设施运营者以外的数据处理者自当年1月1日起累计向境外提供不满10万人个人信息（不含敏感个人信息）的。\n前款所称向境外提供的个人信息，不包括重要数据。","source_id":"SRC-CN-CAC-CROSSBORDER-2024"},{"no":"第六条","ordinal":6,"division":"","text":"自由贸易试验区在国家数据分类分级保护制度框架下，可以自行制定区内需要纳入数据出境安全评估、个人信息出境标准合同、个人信息保护认证管理范围的数据清单（以下简称负面清单），经省级网络安全和信息化委员会批准后，报国家网信部门、国家数据管理部门备案。\n自由贸易试验区内数据处理者向境外提供负面清单外的数据，可以免予申报数据出境安全评估、订立个人信息出境标准合同、通过个人信息保护认证。","source_id":"SRC-CN-CAC-CROSSBORDER-2024"},{"no":"第七条","ordinal":7,"division":"","text":"数据处理者向境外提供数据，符合下列条件之一的，应当通过所在地省级网信部门向国家网信部门申报数据出境安全评估：\n（一）关键信息基础设施运营者向境外提供个人信息或者重要数据；\n（二）关键信息基础设施运营者以外的数据处理者向境外提供重要数据，或者自当年1月1日起累计向境外提供100万人以上个人信息（不含敏感个人信息）或者1万人以上敏感个人信息。\n属于本规定第三条、第四条、第五条、第六条规定情形的，从其规定。","source_id":"SRC-CN-CAC-CROSSBORDER-2024"},{"no":"第八条","ordinal":8,"division":"","text":"关键信息基础设施运营者以外的数据处理者自当年1月1日起累计向境外提供10万人以上、不满100万人个人信息（不含敏感个人信息）或者不满1万人敏感个人信息的，应当依法与境外接收方订立个人信息出境标准合同或者通过个人信息保护认证。\n属于本规定第三条、第四条、第五条、第六条规定情形的，从其规定。","source_id":"SRC-CN-CAC-CROSSBORDER-2024"},{"no":"第九条","ordinal":9,"division":"","text":"通过数据出境安全评估的结果有效期为3年，自评估结果出具之日起计算。有效期届满，需要继续开展数据出境活动且未发生需要重新申报数据出境安全评估情形的，数据处理者可以在有效期届满前60个工作日内通过所在地省级网信部门向国家网信部门提出延长评估结果有效期申请。经国家网信部门批准，可以延长评估结果有效期3年。","source_id":"SRC-CN-CAC-CROSSBORDER-2024"},{"no":"第十条","ordinal":10,"division":"","text":"数据处理者向境外提供个人信息的，应当按照法律、行政法规的规定履行告知、取得个人单独同意、进行个人信息保护影响评估等义务。","source_id":"SRC-CN-CAC-CROSSBORDER-2024"},{"no":"第十一条","ordinal":11,"division":"","text":"数据处理者向境外提供数据的，应当遵守法律、法规的规定，履行数据安全保护义务，采取技术措施和其他必要措施，保障数据出境安全。发生或者可能发生数据安全事件的，应当采取补救措施，及时向省级以上网信部门和其他有关主管部门报告。","source_id":"SRC-CN-CAC-CROSSBORDER-2024"},{"no":"第十二条","ordinal":12,"division":"","text":"各地网信部门应当加强对数据处理者数据出境活动的指导监督，健全完善数据出境安全评估制度，优化评估流程；强化事前事中事后全链条全领域监管，发现数据出境活动存在较大风险或者发生数据安全事件的，要求数据处理者进行整改，消除隐患；对拒不改正或者造成严重后果的，依法追究法律责任。","source_id":"SRC-CN-CAC-CROSSBORDER-2024"},{"no":"第十三条","ordinal":13,"division":"","text":"2022年7月7日公布的《数据出境安全评估办法》（国家互联网信息办公室令第11号）、2023年2月22日公布的《个人信息出境标准合同办法》（国家互联网信息办公室令第13号）等相关规定与本规定不一致的，适用本规定。","source_id":"SRC-CN-CAC-CROSSBORDER-2024"},{"no":"第十四条","ordinal":14,"division":"","text":"本规定自公布之日起施行。","source_id":"SRC-CN-CAC-CROSSBORDER-2024"}],"amended_by":[],"verification":"VERIFIED","evidence_grade":"A"},{"id":"CN-CAC-DEEPSYN-2022","jurisdiction":"CN","title":"互联网信息服务深度合成管理规定","short_title":"深度合成规定","issuer":"国家互联网信息办公室、工业和信息化部、公安部","doc_number":"国家互联网信息办公室 中华人民共和国工业和信息化部 中华人民共和国公安部 令 第12号","level":"部门规章","instrument_type":"AI_SPECIFIC","status":"IN_FORCE","status_note":"施行日期见原文；后续修订未专门核查","published_at":"2022-11-25","effective_at":"2023-01-10","language":"zh","discovered_via":"AGORA 36（英译本线索）；原文取自中国网信网","foreign_related":"DOMESTIC","source_id":"SRC-CN-CAC-DEEPSYN-2022","source_ids":["SRC-CN-CAC-DEEPSYN-2022"],"complete":true,"expected_provisions":25,"meta_evidence":{"doc_number":"国家互联网信息办公室 中华人民共和国工业和信息化部 中华人民共和国公安部 令 第12号","published_at":"2022年11月25日","effective_at":"自2023年1月10日起施行","issuer":"已经2022年11月3日国家互联网信息办公室2022年第21次室务会议审议通过，并经工业和信息化部、公安部同意"},"derived_dates":{},"generated_by":"ingest/instruments/CN-CAC-DEEPSYN-2022.json","provisions":[{"no":"第一条","ordinal":1,"division":"第一章 总则","text":"为了加强互联网信息服务深度合成管理，弘扬社会主义核心价值观，维护国家安全和社会公共利益，保护公民、法人和其他组织的合法权益，根据《中华人民共和国网络安全法》、《中华人民共和国数据安全法》、《中华人民共和国个人信息保护法》、《互联网信息服务管理办法》等法律、行政法规，制定本规定。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第二条","ordinal":2,"division":"第一章 总则","text":"在中华人民共和国境内应用深度合成技术提供互联网信息服务（以下简称深度合成服务），适用本规定。法律、行政法规另有规定的，依照其规定。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第三条","ordinal":3,"division":"第一章 总则","text":"国家网信部门负责统筹协调全国深度合成服务的治理和相关监督管理工作。国务院电信主管部门、公安部门依据各自职责负责深度合成服务的监督管理工作。\n地方网信部门负责统筹协调本行政区域内的深度合成服务的治理和相关监督管理工作。地方电信主管部门、公安部门依据各自职责负责本行政区域内的深度合成服务的监督管理工作。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第四条","ordinal":4,"division":"第一章 总则","text":"提供深度合成服务，应当遵守法律法规，尊重社会公德和伦理道德，坚持正确政治方向、舆论导向、价值取向，促进深度合成服务向上向善。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第五条","ordinal":5,"division":"第一章 总则","text":"鼓励相关行业组织加强行业自律，建立健全行业标准、行业准则和自律管理制度，督促指导深度合成服务提供者和技术支持者制定完善业务规范、依法开展业务和接受社会监督。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第六条","ordinal":6,"division":"第二章 一般规定","text":"任何组织和个人不得利用深度合成服务制作、复制、发布、传播法律、行政法规禁止的信息，不得利用深度合成服务从事危害国家安全和利益、损害国家形象、侵害社会公共利益、扰乱经济和社会秩序、侵犯他人合法权益等法律、行政法规禁止的活动。\n深度合成服务提供者和使用者不得利用深度合成服务制作、复制、发布、传播虚假新闻信息。转载基于深度合成服务制作发布的新闻信息的，应当依法转载互联网新闻信息稿源单位发布的新闻信息。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第七条","ordinal":7,"division":"第二章 一般规定","text":"深度合成服务提供者应当落实信息安全主体责任，建立健全用户注册、算法机制机理审核、科技伦理审查、信息发布审核、数据安全、个人信息保护、反电信网络诈骗、应急处置等管理制度，具有安全可控的技术保障措施。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第八条","ordinal":8,"division":"第二章 一般规定","text":"深度合成服务提供者应当制定和公开管理规则、平台公约，完善服务协议，依法依约履行管理责任，以显著方式提示深度合成服务技术支持者和使用者承担信息安全义务。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第九条","ordinal":9,"division":"第二章 一般规定","text":"深度合成服务提供者应当基于移动电话号码、身份证件号码、统一社会信用代码或者国家网络身份认证公共服务等方式，依法对深度合成服务使用者进行真实身份信息认证，不得向未进行真实身份信息认证的深度合成服务使用者提供信息发布服务。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第十条","ordinal":10,"division":"第二章 一般规定","text":"深度合成服务提供者应当加强深度合成内容管理，采取技术或者人工方式对深度合成服务使用者的输入数据和合成结果进行审核。\n深度合成服务提供者应当建立健全用于识别违法和不良信息的特征库，完善入库标准、规则和程序，记录并留存相关网络日志。\n深度合成服务提供者发现违法和不良信息的，应当依法采取处置措施，保存有关记录，及时向网信部门和有关主管部门报告；对相关深度合成服务使用者依法依约采取警示、限制功能、暂停服务、关闭账号等处置措施。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第十一条","ordinal":11,"division":"第二章 一般规定","text":"深度合成服务提供者应当建立健全辟谣机制，发现利用深度合成服务制作、复制、发布、传播虚假信息的，应当及时采取辟谣措施，保存有关记录，并向网信部门和有关主管部门报告。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第十二条","ordinal":12,"division":"第二章 一般规定","text":"深度合成服务提供者应当设置便捷的用户申诉和公众投诉、举报入口，公布处理流程和反馈时限，及时受理、处理和反馈处理结果。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第十三条","ordinal":13,"division":"第二章 一般规定","text":"互联网应用商店等应用程序分发平台应当落实上架审核、日常管理、应急处置等安全管理责任，核验深度合成类应用程序的安全评估、备案等情况；对违反国家有关规定的，应当及时采取不予上架、警示、暂停服务或者下架等处置措施。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第十四条","ordinal":14,"division":"第三章 数据和技术管理规范","text":"深度合成服务提供者和技术支持者应当加强训练数据管理，采取必要措施保障训练数据安全；训练数据包含个人信息的，应当遵守个人信息保护的有关规定。\n深度合成服务提供者和技术支持者提供人脸、人声等生物识别信息编辑功能的，应当提示深度合成服务使用者依法告知被编辑的个人，并取得其单独同意。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第十五条","ordinal":15,"division":"第三章 数据和技术管理规范","text":"深度合成服务提供者和技术支持者应当加强技术管理，定期审核、评估、验证生成合成类算法机制机理。\n深度合成服务提供者和技术支持者提供具有以下功能的模型、模板等工具的，应当依法自行或者委托专业机构开展安全评估：\n（一）生成或者编辑人脸、人声等生物识别信息的；\n（二）生成或者编辑可能涉及国家安全、国家形象、国家利益和社会公共利益的特殊物体、场景等非生物识别信息的。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第十六条","ordinal":16,"division":"第三章 数据和技术管理规范","text":"深度合成服务提供者对使用其服务生成或者编辑的信息内容，应当采取技术措施添加不影响用户使用的标识，并依照法律、行政法规和国家有关规定保存日志信息。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第十七条","ordinal":17,"division":"第三章 数据和技术管理规范","text":"深度合成服务提供者提供以下深度合成服务，可能导致公众混淆或者误认的，应当在生成或者编辑的信息内容的合理位置、区域进行显著标识，向公众提示深度合成情况：\n（一）智能对话、智能写作等模拟自然人进行文本的生成或者编辑服务；\n（二）合成人声、仿声等语音生成或者显著改变个人身份特征的编辑服务；\n（三）人脸生成、人脸替换、人脸操控、姿态操控等人物图像、视频生成或者显著改变个人身份特征的编辑服务；\n（四）沉浸式拟真场景等生成或者编辑服务；\n（五）其他具有生成或者显著改变信息内容功能的服务。\n深度合成服务提供者提供前款规定之外的深度合成服务的，应当提供显著标识功能，并提示深度合成服务使用者可以进行显著标识。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第十八条","ordinal":18,"division":"第三章 数据和技术管理规范","text":"任何组织和个人不得采用技术手段删除、篡改、隐匿本规定第十六条和第十七条规定的深度合成标识。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第十九条","ordinal":19,"division":"第四章 监督检查与法律责任","text":"具有舆论属性或者社会动员能力的深度合成服务提供者，应当按照《互联网信息服务算法推荐管理规定》履行备案和变更、注销备案手续。\n深度合成服务技术支持者应当参照前款规定履行备案和变更、注销备案手续。\n完成备案的深度合成服务提供者和技术支持者应当在其对外提供服务的网站、应用程序等的显著位置标明其备案编号并提供公示信息链接。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第二十条","ordinal":20,"division":"第四章 监督检查与法律责任","text":"深度合成服务提供者开发上线具有舆论属性或者社会动员能力的新产品、新应用、新功能的，应当按照国家有关规定开展安全评估。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第二十一条","ordinal":21,"division":"第四章 监督检查与法律责任","text":"网信部门和电信主管部门、公安部门依据职责对深度合成服务开展监督检查。深度合成服务提供者和技术支持者应当依法予以配合，并提供必要的技术、数据等支持和协助。\n网信部门和有关主管部门发现深度合成服务存在较大信息安全风险的，可以按照职责依法要求深度合成服务提供者和技术支持者采取暂停信息更新、用户账号注册或者其他相关服务等措施。深度合成服务提供者和技术支持者应当按照要求采取措施，进行整改，消除隐患。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第二十二条","ordinal":22,"division":"第四章 监督检查与法律责任","text":"深度合成服务提供者和技术支持者违反本规定的，依照有关法律、行政法规的规定处罚；造成严重后果的，依法从重处罚。\n构成违反治安管理行为的，由公安机关依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第二十三条","ordinal":23,"division":"第五章 附则","text":"本规定中下列用语的含义：\n深度合成技术，是指利用深度学习、虚拟现实等生成合成类算法制作文本、图像、音频、视频、虚拟场景等网络信息的技术，包括但不限于：\n（一）篇章生成、文本风格转换、问答对话等生成或者编辑文本内容的技术；\n（二）文本转语音、语音转换、语音属性编辑等生成或者编辑语音内容的技术；\n（三）音乐生成、场景声编辑等生成或者编辑非语音内容的技术；\n（四）人脸生成、人脸替换、人物属性编辑、人脸操控、姿态操控等生成或者编辑图像、视频内容中生物特征的技术；\n（五）图像生成、图像增强、图像修复等生成或者编辑图像、视频内容中非生物特征的技术；\n（六）三维重建、数字仿真等生成或者编辑数字人物、虚拟场景的技术。\n深度合成服务提供者，是指提供深度合成服务的组织、个人。\n深度合成服务技术支持者，是指为深度合成服务提供技术支持的组织、个人。\n深度合成服务使用者，是指使用深度合成服务制作、复制、发布、传播信息的组织、个人。\n训练数据，是指被用于训练机器学习模型的标注或者基准数据集。\n沉浸式拟真场景，是指应用深度合成技术生成或者编辑的、可供参与者体验或者互动的、具有高度真实感的虚拟场景。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第二十四条","ordinal":24,"division":"第五章 附则","text":"深度合成服务提供者和技术支持者从事网络出版服务、网络文化活动和网络视听节目服务的，应当同时符合新闻出版、文化和旅游、广播电视主管部门的规定。","source_id":"SRC-CN-CAC-DEEPSYN-2022"},{"no":"第二十五条","ordinal":25,"division":"第五章 附则","text":"本规定自2023年1月10日起施行。","source_id":"SRC-CN-CAC-DEEPSYN-2022"}],"amended_by":[],"verification":"VERIFIED","evidence_grade":"A"},{"id":"CN-CAC-EXPORT-ASSESS-2022","jurisdiction":"CN","title":"数据出境安全评估办法","short_title":"数据出境安全评估办法","issuer":"国家互联网信息办公室","doc_number":"国家互联网信息办公室令第11号","level":"部门规章","instrument_type":"RELATED_LAW","foreign_related":"FOREIGN_SPECIFIC","status":"IN_FORCE","status_note":"库内为 2022 年公布原文；第十四条的有效期与申报门槛已被 2024 年《促进和规范数据跨境流动规定》调整，逐条变动未标注","published_at":"2022-07-07","effective_at":"2022-09-01","language":"zh","discovered_via":"中国网信网原文页","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022","source_ids":["SRC-CN-CAC-EXPORT-ASSESS-2022"],"complete":true,"expected_provisions":20,"meta_evidence":{"doc_number":"国家互联网信息办公室令 第11号","published_at":"2022年7月7日","effective_at":"自2022年9月1日起施行","issuer":"国家互联网信息办公室令"},"derived_dates":{},"generated_by":"ingest/instruments/CN-CAC-EXPORT-ASSESS-2022.json","provisions":[{"no":"第一条","ordinal":1,"division":"","text":"为了规范数据出境活动，保护个人信息权益，维护国家安全和社会公共利益，促进数据跨境安全、自由流动，根据《中华人民共和国网络安全法》、《中华人民共和国数据安全法》、《中华人民共和国个人信息保护法》等法律法规，制定本办法。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第二条","ordinal":2,"division":"","text":"数据处理者向境外提供在中华人民共和国境内运营中收集和产生的重要数据和个人信息的安全评估，适用本办法。法律、行政法规另有规定的，依照其规定。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第三条","ordinal":3,"division":"","text":"数据出境安全评估坚持事前评估和持续监督相结合、风险自评估与安全评估相结合，防范数据出境安全风险，保障数据依法有序自由流动。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第四条","ordinal":4,"division":"","text":"数据处理者向境外提供数据，有下列情形之一的，应当通过所在地省级网信部门向国家网信部门申报数据出境安全评估：\n（一）数据处理者向境外提供重要数据；\n（二）关键信息基础设施运营者和处理100万人以上个人信息的数据处理者向境外提供个人信息；\n（三）自上年1月1日起累计向境外提供10万人个人信息或者1万人敏感个人信息的数据处理者向境外提供个人信息；\n（四）国家网信部门规定的其他需要申报数据出境安全评估的情形。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第五条","ordinal":5,"division":"","text":"数据处理者在申报数据出境安全评估前，应当开展数据出境风险自评估，重点评估以下事项：\n（一）数据出境和境外接收方处理数据的目的、范围、方式等的合法性、正当性、必要性；\n（二）出境数据的规模、范围、种类、敏感程度，数据出境可能对国家安全、公共利益、个人或者组织合法权益带来的风险；\n（三）境外接收方承诺承担的责任义务，以及履行责任义务的管理和技术措施、能力等能否保障出境数据的安全；\n（四）数据出境中和出境后遭到篡改、破坏、泄露、丢失、转移或者被非法获取、非法利用等的风险，个人信息权益维护的渠道是否通畅等；\n（五）与境外接收方拟订立的数据出境相关合同或者其他具有法律效力的文件等（以下统称法律文件）是否充分约定了数据安全保护责任义务；\n（六）其他可能影响数据出境安全的事项。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第六条","ordinal":6,"division":"","text":"申报数据出境安全评估，应当提交以下材料：\n（一）申报书；\n（二）数据出境风险自评估报告；\n（三）数据处理者与境外接收方拟订立的法律文件；\n（四）安全评估工作需要的其他材料。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第七条","ordinal":7,"division":"","text":"省级网信部门应当自收到申报材料之日起5个工作日内完成完备性查验。申报材料齐全的，将申报材料报送国家网信部门；申报材料不齐全的，应当退回数据处理者并一次性告知需要补充的材料。\n国家网信部门应当自收到申报材料之日起7个工作日内，确定是否受理并书面通知数据处理者。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第八条","ordinal":8,"division":"","text":"数据出境安全评估重点评估数据出境活动可能对国家安全、公共利益、个人或者组织合法权益带来的风险，主要包括以下事项：\n（一）数据出境的目的、范围、方式等的合法性、正当性、必要性；\n（二）境外接收方所在国家或者地区的数据安全保护政策法规和网络安全环境对出境数据安全的影响；境外接收方的数据保护水平是否达到中华人民共和国法律、行政法规的规定和强制性国家标准的要求；\n（三）出境数据的规模、范围、种类、敏感程度，出境中和出境后遭到篡改、破坏、泄露、丢失、转移或者被非法获取、非法利用等的风险；\n（四）数据安全和个人信息权益是否能够得到充分有效保障；\n（五）数据处理者与境外接收方拟订立的法律文件中是否充分约定了数据安全保护责任义务；\n（六）遵守中国法律、行政法规、部门规章情况；\n（七）国家网信部门认为需要评估的其他事项。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第九条","ordinal":9,"division":"","text":"数据处理者应当在与境外接收方订立的法律文件中明确约定数据安全保护责任义务，至少包括以下内容：\n（一）数据出境的目的、方式和数据范围，境外接收方处理数据的用途、方式等；\n（二）数据在境外保存地点、期限，以及达到保存期限、完成约定目的或者法律文件终止后出境数据的处理措施；\n（三）对于境外接收方将出境数据再转移给其他组织、个人的约束性要求；\n（四）境外接收方在实际控制权或者经营范围发生实质性变化，或者所在国家、地区数据安全保护政策法规和网络安全环境发生变化以及发生其他不可抗力情形导致难以保障数据安全时，应当采取的安全措施；\n（五）违反法律文件约定的数据安全保护义务的补救措施、违约责任和争议解决方式；\n（六）出境数据遭到篡改、破坏、泄露、丢失、转移或者被非法获取、非法利用等风险时，妥善开展应急处置的要求和保障个人维护其个人信息权益的途径和方式。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第十条","ordinal":10,"division":"","text":"国家网信部门受理申报后，根据申报情况组织国务院有关部门、省级网信部门、专门机构等进行安全评估。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第十一条","ordinal":11,"division":"","text":"安全评估过程中，发现数据处理者提交的申报材料不符合要求的，国家网信部门可以要求其补充或者更正。数据处理者无正当理由不补充或者更正的，国家网信部门可以终止安全评估。\n数据处理者对所提交材料的真实性负责，故意提交虚假材料的，按照评估不通过处理，并依法追究相应法律责任。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第十二条","ordinal":12,"division":"","text":"国家网信部门应当自向数据处理者发出书面受理通知书之日起45个工作日内完成数据出境安全评估；情况复杂或者需要补充、更正材料的，可以适当延长并告知数据处理者预计延长的时间。\n评估结果应当书面通知数据处理者。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第十三条","ordinal":13,"division":"","text":"数据处理者对评估结果有异议的，可以在收到评估结果15个工作日内向国家网信部门申请复评，复评结果为最终结论。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第十四条","ordinal":14,"division":"","text":"通过数据出境安全评估的结果有效期为2年，自评估结果出具之日起计算。在有效期内出现以下情形之一的，数据处理者应当重新申报评估：\n（一）向境外提供数据的目的、方式、范围、种类和境外接收方处理数据的用途、方式发生变化影响出境数据安全的，或者延长个人信息和重要数据境外保存期限的；\n（二）境外接收方所在国家或者地区数据安全保护政策法规和网络安全环境发生变化以及发生其他不可抗力情形、数据处理者或者境外接收方实际控制权发生变化、数据处理者与境外接收方法律文件变更等影响出境数据安全的；\n（三）出现影响出境数据安全的其他情形。\n有效期届满，需要继续开展数据出境活动的，数据处理者应当在有效期届满60个工作日前重新申报评估。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第十五条","ordinal":15,"division":"","text":"参与安全评估工作的相关机构和人员对在履行职责中知悉的国家秘密、个人隐私、个人信息、商业秘密、保密商务信息等数据应当依法予以保密，不得泄露或者非法向他人提供、非法使用。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第十六条","ordinal":16,"division":"","text":"任何组织和个人发现数据处理者违反本办法向境外提供数据的，可以向省级以上网信部门举报。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第十七条","ordinal":17,"division":"","text":"国家网信部门发现已经通过评估的数据出境活动在实际处理过程中不再符合数据出境安全管理要求的，应当书面通知数据处理者终止数据出境活动。数据处理者需要继续开展数据出境活动的，应当按照要求整改，整改完成后重新申报评估。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第十八条","ordinal":18,"division":"","text":"违反本办法规定的，依据《中华人民共和国网络安全法》、《中华人民共和国数据安全法》、《中华人民共和国个人信息保护法》等法律法规处理；构成犯罪的，依法追究刑事责任。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第十九条","ordinal":19,"division":"","text":"本办法所称重要数据，是指一旦遭到篡改、破坏、泄露或者非法获取、非法利用等，可能危害国家安全、经济运行、社会稳定、公共健康和安全等的数据。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"},{"no":"第二十条","ordinal":20,"division":"","text":"本办法自2022年9月1日起施行。本办法施行前已经开展的数据出境活动，不符合本办法规定的，应当自本办法施行之日起6个月内完成整改。","source_id":"SRC-CN-CAC-EXPORT-ASSESS-2022"}],"amended_by":[],"verification":"VERIFIED","evidence_grade":"A"},{"id":"CN-CAC-EXPORT-CERT-2025","jurisdiction":"CN","title":"个人信息出境认证办法","short_title":"个人信息出境认证办法","issuer":"国家互联网信息办公室、国家市场监督管理总局","doc_number":"国家互联网信息办公室 国家市场监督管理总局令第20号","level":"部门规章","instrument_type":"RELATED_LAW","foreign_related":"FOREIGN_SPECIFIC","status":"IN_FORCE","status_note":"2026 年 1 月 1 日起施行；此前的认证依据为《个人信息保护法》第三十八条第一款第二项及配套规范","published_at":"2025-10-14","effective_at":"2026-01-01","language":"zh","discovered_via":"中国网信网原文页","source_id":"SRC-CN-CAC-EXPORT-CERT-2025","source_ids":["SRC-CN-CAC-EXPORT-CERT-2025"],"complete":true,"expected_provisions":19,"meta_evidence":{"doc_number":"国家互联网信息办公室 国家市场监督管理总局 令 第20号","published_at":"2025年10月14日","effective_at":"自2026年1月1日起施行","issuer":"国家互联网信息办公室 国家市场监督管理总局"},"derived_dates":{},"generated_by":"ingest/instruments/CN-CAC-EXPORT-CERT-2025.json","provisions":[{"no":"第一条","ordinal":1,"division":"","text":"为了保护个人信息权益，规范个人信息出境认证活动，促进个人信息高效安全跨境流动，根据《中华人民共和国个人信息保护法》、《网络数据安全管理条例》、《中华人民共和国认证认可条例》等法律法规，制定本办法。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"},{"no":"第二条","ordinal":2,"division":"","text":"个人信息处理者通过个人信息保护认证的方式向中华人民共和国境外提供个人信息，适用本办法。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"},{"no":"第三条","ordinal":3,"division":"","text":"本办法所称个人信息出境认证，是指按照《中华人民共和国个人信息保护法》第三十八条第一款第二项规定，由依法取得个人信息保护认证资质的专业认证机构，证明个人信息处理者向中华人民共和国境外提供个人信息等个人信息处理活动符合相关法律、行政法规、部门规章、标准、技术规范的合格评定活动。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"},{"no":"第四条","ordinal":4,"division":"","text":"国家网信部门会同国家数据管理部门和其他有关部门制定个人信息出境认证相关标准、技术规范。国家市场监督管理部门会同国家网信部门制定个人信息保护认证规则、统一认证证书及标志。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"},{"no":"第五条","ordinal":5,"division":"","text":"个人信息处理者通过个人信息出境认证的方式向境外提供个人信息的，应当同时符合下列情形：\n（一）非关键信息基础设施运营者；\n（二）自当年1月1日起累计向境外提供10万人以上、不满100万人个人信息（不含敏感个人信息）或者不满1万人敏感个人信息。\n前款所称向境外提供的个人信息，不包括重要数据。\n法律、行政法规或者国家网信部门另有规定的，从其规定。\n个人信息处理者不得采取数量拆分等手段，将依法应当通过出境安全评估的个人信息通过个人信息出境认证的方式向境外提供。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"},{"no":"第六条","ordinal":6,"division":"","text":"个人信息处理者在申请认证向境外提供个人信息前，应当按照法律、行政法规的规定履行告知、取得个人单独同意、进行个人信息保护影响评估等义务。个人信息保护影响评估重点评估以下内容：\n（一）个人信息处理者和境外接收方处理个人信息的目的、范围、方式等的合法性、正当性、必要性；\n（二）出境个人信息的规模、范围、种类、敏感程度，个人信息出境可能对国家安全、公共利益、个人信息权益带来的风险；\n（三）境外接收方承诺承担的义务，以及履行义务的管理和技术措施、能力等能否保障出境个人信息的安全；\n（四）个人信息出境后遭到篡改、破坏、泄露、丢失、非法利用等的风险，个人信息权益维护的渠道是否通畅等；\n（五）境外接收方所在国家或者地区的个人信息保护政策和法规对出境个人信息安全和个人信息权益的影响；\n（六）其他可能影响个人信息出境安全的事项。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"},{"no":"第七条","ordinal":7,"division":"","text":"个人信息处理者通过认证方式向境外提供个人信息的，应当向专业认证机构申请个人信息出境认证。\n中华人民共和国境外的个人信息处理者申请个人信息出境认证的，应当由其在境内设立的专门机构或者指定代表协助进行申请。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"},{"no":"第八条","ordinal":8,"division":"","text":"专业认证机构应当按照认证基本规范、个人信息保护认证规则开展个人信息出境认证活动。符合认证要求的，专业认证机构应当及时出具认证证书。\n认证证书的有效期为3年。证书到期需继续使用的，个人信息处理者应当在有效期届满前6个月提出认证申请。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"},{"no":"第九条","ordinal":9,"division":"","text":"专业认证机构应当在出具认证证书或者认证证书状态发生变化后5个工作日内，向全国认证认可信息公共服务平台报送个人信息出境认证证书相关信息，包括认证证书编号、获证个人信息处理者名称、认证范围以及证书状态变化信息等。\n国家市场监督管理部门与国家网信部门建立认证信息共享机制。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"},{"no":"第十条","ordinal":10,"division":"","text":"专业认证机构发现获证个人信息处理者存在个人信息出境情况与认证范围不一致等情形，不再符合认证要求的，应当暂停其使用直至撤销相关认证证书。\n国家网信部门和有关部门在个人信息保护监督管理工作中发现获证个人信息处理者存在前款情形的，专业认证机构应当配合暂停其使用直至撤销相关认证证书。\n前两款规定的情形，应当通过全国认证认可信息公共服务平台予以公布。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"},{"no":"第十一条","ordinal":11,"division":"","text":"专业认证机构在开展认证活动中，发现个人信息出境活动违反法律、行政法规和国家有关规定的，应当及时向国家网信部门和有关部门报告。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"},{"no":"第十二条","ordinal":12,"division":"","text":"开展个人信息出境认证的专业认证机构应当自国家市场监督管理部门批准取得个人信息保护认证资质之日起10个工作日内向国家网信部门办理备案手续。办理备案时，应当提交下列材料：\n（一）取得的个人信息保护领域的认证资质情况；\n（二）近3年从事数据安全、个人信息保护领域专业工作情况；\n（三）专业认证机构人员安全背景审查材料；\n（四）个人信息保护认证实施细则及工作计划；\n（五）个人信息安全风险防范机制；\n（六）对获证个人信息处理者进行的个人信息出境活动符合认证标准情况的持续监督机制；\n（七）投诉受理和争议解决机制；\n（八）其他需要提交的材料。\n专业认证机构应当对所备案材料的真实性负责。\n国家网信部门收到专业认证机构提交的备案材料后，会同国家数据管理部门对备案材料进行审核。材料齐全的，应当在30个工作日内予以备案并进行公示；材料不齐全的，不予备案，应当在30个工作日内通知专业认证机构并说明理由。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"},{"no":"第十三条","ordinal":13,"division":"","text":"国家市场监督管理部门和国家网信部门对个人信息出境认证活动进行监督，开展定期或者不定期的检查，对认证过程和认证结果进行抽查，对专业认证机构进行抽查和评价。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"},{"no":"第十四条","ordinal":14,"division":"","text":"国家机关、专业认证机构等从事认证活动的机构及其工作人员对在履行职责中知悉的个人隐私、个人信息、商业秘密、保密商务信息等应当依法予以保密，不得泄露或者非法向他人提供、非法使用。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"},{"no":"第十五条","ordinal":15,"division":"","text":"任何组织和个人发现获证个人信息处理者违反本办法规定向境外提供个人信息的，可以向专业认证机构、网信部门和有关部门投诉、举报。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"},{"no":"第十六条","ordinal":16,"division":"","text":"省级以上网信部门和有关部门发现获证个人信息处理者个人信息出境活动存在较大风险或者发生个人信息安全事件的，可以依法对获证个人信息处理者进行约谈。获证个人信息处理者应当按照要求整改，消除隐患。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"},{"no":"第十七条","ordinal":17,"division":"","text":"违反本办法规定的，依据《中华人民共和国个人信息保护法》、《网络数据安全管理条例》、《中华人民共和国认证认可条例》等法律法规处理；构成犯罪的，依法追究刑事责任。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"},{"no":"第十八条","ordinal":18,"division":"","text":"本办法施行前制定的关于个人信息出境认证的相关规定与本办法不一致的，按照本办法执行。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"},{"no":"第十九条","ordinal":19,"division":"","text":"本办法自2026年1月1日起施行。","source_id":"SRC-CN-CAC-EXPORT-CERT-2025"}],"amended_by":[],"verification":"VERIFIED","evidence_grade":"A"},{"id":"CN-CAC-GENAI-2023","jurisdiction":"CN","title":"生成式人工智能服务管理暂行办法","short_title":"生成式 AI 办法","issuer":"国家互联网信息办公室、国家发展和改革委员会、教育部、科学技术部、工业和信息化部、公安部、国家广播电视总局","doc_number":"国家互联网信息办公室 中华人民共和国国家发展和改革委员会 中华人民共和国教育部 中华人民共和国科学技术部 中华人民共和国工业和信息化部 中华人民共和国公安部 国家广播电视总局 令 第15号","level":"部门规章","instrument_type":"AI_SPECIFIC","status":"IN_FORCE","status_note":"施行日期见原文；后续修订未专门核查","published_at":"2023-07-10","effective_at":"2023-08-15","language":"zh","discovered_via":"AGORA 1137（英译本线索）；原文取自中国网信网","foreign_related":"DOMESTIC","source_id":"SRC-CN-CAC-GENAI-2023","source_ids":["SRC-CN-CAC-GENAI-2023"],"complete":true,"expected_provisions":24,"meta_evidence":{"doc_number":"国家互联网信息办公室 中华人民共和国国家发展和改革委员会 中华人民共和国教育部 中华人民共和国科学技术部 中华人民共和国工业和信息化部 中华人民共和国公安部 国家广播电视总局 令 第15号","published_at":"2023年7月10日","effective_at":"自2023年8月15日起施行","issuer":"已经2023年5月23日国家互联网信息办公室2023年第12次室务会会议审议通过，并经国家发展和改革委员会、教育部、科学技术部、工业和信息化部、公安部、国家广播电视总局同意"},"derived_dates":{},"generated_by":"ingest/instruments/CN-CAC-GENAI-2023.json","provisions":[{"no":"第一条","ordinal":1,"division":"第一章 总 则","text":"为了促进生成式人工智能健康发展和规范应用，维护国家安全和社会公共利益，保护公民、法人和其他组织的合法权益，根据《中华人民共和国网络安全法》、《中华人民共和国数据安全法》、《中华人民共和国个人信息保护法》、《中华人民共和国科学技术进步法》等法律、行政法规，制定本办法。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第二条","ordinal":2,"division":"第一章 总 则","text":"利用生成式人工智能技术向中华人民共和国境内公众提供生成文本、图片、音频、视频等内容的服务（以下称生成式人工智能服务），适用本办法。\n国家对利用生成式人工智能服务从事新闻出版、影视制作、文艺创作等活动另有规定的，从其规定。\n行业组织、企业、教育和科研机构、公共文化机构、有关专业机构等研发、应用生成式人工智能技术，未向境内公众提供生成式人工智能服务的，不适用本办法的规定。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第三条","ordinal":3,"division":"第一章 总 则","text":"国家坚持发展和安全并重、促进创新和依法治理相结合的原则，采取有效措施鼓励生成式人工智能创新发展，对生成式人工智能服务实行包容审慎和分类分级监管。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第四条","ordinal":4,"division":"第一章 总 则","text":"提供和使用生成式人工智能服务，应当遵守法律、行政法规，尊重社会公德和伦理道德，遵守以下规定：\n（一）坚持社会主义核心价值观，不得生成煽动颠覆国家政权、推翻社会主义制度，危害国家安全和利益、损害国家形象，煽动分裂国家、破坏国家统一和社会稳定，宣扬恐怖主义、极端主义，宣扬民族仇恨、民族歧视，暴力、淫秽色情，以及虚假有害信息等法律、行政法规禁止的内容；\n（二）在算法设计、训练数据选择、模型生成和优化、提供服务等过程中，采取有效措施防止产生民族、信仰、国别、地域、性别、年龄、职业、健康等歧视；\n（三）尊重知识产权、商业道德，保守商业秘密，不得利用算法、数据、平台等优势，实施垄断和不正当竞争行为；\n（四）尊重他人合法权益，不得危害他人身心健康，不得侵害他人肖像权、名誉权、荣誉权、隐私权和个人信息权益；\n（五）基于服务类型特点，采取有效措施，提升生成式人工智能服务的透明度，提高生成内容的准确性和可靠性。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第五条","ordinal":5,"division":"第二章 技术发展与治理","text":"鼓励生成式人工智能技术在各行业、各领域的创新应用，生成积极健康、向上向善的优质内容，探索优化应用场景，构建应用生态体系。\n支持行业组织、企业、教育和科研机构、公共文化机构、有关专业机构等在生成式人工智能技术创新、数据资源建设、转化应用、风险防范等方面开展协作。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第六条","ordinal":6,"division":"第二章 技术发展与治理","text":"鼓励生成式人工智能算法、框架、芯片及配套软件平台等基础技术的自主创新，平等互利开展国际交流与合作，参与生成式人工智能相关国际规则制定。\n推动生成式人工智能基础设施和公共训练数据资源平台建设。促进算力资源协同共享，提升算力资源利用效能。推动公共数据分类分级有序开放，扩展高质量的公共训练数据资源。鼓励采用安全可信的芯片、软件、工具、算力和数据资源。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第七条","ordinal":7,"division":"第二章 技术发展与治理","text":"生成式人工智能服务提供者（以下称提供者）应当依法开展预训练、优化训练等训练数据处理活动，遵守以下规定：\n（一）使用具有合法来源的数据和基础模型；\n（二）涉及知识产权的，不得侵害他人依法享有的知识产权；\n（三）涉及个人信息的，应当取得个人同意或者符合法律、行政法规规定的其他情形；\n（四）采取有效措施提高训练数据质量，增强训练数据的真实性、准确性、客观性、多样性；\n（五）《中华人民共和国网络安全法》、《中华人民共和国数据安全法》、《中华人民共和国个人信息保护法》等法律、行政法规的其他有关规定和有关主管部门的相关监管要求。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第八条","ordinal":8,"division":"第二章 技术发展与治理","text":"在生成式人工智能技术研发过程中进行数据标注的，提供者应当制定符合本办法要求的清晰、具体、可操作的标注规则；开展数据标注质量评估，抽样核验标注内容的准确性；对标注人员进行必要培训，提升尊法守法意识，监督指导标注人员规范开展标注工作。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第九条","ordinal":9,"division":"第三章 服务规范","text":"提供者应当依法承担网络信息内容生产者责任，履行网络信息安全义务。涉及个人信息的，依法承担个人信息处理者责任，履行个人信息保护义务。\n提供者应当与注册其服务的生成式人工智能服务使用者（以下称使用者）签订服务协议，明确双方权利义务。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第十条","ordinal":10,"division":"第三章 服务规范","text":"提供者应当明确并公开其服务的适用人群、场合、用途，指导使用者科学理性认识和依法使用生成式人工智能技术，采取有效措施防范未成年人用户过度依赖或者沉迷生成式人工智能服务。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第十一条","ordinal":11,"division":"第三章 服务规范","text":"提供者对使用者的输入信息和使用记录应当依法履行保护义务，不得收集非必要个人信息，不得非法留存能够识别使用者身份的输入信息和使用记录，不得非法向他人提供使用者的输入信息和使用记录。\n提供者应当依法及时受理和处理个人关于查阅、复制、更正、补充、删除其个人信息等的请求。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第十二条","ordinal":12,"division":"第三章 服务规范","text":"提供者应当按照《互联网信息服务深度合成管理规定》对图片、视频等生成内容进行标识。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第十三条","ordinal":13,"division":"第三章 服务规范","text":"提供者应当在其服务过程中，提供安全、稳定、持续的服务，保障用户正常使用。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第十四条","ordinal":14,"division":"第三章 服务规范","text":"提供者发现违法内容的，应当及时采取停止生成、停止传输、消除等处置措施，采取模型优化训练等措施进行整改，并向有关主管部门报告。\n提供者发现使用者利用生成式人工智能服务从事违法活动的，应当依法依约采取警示、限制功能、暂停或者终止向其提供服务等处置措施，保存有关记录，并向有关主管部门报告。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第十五条","ordinal":15,"division":"第三章 服务规范","text":"提供者应当建立健全投诉、举报机制，设置便捷的投诉、举报入口，公布处理流程和反馈时限，及时受理、处理公众投诉举报并反馈处理结果。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第十六条","ordinal":16,"division":"第四章 监督检查和法律责任","text":"网信、发展改革、教育、科技、工业和信息化、公安、广播电视、新闻出版等部门，依据各自职责依法加强对生成式人工智能服务的管理。\n国家有关主管部门针对生成式人工智能技术特点及其在有关行业和领域的服务应用，完善与创新发展相适应的科学监管方式，制定相应的分类分级监管规则或者指引。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第十七条","ordinal":17,"division":"第四章 监督检查和法律责任","text":"提供具有舆论属性或者社会动员能力的生成式人工智能服务的，应当按照国家有关规定开展安全评估，并按照《互联网信息服务算法推荐管理规定》履行算法备案和变更、注销备案手续。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第十八条","ordinal":18,"division":"第四章 监督检查和法律责任","text":"使用者发现生成式人工智能服务不符合法律、行政法规和本办法规定的，有权向有关主管部门投诉、举报。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第十九条","ordinal":19,"division":"第四章 监督检查和法律责任","text":"有关主管部门依据职责对生成式人工智能服务开展监督检查，提供者应当依法予以配合，按要求对训练数据来源、规模、类型、标注规则、算法机制机理等予以说明，并提供必要的技术、数据等支持和协助。\n参与生成式人工智能服务安全评估和监督检查的相关机构和人员对在履行职责中知悉的国家秘密、商业秘密、个人隐私和个人信息应当依法予以保密，不得泄露或者非法向他人提供。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第二十条","ordinal":20,"division":"第四章 监督检查和法律责任","text":"对来源于中华人民共和国境外向境内提供生成式人工智能服务不符合法律、行政法规和本办法规定的，国家网信部门应当通知有关机构采取技术措施和其他必要措施予以处置。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第二十一条","ordinal":21,"division":"第四章 监督检查和法律责任","text":"提供者违反本办法规定的，由有关主管部门依照《中华人民共和国网络安全法》、《中华人民共和国数据安全法》、《中华人民共和国个人信息保护法》、《中华人民共和国科学技术进步法》等法律、行政法规的规定予以处罚；法律、行政法规没有规定的，由有关主管部门依据职责予以警告、通报批评，责令限期改正；拒不改正或者情节严重的，责令暂停提供相关服务。\n构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第二十二条","ordinal":22,"division":"第五章 附 则","text":"本办法下列用语的含义是：\n（一）生成式人工智能技术，是指具有文本、图片、音频、视频等内容生成能力的模型及相关技术。\n（二）生成式人工智能服务提供者，是指利用生成式人工智能技术提供生成式人工智能服务（包括通过提供可编程接口等方式提供生成式人工智能服务）的组织、个人。\n（三）生成式人工智能服务使用者，是指使用生成式人工智能服务生成内容的组织、个人。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第二十三条","ordinal":23,"division":"第五章 附 则","text":"法律、行政法规规定提供生成式人工智能服务应当取得相关行政许可的，提供者应当依法取得许可。\n外商投资生成式人工智能服务，应当符合外商投资相关法律、行政法规的规定。","source_id":"SRC-CN-CAC-GENAI-2023"},{"no":"第二十四条","ordinal":24,"division":"第五章 附 则","text":"本办法自2023年8月15日起施行。","source_id":"SRC-CN-CAC-GENAI-2023"}],"amended_by":[],"verification":"VERIFIED","evidence_grade":"A"},{"id":"CN-CAC-LABEL-2025","jurisdiction":"CN","title":"人工智能生成合成内容标识办法","short_title":"标识办法","issuer":"国家互联网信息办公室、工业和信息化部、公安部、国家广播电视总局","doc_number":"国信办通字〔2025〕2号","level":"规范性文件","instrument_type":"AI_SPECIFIC","status":"IN_FORCE","status_note":"施行日期见原文；后续修订未专门核查","published_at":"2025-03-07","effective_at":"2025-09-01","language":"zh","discovered_via":"AGORA 2096（英译本线索）；原文取自中国网信网","foreign_related":"DOMESTIC","source_id":"SRC-CN-CAC-LABEL-2025","source_ids":["SRC-CN-CAC-LABEL-2025"],"complete":true,"expected_provisions":14,"meta_evidence":{"doc_number":"国信办通字〔2025〕2号","published_at":"2025年3月7日","effective_at":"自2025年9月1日起施行","issuer":"国家互联网信息办公室、工业和信息化部、公安部、国家广播电视总局制定了《人工智能生成合成内容标识办法》"},"derived_dates":{},"generated_by":"ingest/instruments/CN-CAC-LABEL-2025.json","provisions":[{"no":"第一条","ordinal":1,"division":"","text":"为了促进人工智能健康发展，规范人工智能生成合成内容标识，保护公民、法人和其他组织合法权益，维护社会公共利益，根据《中华人民共和国网络安全法》、《互联网信息服务算法推荐管理规定》、《互联网信息服务深度合成管理规定》、《生成式人工智能服务管理暂行办法》等法律、行政法规和部门规章，制定本办法。","source_id":"SRC-CN-CAC-LABEL-2025"},{"no":"第二条","ordinal":2,"division":"","text":"符合《互联网信息服务算法推荐管理规定》、《互联网信息服务深度合成管理规定》、《生成式人工智能服务管理暂行办法》规定情形的网络信息服务提供者（以下简称“服务提供者”）开展人工智能生成合成内容标识活动，适用本办法。","source_id":"SRC-CN-CAC-LABEL-2025"},{"no":"第三条","ordinal":3,"division":"","text":"人工智能生成合成内容是指利用人工智能技术生成、合成的文本、图片、音频、视频、虚拟场景等信息。\n人工智能生成合成内容标识包括显式标识和隐式标识。\n显式标识是指在生成合成内容或者交互场景界面中添加的，以文字、声音、图形等方式呈现并可以被用户明显感知到的标识。\n隐式标识是指采取技术措施在生成合成内容文件数据中添加的，不易被用户明显感知到的标识。","source_id":"SRC-CN-CAC-LABEL-2025"},{"no":"第四条","ordinal":4,"division":"","text":"服务提供者提供的生成合成服务属于《互联网信息服务深度合成管理规定》第十七条第一款情形的，应当按照下列要求对生成合成内容添加显式标识：\n（一）在文本的起始、末尾或者中间适当位置添加文字提示或者通用符号提示等标识，或者在交互场景界面、文字周边添加显著的提示标识；\n（二）在音频的起始、末尾或者中间适当位置添加语音提示或者音频节奏提示等标识，或者在交互场景界面中添加显著的提示标识；\n（三）在图片的适当位置添加显著的提示标识；\n（四）在视频起始画面和视频播放周边的适当位置添加显著的提示标识，可以在视频末尾和中间适当位置添加显著的提示标识；\n（五）呈现虚拟场景时，在起始画面的适当位置添加显著的提示标识，可以在虚拟场景持续服务过程中的适当位置添加显著的提示标识；\n（六）其他生成合成服务场景根据自身应用特点添加显著的提示标识。\n服务提供者提供生成合成内容下载、复制、导出等功能时，应当确保文件中含有满足要求的显式标识。","source_id":"SRC-CN-CAC-LABEL-2025"},{"no":"第五条","ordinal":5,"division":"","text":"服务提供者应当按照《互联网信息服务深度合成管理规定》第十六条的规定，在生成合成内容的文件元数据中添加隐式标识，隐式标识包含生成合成内容属性信息、服务提供者名称或者编码、内容编号等制作要素信息。\n鼓励服务提供者在生成合成内容中添加数字水印等形式的隐式标识。\n文件元数据是指按照特定编码格式嵌入到文件头部的描述性信息，用于记录文件来源、属性、用途等信息内容。","source_id":"SRC-CN-CAC-LABEL-2025"},{"no":"第六条","ordinal":6,"division":"","text":"提供网络信息内容传播服务的服务提供者应当采取下列措施，规范生成合成内容传播活动：\n（一）核验文件元数据中是否含有隐式标识，文件元数据明确标明为生成合成内容的，采取适当方式在发布内容周边添加显著的提示标识，明确提醒公众该内容属于生成合成内容；\n（二）文件元数据中未核验到隐式标识，但用户声明为生成合成内容的，采取适当方式在发布内容周边添加显著的提示标识，提醒公众该内容可能为生成合成内容；\n（三）文件元数据中未核验到隐式标识，用户也未声明为生成合成内容，但提供网络信息内容传播服务的服务提供者检测到显式标识或者其他生成合成痕迹的，识别为疑似生成合成内容，采取适当方式在发布内容周边添加显著的提示标识，提醒公众该内容疑似生成合成内容；\n（四）提供必要的标识功能，并提醒用户主动声明发布内容中是否包含生成合成内容。\n有前款第一项至第三项情形的，应当在文件元数据中添加生成合成内容属性信息、传播平台名称或者编码、内容编号等传播要素信息。","source_id":"SRC-CN-CAC-LABEL-2025"},{"no":"第七条","ordinal":7,"division":"","text":"互联网应用程序分发平台在应用程序上架或者上线审核时，应当要求互联网应用程序服务提供者说明是否提供人工智能生成合成服务。互联网应用程序服务提供者提供人工智能生成合成服务的，互联网应用程序分发平台应当核验其生成合成内容标识相关材料。","source_id":"SRC-CN-CAC-LABEL-2025"},{"no":"第八条","ordinal":8,"division":"","text":"服务提供者应当在用户服务协议中明确说明生成合成内容标识的方法、样式等规范内容，并提示用户仔细阅读并理解相关的标识管理要求。","source_id":"SRC-CN-CAC-LABEL-2025"},{"no":"第九条","ordinal":9,"division":"","text":"用户申请服务提供者提供没有添加显式标识的生成合成内容的，服务提供者可以在通过用户协议明确用户的标识义务和使用责任后，提供不含显式标识的生成合成内容，并依法留存提供对象信息等相关日志不少于六个月。","source_id":"SRC-CN-CAC-LABEL-2025"},{"no":"第十条","ordinal":10,"division":"","text":"用户使用网络信息内容传播服务发布生成合成内容的，应当主动声明并使用服务提供者提供的标识功能进行标识。\n任何组织和个人不得恶意删除、篡改、伪造、隐匿本办法规定的生成合成内容标识，不得为他人实施上述恶意行为提供工具或者服务，不得通过不正当标识手段损害他人合法权益。","source_id":"SRC-CN-CAC-LABEL-2025"},{"no":"第十一条","ordinal":11,"division":"","text":"服务提供者开展标识活动的，还应当符合相关法律、行政法规、部门规章和强制性国家标准的要求。","source_id":"SRC-CN-CAC-LABEL-2025"},{"no":"第十二条","ordinal":12,"division":"","text":"服务提供者在履行算法备案、安全评估等手续时，应当按照本办法提供生成合成内容标识相关材料，并加强标识信息共享，为防范打击相关违法犯罪活动提供支持和帮助。","source_id":"SRC-CN-CAC-LABEL-2025"},{"no":"第十三条","ordinal":13,"division":"","text":"违反本办法规定的，由网信、电信、公安和广播电视等有关主管部门依据职责，按照有关法律、行政法规、部门规章的规定予以处理。","source_id":"SRC-CN-CAC-LABEL-2025"},{"no":"第十四条","ordinal":14,"division":"","text":"本办法自2025年9月1日起施行。","source_id":"SRC-CN-CAC-LABEL-2025"}],"amended_by":[],"verification":"VERIFIED","evidence_grade":"A"},{"id":"CN-CIVIL-CODE","jurisdiction":"CN","title":"中华人民共和国民法典","short_title":"民法典","issuer":"全国人民代表大会","doc_number":null,"level":"法律","instrument_type":"GENERAL_LAW_CITED","status":"IN_FORCE","status_note":"只收库内案例所涉条文（总则编 2 条、人格权编 9 条、侵权责任编 7 条）；快照为中国网信网转载的新华社稿分页，不是制定机关发布页；日期为表决通过日","published_at":"2020-05-28","effective_at":"2021-01-01","language":"zh","discovered_via":"最高法网络法治典型案例的引用；北京互联网法院（2023）京0491民初12142号、（2024）京0491民初10085号等判决书的裁判依据","foreign_related":"FOREIGN_CLAUSE","source_id":"SRC-CN-CAC-CIVILCODE-1","source_ids":["SRC-CN-CAC-CIVILCODE-1","SRC-CN-CAC-CIVILCODE-4","SRC-CN-CAC-CIVILCODE-7"],"complete":false,"expected_provisions":null,"meta_evidence":{"issuer":"（2020年5月28日第十三届全国人民代表大会第三次会议通过）","published_at":"（2020年5月28日第十三届全国人民代表大会第三次会议通过）","effective_at":"本法自2021年1月1日起施行"},"derived_dates":{},"generated_by":"ingest/instruments/CN-CIVIL-CODE.json","provisions":[{"no":"第一百七十八条","ordinal":178,"division":"第八章 民事责任","text":"二人以上依法承担连带责任的，权利人有权请求部分或者全部连带责任人承担责任。\n连带责任人的责任份额根据各自责任大小确定；难以确定责任大小的，平均承担责任。实际承担责任超过自己责任份额的连带责任人，有权向其他连带责任人追偿。\n连带责任，由法律规定或者当事人约定。","source_id":"SRC-CN-CAC-CIVILCODE-1"},{"no":"第一百七十九条","ordinal":179,"division":"第八章 民事责任","text":"承担民事责任的方式主要有：\n（一）停止侵害；\n（二）排除妨碍；\n（三）消除危险；\n（四）返还财产；\n（五）恢复原状；\n（六）修理、重作、更换；\n（七）继续履行；\n（八）赔偿损失；\n（九）支付违约金；\n（十）消除影响、恢复名誉；\n（十一）赔礼道歉。\n法律规定惩罚性赔偿的，依照其规定。\n本条规定的承担民事责任的方式，可以单独适用，也可以合并适用。","source_id":"SRC-CN-CAC-CIVILCODE-1"},{"no":"第九百九十条","ordinal":990,"division":"第一章 一般规定","text":"人格权是民事主体享有的生命权、身体权、健康权、姓名权、名称权、肖像权、名誉权、荣誉权、隐私权等权利。\n除前款规定的人格权外，自然人享有基于人身自由、人格尊严产生的其他人格权益。","source_id":"SRC-CN-CAC-CIVILCODE-4"},{"no":"第九百九十五条","ordinal":995,"division":"第一章 一般规定","text":"人格权受到侵害的，受害人有权依照本法和其他法律的规定请求行为人承担民事责任。受害人的停止侵害、排除妨碍、消除危险、消除影响、恢复名誉、赔礼道歉请求权，不适用诉讼时效的规定。","source_id":"SRC-CN-CAC-CIVILCODE-4"},{"no":"第九百九十八条","ordinal":998,"division":"第一章 一般规定","text":"认定行为人承担侵害除生命权、身体权和健康权外的人格权的民事责任，应当考虑行为人和受害人的职业、影响范围、过错程度，以及行为的目的、方式、后果等因素。","source_id":"SRC-CN-CAC-CIVILCODE-4"},{"no":"第一千条","ordinal":1000,"division":"第一章 一般规定","text":"行为人因侵害人格权承担消除影响、恢复名誉、赔礼道歉等民事责任的，应当与行为的具体方式和造成的影响范围相当。\n行为人拒不承担前款规定的民事责任的，人民法院可以采取在报刊、网络等媒体上发布公告或者公布生效裁判文书等方式执行，产生的费用由行为人负担。","source_id":"SRC-CN-CAC-CIVILCODE-4"},{"no":"第一千零一十二条","ordinal":1012,"division":"第三章 姓名权和名称权","text":"自然人享有姓名权，有权依法决定、使用、变更或者许可他人使用自己的姓名，但是不得违背公序良俗。","source_id":"SRC-CN-CAC-CIVILCODE-4"},{"no":"第一千零一十八条","ordinal":1018,"division":"第四章 肖像权","text":"自然人享有肖像权，有权依法制作、使用、公开或者许可他人使用自己的肖像。\n肖像是通过影像、雕塑、绘画等方式在一定载体上所反映的特定自然人可以被识别的外部形象。","source_id":"SRC-CN-CAC-CIVILCODE-4"},{"no":"第一千零一十九条","ordinal":1019,"division":"第四章 肖像权","text":"任何组织或者个人不得以丑化、污损，或者利用信息技术手段伪造等方式侵害他人的肖像权。未经肖像权人同意，不得制作、使用、公开肖像权人的肖像，但是法律另有规定的除外。\n未经肖像权人同意，肖像作品权利人不得以发表、复制、发行、出租、展览等方式使用或者公开肖像权人的肖像。","source_id":"SRC-CN-CAC-CIVILCODE-4"},{"no":"第一千零二十三条","ordinal":1023,"division":"第四章 肖像权","text":"对姓名等的许可使用，参照适用肖像许可使用的有关规定。\n对自然人声音的保护，参照适用肖像权保护的有关规定。","source_id":"SRC-CN-CAC-CIVILCODE-4"},{"no":"第一千零二十四条","ordinal":1024,"division":"第五章 名誉权和荣誉权","text":"民事主体享有名誉权。任何组织或者个人不得以侮辱、诽谤等方式侵害他人的名誉权。\n名誉是对民事主体的品德、声望、才能、信用等的社会评价。","source_id":"SRC-CN-CAC-CIVILCODE-4"},{"no":"第一千一百六十五条","ordinal":1165,"division":"第一章 一般规定","text":"行为人因过错侵害他人民事权益造成损害的，应当承担侵权责任。\n依照法律规定推定行为人有过错，其不能证明自己没有过错的，应当承担侵权责任。","source_id":"SRC-CN-CAC-CIVILCODE-7"},{"no":"第一千一百六十八条","ordinal":1168,"division":"第一章 一般规定","text":"二人以上共同实施侵权行为，造成他人损害的，应当承担连带责任。","source_id":"SRC-CN-CAC-CIVILCODE-7"},{"no":"第一千一百八十二条","ordinal":1182,"division":"第二章 损害赔偿","text":"侵害他人人身权益造成财产损失的，按照被侵权人因此受到的损失或者侵权人因此获得的利益赔偿；被侵权人因此受到的损失以及侵权人因此获得的利益难以确定，被侵权人和侵权人就赔偿数额协商不一致，向人民法院提起诉讼的，由人民法院根据实际情况确定赔偿数额。","source_id":"SRC-CN-CAC-CIVILCODE-7"},{"no":"第一千一百八十三条","ordinal":1183,"division":"第二章 损害赔偿","text":"侵害自然人人身权益造成严重精神损害的，被侵权人有权请求精神损害赔偿。\n因故意或者重大过失侵害自然人具有人身意义的特定物造成严重精神损害的，被侵权人有权请求精神损害赔偿。","source_id":"SRC-CN-CAC-CIVILCODE-7"},{"no":"第一千一百九十四条","ordinal":1194,"division":"第三章 责任主体的特殊规定","text":"网络用户、网络服务提供者利用网络侵害他人民事权益的，应当承担侵权责任。法律另有规定的，依照其规定。","source_id":"SRC-CN-CAC-CIVILCODE-7"},{"no":"第一千一百九十五条","ordinal":1195,"division":"第三章 责任主体的特殊规定","text":"网络用户利用网络服务实施侵权行为的，权利人有权通知网络服务提供者采取删除、屏蔽、断开链接等必要措施。通知应当包括构成侵权的初步证据及权利人的真实身份信息。\n网络服务提供者接到通知后，应当及时将该通知转送相关网络用户，并根据构成侵权的初步证据和服务类型采取必要措施；未及时采取必要措施的，对损害的扩大部分与该网络用户承担连带责任。\n权利人因错误通知造成网络用户或者网络服务提供者损害的，应当承担侵权责任。法律另有规定的，依照其规定。","source_id":"SRC-CN-CAC-CIVILCODE-7"},{"no":"第一千一百九十七条","ordinal":1197,"division":"第三章 责任主体的特殊规定","text":"网络服务提供者知道或者应当知道网络用户利用其网络服务侵害他人民事权益，未采取必要措施的，与该网络用户承担连带责任。","source_id":"SRC-CN-CAC-CIVILCODE-7"}],"amended_by":[],"verification":"PARSED","evidence_grade":"A"},{"id":"CN-COPYRIGHT-LAW","jurisdiction":"CN","title":"中华人民共和国著作权法","short_title":"著作权法","issuer":"全国人民代表大会常务委员会","doc_number":null,"level":"法律","instrument_type":"GENERAL_LAW_CITED","status":"ADOPTED","status_note":"2020 年第三次修正的文本；日期为修正决定通过日。只收库内案例所涉的 6 条。快照为北京市知识产权局网站转载，不是制定机关发布页；该页所标实施日期（2021-06-01）出自网站的栏目字段，不是法律正文（正文第六十七条写的是原法 1991 年施行日），故施行日期留空、不标“现行”","published_at":"2020-11-11","effective_at":null,"language":"zh","discovered_via":"北京互联网法院（2023）京0491民初11279号、上海市嘉定区人民法院（2024）沪0114民初1326号、上海市徐汇区人民法院（2025）沪0104民初2432号判决书的裁判依据","foreign_related":"DOMESTIC","source_id":"SRC-CN-BJIPO-COPYRIGHT-2020","source_ids":["SRC-CN-BJIPO-COPYRIGHT-2020"],"complete":false,"expected_provisions":null,"meta_evidence":{"title":"中华人民共和国著作权法","issuer":"根据2020年11月11日第十三届全国人民代表大会常务委员会第二十三次会议《关于修改〈中华人民共和国著作权法〉的决定》第三次修正","published_at":"根据2020年11月11日第十三届全国人民代表大会常务委员会第二十三次会议《关于修改〈中华人民共和国著作权法〉的决定》第三次修正"},"derived_dates":{},"generated_by":"ingest/instruments/CN-COPYRIGHT-LAW.json","provisions":[{"no":"第三条","ordinal":3,"division":"第一章 总则","text":"本法所称的作品，是指文学、艺术和科学领域内具有独创性并能以一定形式表现的智力成果，包括：\n（一）文字作品；\n（二）口述作品；\n（三）音乐、戏剧、曲艺、舞蹈、杂技艺术作品；\n（四）美术、建筑作品；\n（五）摄影作品；\n（六）视听作品；\n（七）工程设计图、产品设计图、地图、示意图等图形作品和模型作品；\n（八）计算机软件；\n（九）符合作品特征的其他智力成果。","source_id":"SRC-CN-BJIPO-COPYRIGHT-2020"},{"no":"第十条","ordinal":10,"division":"第二章 著作权 / 第一节 著作权人及其权利","text":"著作权包括下列人身权和财产权：\n（一）发表权，即决定作品是否公之于众的权利；\n（二）署名权，即表明作者身份，在作品上署名的权利；\n（三）修改权，即修改或者授权他人修改作品的权利；\n（四）保护作品完整权，即保护作品不受歪曲、篡改的权利；\n（五）复制权，即以印刷、复印、拓印、录音、录像、翻录、翻拍、数字化等方式将作品制作一份或者多份的权利；\n（六）发行权，即以出售或者赠与方式向公众提供作品的原件或者复制件的权利；\n（七）出租权，即有偿许可他人临时使用视听作品、计算机软件的原件或者复制件的权利，计算机软件不是出租的主要标的的除外；\n（八）展览权，即公开陈列美术作品、摄影作品的原件或者复制件的权利；\n（九）表演权，即公开表演作品，以及用各种手段公开播送作品的表演的权利；\n（十）放映权，即通过放映机、幻灯机等技术设备公开再现美术、摄影、视听作品等的权利；\n（十一）广播权，即以有线或者无线方式公开传播或者转播作品，以及通过扩音器或者其他传送符号、声音、图像的类似工具向公众传播广播的作品的权利，但不包括本款第十二项规定的权利；\n（十二）信息网络传播权，即以有线或者无线方式向公众提供，使公众可以在其选定的时间和地点获得作品的权利；\n（十三）摄制权，即以摄制视听作品的方法将作品固定在载体上的权利；\n（十四）改编权，即改变作品，创作出具有独创性的新作品的权利；\n（十五）翻译权，即将作品从一种语言文字转换成另一种语言文字的权利；\n（十六）汇编权，即将作品或者作品的片段通过选择或者编排，汇集成新作品的权利；\n（十七）应当由著作权人享有的其他权利。\n著作权人可以许可他人行使前款第五项至第十七项规定的权利，并依照约定或者本法有关规定获得报酬。\n著作权人可以全部或者部分转让本条第一款第五项至第十七项规定的权利，并依照约定或者本法有关规定获得报酬。","source_id":"SRC-CN-BJIPO-COPYRIGHT-2020"},{"no":"第十一条","ordinal":11,"division":"第二章 著作权 / 第二节 著作权归属","text":"著作权属于作者，本法另有规定的除外。\n创作作品的自然人是作者。\n由法人或者非法人组织主持，代表法人或者非法人组织意志创作，并由法人或者非法人组织承担责任的作品，法人或者非法人组织视为作者。","source_id":"SRC-CN-BJIPO-COPYRIGHT-2020"},{"no":"第十七条","ordinal":17,"division":"第二章 著作权 / 第二节 著作权归属","text":"视听作品中的电影作品、电视剧作品的著作权由制作者享有，但编剧、导演、摄影、作词、作曲等作者享有署名权，并有权按照与制作者签订的合同获得报酬。\n前款规定以外的视听作品的著作权归属由当事人约定；没有约定或者约定不明确的，由制作者享有，但作者享有署名权和获得报酬的权利。\n视听作品中的剧本、音乐等可以单独使用的作品的作者有权单独行使其著作权。","source_id":"SRC-CN-BJIPO-COPYRIGHT-2020"},{"no":"第五十三条","ordinal":53,"division":"第五章 著作权和与著作权有关的权利的保护","text":"有下列侵权行为的，应当根据情况，承担本法第五十二条规定的民事责任；侵权行为同时损害公共利益的，由主管著作权的部门责令停止侵权行为，予以警告，没收违法所得，没收、无害化销毁处理侵权复制品以及主要用于制作侵权复制品的材料、工具、设备等，违法经营额五万元以上的，可以并处违法经营额一倍以上五倍以下的罚款；没有违法经营额、违法经营额难以计算或者不足五万元的，可以并处二十五万元以下的罚款；构成犯罪的，依法追究刑事责任：\n（一）未经著作权人许可，复制、发行、表演、放映、广播、汇编、通过信息网络向公众传播其作品的，本法另有规定的除外；\n（二）出版他人享有专有出版权的图书的；\n（三）未经表演者许可，复制、发行录有其表演的录音录像制品，或者通过信息网络向公众传播其表演的，本法另有规定的除外；\n（四）未经录音录像制作者许可，复制、发行、通过信息网络向公众传播其制作的录音录像制品的，本法另有规定的除外；\n（五）未经许可，播放、复制或者通过信息网络向公众传播广播、电视的，本法另有规定的除外；\n（六）未经著作权人或者与著作权有关的权利人许可，故意避开或者破坏技术措施的，故意制造、进口或者向他人提供主要用于避开、破坏技术措施的装置或者部件的，或者故意为他人避开或者破坏技术措施提供技术服务的，法律、行政法规另有规定的除外；\n（七）未经著作权人或者与著作权有关的权利人许可，故意删除或者改变作品、版式设计、表演、录音录像制品或者广播、电视上的权利管理信息的，知道或者应当知道作品、版式设计、表演、录音录像制品或者广播、电视上的权利管理信息未经许可被删除或者改变，仍然向公众提供的，法律、行政法规另有规定的除外；\n（八）制作、出售假冒他人署名的作品的。","source_id":"SRC-CN-BJIPO-COPYRIGHT-2020"},{"no":"第五十四条","ordinal":54,"division":"第五章 著作权和与著作权有关的权利的保护","text":"侵犯著作权或者与著作权有关的权利的，侵权人应当按照权利人因此受到的实际损失或者侵权人的违法所得给予赔偿；权利人的实际损失或者侵权人的违法所得难以计算的，可以参照该权利使用费给予赔偿。对故意侵犯著作权或者与著作权有关的权利，情节严重的，可以在按照上述方法确定数额的一倍以上五倍以下给予赔偿。\n权利人的实际损失、侵权人的违法所得、权利使用费难以计算的，由人民法院根据侵权行为的情节，判决给予五百元以上五百万元以下的赔偿。\n赔偿数额还应当包括权利人为制止侵权行为所支付的合理开支。\n人民法院为确定赔偿数额，在权利人已经尽了必要举证责任，而与侵权行为相关的账簿、资料等主要由侵权人掌握的，可以责令侵权人提供与侵权行为相关的账簿、资料等；侵权人不提供，或者提供虚假的账簿、资料等的，人民法院可以参考权利人的主张和提供的证据确定赔偿数额。\n人民法院审理著作权纠纷案件，应权利人请求，对侵权复制品，除特殊情况外，责令销毁；对主要用于制造侵权复制品的材料、工具、设备等，责令销毁，且不予补偿；或者在特殊情况下，责令禁止前述材料、工具、设备等进入商业渠道，且不予补偿。","source_id":"SRC-CN-BJIPO-COPYRIGHT-2020"}],"amended_by":[],"verification":"PARSED","evidence_grade":"A"},{"id":"CN-PIPL-2021","jurisdiction":"CN","title":"中华人民共和国个人信息保护法","short_title":"个人信息保护法","issuer":"全国人民代表大会常务委员会","doc_number":null,"level":"法律","instrument_type":"GENERAL_LAW_CITED","status":"IN_FORCE","status_note":"只收库内案例所涉的 6 条；快照为中国网信网转载的中国人大网稿，不是制定机关发布页；日期为表决通过日","published_at":"2021-08-20","effective_at":"2021-11-01","language":"zh","discovered_via":"北京互联网法院（2023）京0491民初3820号、（2024）京0491民初21163号判决书的裁判依据","foreign_related":"FOREIGN_CLAUSE","source_id":"SRC-CN-CAC-PIPL-2021","source_ids":["SRC-CN-CAC-PIPL-2021"],"complete":false,"expected_provisions":null,"meta_evidence":{"title":"中华人民共和国个人信息保护法","issuer":"（2021年8月20日第十三届全国人民代表大会常务委员会第三十次会议通过）","published_at":"（2021年8月20日第十三届全国人民代表大会常务委员会第三十次会议通过）","effective_at":"本法自2021年11月1日起施行"},"derived_dates":{},"generated_by":"ingest/instruments/CN-PIPL-2021.json","provisions":[{"no":"第二条","ordinal":2,"division":"第一章 总 则","text":"自然人的个人信息受法律保护，任何组织、个人不得侵害自然人的个人信息权益。","source_id":"SRC-CN-CAC-PIPL-2021"},{"no":"第四条","ordinal":4,"division":"第一章 总 则","text":"个人信息是以电子或者其他方式记录的与已识别或者可识别的自然人有关的各种信息，不包括匿名化处理后的信息。\n个人信息的处理包括个人信息的收集、存储、使用、加工、传输、提供、公开、删除等。","source_id":"SRC-CN-CAC-PIPL-2021"},{"no":"第二十七条","ordinal":27,"division":"第二章 个人信息处理规则 / 第一节 一般规定","text":"个人信息处理者可以在合理的范围内处理个人自行公开或者其他已经合法公开的个人信息；个人明确拒绝的除外。个人信息处理者处理已公开的个人信息，对个人权益有重大影响的，应当依照本法规定取得个人同意。","source_id":"SRC-CN-CAC-PIPL-2021"},{"no":"第四十四条","ordinal":44,"division":"第四章 个人在个人信息处理活动中的权利","text":"个人对其个人信息的处理享有知情权、决定权，有权限制或者拒绝他人对其个人信息进行处理；法律、行政法规另有规定的除外。","source_id":"SRC-CN-CAC-PIPL-2021"},{"no":"第六十九条","ordinal":69,"division":"第七章 法律责任","text":"处理个人信息侵害个人信息权益造成损害，个人信息处理者不能证明自己没有过错的，应当承担损害赔偿等侵权责任。\n前款规定的损害赔偿责任按照个人因此受到的损失或者个人信息处理者因此获得的利益确定；个人因此受到的损失和个人信息处理者因此获得的利益难以确定的，根据实际情况确定赔偿数额。","source_id":"SRC-CN-CAC-PIPL-2021"},{"no":"第七十二条","ordinal":72,"division":"第八章 附 则","text":"自然人因个人或者家庭事务处理个人信息的，不适用本法。\n法律对各级人民政府及其有关部门组织实施的统计、档案管理活动中的个人信息处理有规定的，适用其规定。","source_id":"SRC-CN-CAC-PIPL-2021"}],"amended_by":[],"verification":"PARSED","evidence_grade":"A"},{"id":"CN-SPC-AI-OPINION-2026","jurisdiction":"CN","title":"最高人民法院关于依法审理涉人工智能纠纷案件的意见","short_title":"最高法涉人工智能纠纷意见","issuer":"最高人民法院","doc_number":"法发〔2026〕10号","level":"司法文件","instrument_type":"AI_SPECIFIC","status":"ADOPTED","status_note":"发布日期见原文；原文未写施行日期，故标“已发布”而不标“现行”；后续修订未专门核查","published_at":"2026-09-07","effective_at":null,"language":"zh","discovered_via":"tavily-search 2026-11-11","foreign_related":"DOMESTIC","source_id":"SRC-CN-SPC-511101","source_ids":["SRC-CN-SPC-511101"],"complete":true,"expected_provisions":24,"meta_evidence":{"doc_number":"法发〔2026〕10号","published_at":"2026年9月7日","expected_provisions":"《意见》分为5个部分，共24条","issuer":"最高人民法院 2026年9月7日"},"derived_dates":{},"generated_by":"ingest/instruments/CN-SPC-AI-OPINION-2026.json","provisions":[{"no":"（一）","ordinal":1,"division":"一、总体要求","text":"指导思想\n坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻习近平法治思想，认真贯彻习近平总书记关于网络强国的重要思想，深刻认识人工智能是新一轮科技革命和产业变革的重要驱动力量，坚持发展和安全并重、促进创新和依法治理相结合，依法公正审理涉人工智能纠纷案件，促进提升人工智能技术应用的安全性、可靠性、可控性、公平性，为以中国式现代化全面推进强国建设、民族复兴伟业提供有力司法服务和保障。","source_id":"SRC-CN-SPC-511101"},{"no":"（二）","ordinal":2,"division":"一、总体要求","text":"基本原则\n坚持以人为本。发挥司法裁判引领作用，积极引导人工智能增进人民福祉，切实加强数字时代民生权益司法保障。积极稳妥探索、完善涉算法伦理、算法规则等人工智能领域的司法裁判规则和机制建设，用足用好现有法律规定，妥善应对人工智能技术发展带来的规则冲突、社会风险和伦理挑战，促进完善人工智能企业社会责任体系，注重防范和消除算法歧视，依法保障个人在自动化决策中的知情权和选择权，预防和规制滥用人工智能技术侵害人民群众合法权益的行为，促推人工智能为民、向善。\n支持创新发展。尊重科技创新规律和人工智能行业发展实践，以符合法律政策精神、符合技术发展规律的司法裁判支持科技创新和产业创新。探索新型权益司法保护路径，不断加大对人工智能创新成果、创新主体、创新行为、创新环境的保护力度。以包容审慎的态度平衡权益保护与技术产业发展，营造鼓励探索、宽容失败的良好环境。依法规制利用人工智能技术实施的垄断或者不正当竞争，依法保障相关主体开发和利用人工智能技术的权利平等、机会平等、规则平等，加强对中小企业等经营主体权益的平等保护。通过依法公正高效审理涉人工智能纠纷案件，积极引导、推动互联网、大数据、人工智能和实体经济深度融合，助力培育壮大人工智能产业，最大限度释放人工智能赋能经济社会高质量发展的巨大潜力。\n筑牢安全底线。根据人工智能在不同应用场景下对民事主体合法权益可能造成的具体损害以及风险的性质和大小，依法准确认定法律责任。区分通用与专用、开源与闭源等不同类型大模型在技术原理、风险外溢与控制能力上的差异，对开发者、提供者、使用者等主体的法律责任作出合理划分。全面准确贯彻宽严相济刑事政策，对于故意利用人工智能实施的危害国家安全、侵犯公民权益、扰乱社会秩序等犯罪行为，坚决依法严惩；对于在人工智能研发、应用中的创新性行为，依法审慎处理，恪守罪刑法定、罪责刑相适应原则。","source_id":"SRC-CN-SPC-511101"},{"no":"（三）","ordinal":3,"division":"二、依法妥善审理涉人工智能侵权案件，切实维护民事主体合法权益","text":"准确把握涉人工智能侵权责任的归责原则。准确适用民法典、个人信息保护法、产品质量法、道路交通安全法等相关法律规定，依法认定利用人工智能侵害民事权益产生的法律责任。法律没有明确规定适用无过错责任或者过错推定责任的，应当依照民法典第一千一百六十五条第一款规定的过错责任原则认定行为人是否承担侵权责任。在判断行为人有无过错以及过错程度时，应当综合考量人工智能应用的具体场景、自主化程度、技术与信息透明度、潜在风险及影响范围，人工智能开发者、提供者等相关主体为预防和减少人工智能侵权所采取的措施及技术上的可能性，人工智能使用者对利用人工智能技术实施的侵权行为可能造成损害的预见能力与控制能力等因素。","source_id":"SRC-CN-SPC-511101"},{"no":"（四）","ordinal":4,"division":"二、依法妥善审理涉人工智能侵权案件，切实维护民事主体合法权益","text":"依法规制“AI换脸拟声”“AI复活逝者”等利用生成式人工智能侵害人格权益的行为。利用生成式人工智能处理特定自然人或者死者的姓名、肖像等，不得违反法律、法规，不得违背公序良俗。除法律另有规定的外，未经自然人同意，利用人工智能处理自然人的姓名、肖像等，生成可识别该自然人的虚拟数字形象并使用、公开，该自然人主张行为人侵害其姓名权、肖像权等人格权益的，人民法院依法予以支持。除法律另有规定的外，未经自然人同意，使用自然人的声音作为训练语料，模仿该自然人的音色、语调和发音风格等生成能够识别该自然人的合成人声，该自然人主张行为人侵害其声音权益的，人民法院依法予以支持。操控生成合成的能够识别特定自然人的虚拟数字形象、声音实施不当行为或者发表不实言论，降低该自然人或者他人社会评价的，人民法院应当依法认定构成对名誉权的侵害。利用人工智能技术擅自制作、使用死者的虚拟数字形象致使死者的姓名、肖像、名誉等受到侵害，死者近亲属依据民法典第九百九十四条的规定请求行为人承担民事责任的，人民法院依法予以支持。","source_id":"SRC-CN-SPC-511101"},{"no":"（五）","ordinal":5,"division":"二、依法妥善审理涉人工智能侵权案件，切实维护民事主体合法权益","text":"依法规制利用人工智能实施“网络开盒”“人肉搜索”等侵害自然人隐私权的行为。以刺探隐私为目的，利用人工智能对特定自然人的电话号码、网络账号及社交媒体等公开信息进行追踪、分析，获取私密信息，或者将所获取的私密信息泄露、公开，或者利用所获取信息侵扰私人生活安宁的，应当认定构成对隐私权的侵害。利用人工智能对特定自然人的私密空间、私密活动等实施拍摄、窥视、窃听等行为的，应当认定构成对隐私权的侵害，但是法律另有规定或者该自然人明确同意的除外。","source_id":"SRC-CN-SPC-511101"},{"no":"（六）","ordinal":6,"division":"二、依法妥善审理涉人工智能侵权案件，切实维护民事主体合法权益","text":"依法认定人工智能训练过程中侵害个人信息权益的民事责任。为人工智能模型训练，在合理范围内处理个人自行公开的或者其他已经合法公开的个人信息，且个人未明确拒绝的，一般不认定为侵害个人信息权益的行为。对个人权益有重大影响的，应当依照法律规定取得个人同意。在认定合理范围时，应当综合考量处理个人信息的目的与模型功能的必要性和适当性，所涉个人信息的类型、敏感程度及对个人权益的潜在影响，个人公开信息时的场景及可合理预期的使用范围等因素。","source_id":"SRC-CN-SPC-511101"},{"no":"（七）","ordinal":7,"division":"二、依法妥善审理涉人工智能侵权案件，切实维护民事主体合法权益","text":"审慎认定生成式人工智能服务提供者的侵权责任。生成式人工智能自动生成的内容侵害他人名誉权、隐私权等人格权益，经权利人通知，生成式人工智能服务提供者未及时采取停止生成侵权内容等必要措施的，应当对造成的损害依法承担侵权责任。通知应当包括构成侵权的初步证据及权利人的真实身份信息。网络用户通过输入侵权提示词等方式恶意诱导生成式人工智能生成侵权内容并造成他人损害的，该网络用户应当依法承担侵权责任；经权利人通知，生成式人工智能服务提供者未及时采取停止生成侵权内容、屏蔽相关生成指令等必要措施，权利人依据民法典第一千一百九十五条的规定请求该网络用户、生成式人工智能服务提供者承担民事责任的，人民法院依法予以支持。","source_id":"SRC-CN-SPC-511101"},{"no":"（八）","ordinal":8,"division":"二、依法妥善审理涉人工智能侵权案件，切实维护民事主体合法权益","text":"依法适用人格权侵害禁令制度。自然人、法人或者非法人组织有证据证明行为人利用人工智能正在实施或者即将实施侵害其人格权益的违法行为，不及时制止将使其合法权益受到难以弥补的损害，向人民法院申请采取责令行为人停止有关行为或者责令有关网络服务提供者、生成式人工智能服务提供者停止提供有关服务的措施的，人民法院可以依法作出人格权侵害禁令。在作出人格权侵害禁令时，人民法院应当结合被侵害的人格权类型、违法行为的方式以及可能造成损害的范围、程度等因素，采取相应的禁令措施，不得超出必要限度。","source_id":"SRC-CN-SPC-511101"},{"no":"（九）","ordinal":9,"division":"二、依法妥善审理涉人工智能侵权案件，切实维护民事主体合法权益","text":"准确认定人工智能产品责任。人民法院应当依据产品质量法关于“产品”的定义，依法准确认定以实物为载体的人工智能产品并适用相应的法律规则。人工智能产品存在缺陷造成损害的，生产者、销售者应当依法承担产品责任。在认定人工智能产品是否存在危及人身、财产安全的不合理危险时，应当综合考量人工智能产品的性质与用途、自主学习能力、升级更新情况、用户对系统的控制程度，以及是否符合相关国家标准、行业标准等因素，并重点审查生产者、销售者是否就人工智能产品的适用场景、固有局限及可预见的风险等进行了真实的说明和明确的警示。","source_id":"SRC-CN-SPC-511101"},{"no":"（十）","ordinal":10,"division":"二、依法妥善审理涉人工智能侵权案件，切实维护民事主体合法权益","text":"依法规制“大数据杀熟”“仿冒名人带货”等侵害消费者合法权益的行为。针对同一商品或者服务，经营者利用算法在交易价格等交易条件上实行不合理的差别待遇，侵害他人合法权益造成损害的，人民法院应当依法认定其承担相应的侵权责任。在认定是否构成不合理的差别待遇时，应当根据差别待遇是否对消费者的知情权、自主选择权、公平交易权等造成实质性限制或者损害，是否基于消费者的消费偏好、支付意愿、支付能力、浏览记录等信息形成针对其个人的交易条件，是否违背诚信原则及商业伦理等，综合考量实行差别待遇的理由是否正当、充分、非歧视。经营者提供商品或者服务时，利用人工智能实施“仿冒名人带货”且构成欺诈，消费者依据消费者权益保护法第五十五条的规定主张惩罚性赔偿的，人民法院依法予以支持。","source_id":"SRC-CN-SPC-511101"},{"no":"（十一）","ordinal":11,"division":"二、依法妥善审理涉人工智能侵权案件，切实维护民事主体合法权益","text":"依法认定涉自动驾驶汽车、具备辅助驾驶功能汽车交通事故的赔偿责任。自动驾驶汽车、具备辅助驾驶功能汽车上道路行驶，发生交通事故造成损害的，依据民法典和道路交通安全法有关规定承担赔偿责任。因车辆存在产品缺陷导致交通事故造成损害，当事人请求生产者或者销售者依照民法典第七编第四章的规定承担赔偿责任的，人民法院应予支持。具备辅助驾驶功能的汽车因车辆缺陷与驾驶人的过错行为结合导致同一损害，当事人依据民法典第一千一百七十二条等规定同时请求驾驶人和车辆生产者或者销售者承担赔偿责任的，人民法院依法予以支持。车辆生产者、销售者对自动驾驶汽车、具备辅助驾驶功能汽车的自动化等级、智能程度、性能、用途等进行虚假或者引人误解的宣传，损害消费者合法权益，消费者依据民法典、消费者权益保护法等法律规定请求车辆生产者、销售者承担民事责任的，人民法院依法予以支持。为查明道路交通事故发生原因，人民法院可以要求车辆生产者、销售者或者运营者等数据控制方，在必要范围内提供真实、完整的自动驾驶、辅助驾驶事件记录等查明案件事实所需要的数据。","source_id":"SRC-CN-SPC-511101"},{"no":"（十二）","ordinal":12,"division":"三、依法妥善审理涉人工智能知识产权纠纷案件，保障人工智能高质量发展和高水平安全","text":"依法规制涉人工智能侵害知识产权的行为。人工智能生成内容侵害他人著作权的，人民法院应当综合考量人工智能服务类型、行业特点、训练数据来源、各方参与度、采取的必要措施以及获利情况等因素，依法合理认定人工智能开发者、提供者、使用者的责任。人工智能开发者提出不侵权抗辩的，应当责令其提供训练数据来源、训练过程记录、模型运行模式以及科学理论依据等予以佐证。权利人主张人工智能提供者利用算法技术侵害其著作权的，应当提供相关证据。人工智能使用者知道或者应当知道在先作品存在，利用人工智能生成与在先作品实质相似的作品且无合理抗辩理由，在先作品权利人请求其承担侵权责任的，人民法院应予支持。利用人工智能实施侵权假冒、虚假宣传、刷量刷单等行为，侵害他人权利或者构成不正当竞争的，依法承担相应责任。","source_id":"SRC-CN-SPC-511101"},{"no":"（十三）","ordinal":13,"division":"三、依法妥善审理涉人工智能知识产权纠纷案件，保障人工智能高质量发展和高水平安全","text":"依法合理认定涉人工智能开源软件相关方的法律责任。审理涉开源软件案件，认定开源软件开发者、提供者以及后续开发者、提供者的侵权责任，应当综合考量开源许可协议类型、权利限制的具体内容、安全合规举措和信息披露程度等因素，依法给予开源软件开发者、提供者适当的责任豁免。开源软件开发者、提供者以免费开源的方式提供涉人工智能软件研发所需要的部分代码模块，并公开说明其功能和安全风险，他人使用该代码模块导致侵权的，人民法院可以认定开源软件开发者、提供者不承担侵权责任。","source_id":"SRC-CN-SPC-511101"},{"no":"（十四）","ordinal":14,"division":"三、依法妥善审理涉人工智能知识产权纠纷案件，保障人工智能高质量发展和高水平安全","text":"依法规范涉人工智能发明创造的专利授权确权行为。涉人工智能发明创造采用遵循自然规律的技术手段，解决了技术问题，实现了符合自然规律的技术效果的，人民法院应当依法认定其为专利法所保护的客体，但是违反法律、社会公德、损害社会公共利益或者自然人没有实质贡献的除外。自然人使用人工智能完成的发明创造，该自然人对发明创造的实质性特点作出了创造性贡献的，应当认定该自然人为发明人。涉人工智能专利说明书对技术方案的表述，达到本领域普通技术人员能够实现该发明的程度的，应当认定符合公开充分的授权条件。","source_id":"SRC-CN-SPC-511101"},{"no":"（十五）","ordinal":15,"division":"三、依法妥善审理涉人工智能知识产权纠纷案件，保障人工智能高质量发展和高水平安全","text":"依法审慎认定涉人工智能技术合同履行的违约责任。人民法院审理涉人工智能技术开发、转让、许可、咨询、服务合同纠纷案件，应当根据合同约定，充分考量人工智能技术研发特点、技术开发方是否尽到合理努力等情形依法认定违约责任。","source_id":"SRC-CN-SPC-511101"},{"no":"（十六）","ordinal":16,"division":"三、依法妥善审理涉人工智能知识产权纠纷案件，保障人工智能高质量发展和高水平安全","text":"依法规范涉人工智能数据使用行为。人工智能开发者通过采集生成、衍生创造、受让取得、授权许可等方式合法获取数据并享有相应数据权益的，人民法院应当予以保护。对于构成汇编作品或者符合其他作品构成要件的数据、数据集合，应当依照著作权法予以保护。对于构成商业秘密的数据、数据集合，应当依照反不正当竞争法予以保护。对于不构成商业秘密的数据、数据集合，被诉侵权行为违反反不正当竞争法第十三条规定的，应当依法承担责任。经营者利用数据、算法等技术手段达成垄断协议或者实施滥用市场支配地位等行为的，依法承担相应责任。采取虚构干扰数据、恶意标注数据、对抗样本攻击等技术手段，损害人工智能运行安全的，依法承担相应责任。","source_id":"SRC-CN-SPC-511101"},{"no":"（十七）","ordinal":17,"division":"四、完善涉人工智能纠纷案件审理程序规则，依法惩治利用生成式人工智能实施妨害司法秩序等违法犯罪行为","text":"依法准确查明涉人工智能纠纷案件事实。基于涉人工智能纠纷案件技术性、专业性强等特点，人民法院应当依法加强诉讼引导和释明，引导当事人围绕争议事实及时全面地完成举证。当事人因客观原因不能自行收集的证据，可申请人民法院调查收集；必要时，人民法院可以依职权调查收集证据。当事人为固定关键技术申请证据保全的，人民法院应当及时依法审查。控制书证、电子数据等证据的当事人无正当理由拒不提交，对方当事人主张该证据的内容不利于控制人的，人民法院可以认定该主张成立。对于涉及人工智能技术原理、运行机制等专业问题的，人民法院应当依法充分发挥人民陪审员、鉴定人、专家辅助人以及技术调查官的作用，辅助查明案件事实。","source_id":"SRC-CN-SPC-511101"},{"no":"（十八）","ordinal":18,"division":"四、完善涉人工智能纠纷案件审理程序规则，依法惩治利用生成式人工智能实施妨害司法秩序等违法犯罪行为","text":"探索完善涉人工智能纠纷案件证据审查规则。人民法院应当充分考量人工智能技术的复杂性、系统运行的不透明性以及证据收集的特殊性，不断完善适应新技术发展的证据审查规则。对电子数据生成、收集、存储、传输过程的真实性、完整性进行重点审查。对大数据、区块链等不同信息技术产生的证据明确差异化证据审查重点。对大数据分析报告类证据，应当重点审查其原始数据的来源、清洗规则及分析方法的科学性等；对区块链存证类证据，应当重点审查其上链前数据的真实性及技术平台的可靠性等。当事人将人工智能生成内容作为侵权证据的，人民法院应当综合考量提示词的设计及其对生成结果的影响、生成内容与主张权利作品的相似程度、重复测试的一致性，以及模型训练、算法设计、生成内容过滤机制等因素予以认定。","source_id":"SRC-CN-SPC-511101"},{"no":"（十九）","ordinal":19,"division":"四、完善涉人工智能纠纷案件审理程序规则，依法惩治利用生成式人工智能实施妨害司法秩序等违法犯罪行为","text":"依法规制利用人工智能不当取证等妨害司法秩序的行为。当事人利用人工智能自主学习、自主决策的特性，通过删除或者篡改生成合成内容标识、特定指令输入、选择性结果呈现、对抗性干扰等人为干预或者误导的方式取得虚假证据，捏造民事案件基本事实，进行虚假诉讼，企图侵害国家利益、社会公共利益或者他人合法权益的，人民法院应当依法驳回其诉讼请求，并根据情节轻重予以罚款、拘留；构成犯罪的，依法追究刑事责任。诉讼参与人或者其他人利用人工智能伪造证据，妨碍人民法院审理案件的，依据民事诉讼法第一百一十四条规定处理。诉讼参与人提交诉讼文书、案例检索报告等材料如系使用人工智能生成，在提交法庭前应当认真核实相关法律、司法解释、案例等内容的真实性、准确性，在提交法庭时对使用人工智能辅助情况作出说明，并对有关内容的真实性、准确性依法承担责任。","source_id":"SRC-CN-SPC-511101"},{"no":"（二十）","ordinal":20,"division":"四、完善涉人工智能纠纷案件审理程序规则，依法惩治利用生成式人工智能实施妨害司法秩序等违法犯罪行为","text":"依法惩治利用人工智能实施的犯罪活动。利用人工智能实施诈骗、侮辱、诽谤、损害商业信誉、商品声誉、侵犯公民个人信息、非法获取计算机信息系统数据、制作、贩卖、传播淫秽物品等行为，构成犯罪的，依法追究刑事责任。行为人激活辅助驾驶功能后利用私自安装的配件逃避辅助驾驶系统监测导致道路交通事故，构成犯罪的，依法追究刑事责任。","source_id":"SRC-CN-SPC-511101"},{"no":"（二十一）","ordinal":21,"division":"五、加大对涉人工智能纠纷案件审判指导力度，不断健全完善工作机制","text":"充分发挥多元解纷机制作用。人民法院应当积极运用多元解纷机制妥善化解涉人工智能纠纷，推动与人工智能行业主管部门、行业性专业性调解组织、人工智能专家学者等建立联动协同机制，共同开展纠纷化解工作，做实先行调解。立足司法审判职能，推动提升涉人工智能纠纷预防化解的法治化水平，积极通过庭审公开、以案释法等方式明确权利义务、划定行为边界，发挥司法裁判示范引领作用，促进涉人工智能纠纷源头预防、及时化解。","source_id":"SRC-CN-SPC-511101"},{"no":"（二十二）","ordinal":22,"division":"五、加大对涉人工智能纠纷案件审判指导力度，不断健全完善工作机制","text":"加强审判监督指导。积极规范适用提级管辖，强化示范引领作用，做实审判监督指导。对涉及重大利益、疑难复杂新类型、具有规则确立意义、需要统一法律适用标准等涉人工智能纠纷案件，由上级人民法院提级审理。充分运用人民法院案例库，加强案例指导工作，促推法律适用统一和人工智能治理规则的完善。","source_id":"SRC-CN-SPC-511101"},{"no":"（二十三）","ordinal":23,"division":"五、加大对涉人工智能纠纷案件审判指导力度，不断健全完善工作机制","text":"加强部门协作协同。通过制发司法建议、建立合作机制等多种方式，充分发挥司法职能，服务国家和社会治理。加强与网信、公安、检察以及市场监管等部门衔接协作，建立并落实长效综合治理机制。引导相关企业、平台、行业协会等规范自治，推动形成人工智能行业自律、行政监管、司法保障的全链条保护合力。","source_id":"SRC-CN-SPC-511101"},{"no":"（二十四）","ordinal":24,"division":"五、加大对涉人工智能纠纷案件审判指导力度，不断健全完善工作机制","text":"加强国际司法交流合作。妥善审理涉人工智能及数据跨境纠纷案件，在坚持相互尊重、平等互利原则基础上，推进人工智能领域涉外审判交流合作，加强规则对接与互鉴，推动构建更加公平合理、包容开放的人工智能治理体系，促进、保护人工智能生态系统和人类文明的多样性。","source_id":"SRC-CN-SPC-511101"}],"amended_by":[],"verification":"VERIFIED","evidence_grade":"A"},{"id":"EU-AI-ACT-2024","jurisdiction":"EU","title":"Regulation (EU) 2024/1689 of the European Parliament and of the Council","short_title":"EU AI Act","issuer":"European Parliament、Council of the European Union","doc_number":"Regulation (EU) 2024/1689","level":"Regulation","instrument_type":"AI_SPECIFIC","status":"AMENDED","status_note":"库内条文是 2024 年公报原始文本，不是合并文本；已被 Regulation (EU) 2026/1744 修订，逐条变动尚未标注，引用前须对照修订条例；生效日按第 113 条与公报日期推算；附件未收","published_at":"2024-07-12","effective_at":"2024-08-01","language":"en","discovered_via":"EUR-Lex","foreign_related":"FOREIGN_CLAUSE","source_id":"SRC-EU-AIACT-OJ","source_ids":["SRC-EU-AIACT-OJ"],"complete":true,"expected_provisions":113,"meta_evidence":{"doc_number":"REGULATION (EU) 2024/1689 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL","adopted_at":"Done at Brussels, 13 June 2024.","published_at":"12.7.2024","entry_into_force":"This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union.","general_application":"It shall apply from 2 August 2026.","issuer":"THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,"},"derived_dates":{"effective_at":{"from":"published_at","plus_days":20,"basis":"entry_into_force"}},"generated_by":"ingest/instruments/EU-AI-ACT-2024.json","provisions":[{"no":"Article 1","ordinal":1,"division":"CHAPTER I","heading":"Subject matter`","text":"1. The purpose of this Regulation is to improve the functioning of the internal market and promote the uptake of human-centric and trustworthy artificial intelligence (AI), while ensuring a high level of protection of health, safety, fundamental rights enshrined in the Charter, including democracy, the rule of law and environmental protection, against the harmful effects of AI systems in the Union and supporting innovation.\n2. This Regulation lays down:\n(a)\nharmonised rules for the placing on the market, the putting into service, and the use of AI systems in the Union;\n(b)\nprohibitions of certain AI practices;\n(c)\nspecific requirements for high-risk AI systems and obligations for operators of such systems;\n(d)\nharmonised transparency rules for certain AI systems;\n(e)\nharmonised rules for the placing on the market of general-purpose AI models;\n(f)\nrules on market monitoring, market surveillance, governance and enforcement;\n(g)\nmeasures to support innovation, with a particular focus on SMEs, including start-ups.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 2","ordinal":2,"division":"CHAPTER I","heading":"Scope","text":"1. This Regulation applies to:\n(a)\nproviders placing on the market or putting into service AI systems or placing on the market general-purpose AI models in the Union, irrespective of whether those providers are established or located within the Union or in a third country;\n(b)\ndeployers of AI systems that have their place of establishment or are located within the Union;\n(c)\nproviders and deployers of AI systems that have their place of establishment or are located in a third country, where the output produced by the AI system is used in the Union;\n(d)\nimporters and distributors of AI systems;\n(e)\nproduct manufacturers placing on the market or putting into service an AI system together with their product and under their own name or trademark;\n(f)\nauthorised representatives of providers, which are not established in the Union;\n(g)\naffected persons that are located in the Union.\n2. For AI systems classified as high-risk AI systems in accordance with Article 6(1) related to products covered by the Union harmonisation legislation listed in Section B of Annex I, only Article 6(1), Articles 102 to 109 and Article 112 apply. Article 57 applies only in so far as the requirements for high-risk AI systems under this Regulation have been integrated in that Union harmonisation legislation.\n3. This Regulation does not apply to areas outside the scope of Union law, and shall not, in any event, affect the competences of the Member States concerning national security, regardless of the type of entity entrusted by the Member States with carrying out tasks in relation to those competences.\nThis Regulation does not apply to AI systems where and in so far they are placed on the market, put into service, or used with or without modification exclusively for military, defence or national security purposes, regardless of the type of entity carrying out those activities.\nThis Regulation does not apply to AI systems which are not placed on the market or put into service in the Union, where the output is used in the Union exclusively for military, defence or national security purposes, regardless of the type of entity carrying out those activities.\n4. This Regulation applies neither to public authorities in a third country nor to international organisations falling within the scope of this Regulation pursuant to paragraph 1, where those authorities or organisations use AI systems in the framework of international cooperation or agreements for law enforcement and judicial cooperation with the Union or with one or more Member States, provided that such a third country or international organisation provides adequate safeguards with respect to the protection of fundamental rights and freedoms of individuals.\n5. This Regulation shall not affect the application of the provisions on the liability of providers of intermediary services as set out in Chapter II of Regulation (EU) 2022/2065.\n6. This Regulation does not apply to AI systems or AI models, including their output, specifically developed and put into service for the sole purpose of scientific research and development.\n7. Union law on the protection of personal data, privacy and the confidentiality of communications applies to personal data processed in connection with the rights and obligations laid down in this Regulation. This Regulation shall not affect Regulation (EU) 2016/679 or (EU) 2018/1725, or Directive 2002/58/EC or (EU) 2016/680, without prejudice to Article 10(5) and Article 59 of this Regulation.\n8. This Regulation does not apply to any research, testing or development activity regarding AI systems or AI models prior to their being placed on the market or put into service. Such activities shall be conducted in accordance with applicable Union law. Testing in real world conditions shall not be covered by that exclusion.\n9. This Regulation is without prejudice to the rules laid down by other Union legal acts related to consumer protection and product safety.\n10. This Regulation does not apply to obligations of deployers who are natural persons using AI systems in the course of a purely personal non-professional activity.\n11. This Regulation does not preclude the Union or Member States from maintaining or introducing laws, regulations or administrative provisions which are more favourable to workers in terms of protecting their rights in respect of the use of AI systems by employers, or from encouraging or allowing the application of collective agreements which are more favourable to workers.\n12. This Regulation does not apply to AI systems released under free and open-source licences, unless they are placed on the market or put into service as high-risk AI systems or as an AI system that falls under Article 5 or 50.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 3","ordinal":3,"division":"CHAPTER I","heading":"Definitions","text":"For the purposes of this Regulation, the following definitions apply:\n(1)\n‘AI system’ means a machine-based system that is designed to operate with varying levels of autonomy and that may exhibit adaptiveness after deployment, and that, for explicit or implicit objectives, infers, from the input it receives, how to generate outputs such as predictions, conte
