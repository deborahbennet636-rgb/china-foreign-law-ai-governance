k as referred to in paragraph 1 of this Article, it shall carry out an evaluation of the AI system concerned in respect of its compliance with all the requirements and obligations laid down in this Regulation. Particular attention shall be given to AI systems presenting a risk to vulnerable groups. Where risks to fundamental rights are identified, the market surveillance authority shall also inform and fully cooperate with the relevant national public authorities or bodies referred to in Article 77(1). The relevant operators shall cooperate as necessary with the market surveillance authority and with the other national public authorities or bodies referred to in Article 77(1).\nWhere, in the course of that evaluation, the market surveillance authority or, where applicable the market surveillance authority in cooperation with the national public authority referred to in Article 77(1), finds that the AI system does not comply with the requirements and obligations laid down in this Regulation, it shall without undue delay require the relevant operator to take all appropriate corrective actions to bring the AI system into compliance, to withdraw the AI system from the market, or to recall it within a period the market surveillance authority may prescribe, and in any event within the shorter of 15 working days, or as provided for in the relevant Union harmonisation legislation.\nThe market surveillance authority shall inform the relevant notified body accordingly. Article 18 of Regulation (EU) 2019/1020 shall apply to the measures referred to in the second subparagraph of this paragraph.\n3. Where the market surveillance authority considers that the non-compliance is not restricted to its national territory, it shall inform the Commission and the other Member States without undue delay of the results of the evaluation and of the actions which it has required the operator to take.\n4. The operator shall ensure that all appropriate corrective action is taken in respect of all the AI systems concerned that it has made available on the Union market.\n5. Where the operator of an AI system does not take adequate corrective action within the period referred to in paragraph 2, the market surveillance authority shall take all appropriate provisional measures to prohibit or restrict the AI system’s being made available on its national market or put into service, to withdraw the product or the standalone AI system from that market or to recall it. That authority shall without undue delay notify the Commission and the other Member States of those measures.\n6. The notification referred to in paragraph 5 shall include all available details, in particular the information necessary for the identification of the non-compliant AI system, the origin of the AI system and the supply chain, the nature of the non-compliance alleged and the risk involved, the nature and duration of the national measures taken and the arguments put forward by the relevant operator. In particular, the market surveillance authorities shall indicate whether the non-compliance is due to one or more of the following:\n(a)\nnon-compliance with the prohibition of the AI practices referred to in Article 5;\n(b)\na failure of a high-risk AI system to meet requirements set out in Chapter III, Section 2;\n(c)\nshortcomings in the harmonised standards or common specifications referred to in Articles 40 and 41 conferring a presumption of conformity;\n(d)\nnon-compliance with Article 50.\n7. The market surveillance authorities other than the market surveillance authority of the Member State initiating the procedure shall, without undue delay, inform the Commission and the other Member States of any measures adopted and of any additional information at their disposal relating to the non-compliance of the AI system concerned, and, in the event of disagreement with the notified national measure, of their objections.\n8. Where, within three months of receipt of the notification referred to in paragraph 5 of this Article, no objection has been raised by either a market surveillance authority of a Member State or by the Commission in respect of a provisional measure taken by a market surveillance authority of another Member State, that measure shall be deemed justified. This shall be without prejudice to the procedural rights of the concerned operator in accordance with Article 18 of Regulation (EU) 2019/1020. The three-month period referred to in this paragraph shall be reduced to 30 days in the event of non-compliance with the prohibition of the AI practices referred to in Article 5 of this Regulation.\n9. The market surveillance authorities shall ensure that appropriate restrictive measures are taken in respect of the product or the AI system concerned, such as withdrawal of the product or the AI system from their market, without undue delay.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 80","ordinal":80,"division":"CHAPTER IX / SECTION 3","heading":"Procedure for dealing with AI systems classified by the provider as non-high-risk in application of Annex III","text":"1. Where a market surveillance authority has sufficient reason to consider that an AI system classified by the provider as non-high-risk pursuant to Article 6(3) is indeed high-risk, the market surveillance authority shall carry out an evaluation of the AI system concerned in respect of its classification as a high-risk AI system based on the conditions set out in Article 6(3) and the Commission guidelines.\n2. Where, in the course of that evaluation, the market surveillance authority finds that the AI system concerned is high-risk, it shall without undue delay require the relevant provider to take all necessary actions to bring the AI system into compliance with the requirements and obligations laid down in this Regulation, as well as take appropriate corrective action within a period the market surveillance authority may prescribe.\n3. Where the market surveillance authority considers that the use of the AI system concerned is not restricted to its national territory, it shall inform the Commission and the other Member States without undue delay of the results of the evaluation and of the actions which it has required the provider to take.\n4. The provider shall ensure that all necessary action is taken to bring the AI system into compliance with the requirements and obligations laid down in this Regulation. Where the provider of an AI system concerned does not bring the AI system into compliance with those requirements and obligations within the period referred to in paragraph 2 of this Article, the provider shall be subject to fines in accordance with Article 99.\n5. The provider shall ensure that all appropriate corrective action is taken in respect of all the AI systems concerned that it has made available on the Union market.\n6. Where the provider of the AI system concerned does not take adequate corrective action within the period referred to in paragraph 2 of this Article, Article 79(5) to (9) shall apply.\n7. Where, in the course of the evaluation pursuant to paragraph 1 of this Article, the market surveillance authority establishes that the AI system was misclassified by the provider as non-high-risk in order to circumvent the application of requirements in Chapter III, Section 2, the provider shall be subject to fines in accordance with Article 99.\n8. In exercising their power to monitor the application of this Article, and in accordance with Article 11 of Regulation (EU) 2019/1020, market surveillance authorities may perform appropriate checks, taking into account in particular information stored in the EU database referred to in Article 71 of this Regulation.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 81","ordinal":81,"division":"CHAPTER IX / SECTION 3","heading":"Union safeguard procedure","text":"1. Where, within three months of receipt of the notification referred to in Article 79(5), or within 30 days in the case of non-compliance with the prohibition of the AI practices referred to in Article 5, objections are raised by the market surveillance authority of a Member State to a measure taken by another market surveillance authority, or where the Commission considers the measure to be contrary to Union law, the Commission shall without undue delay enter into consultation with the market surveillance authority of the relevant Member State and the operator or operators, and shall evaluate the national measure. On the basis of the results of that evaluation, the Commission shall, within six months, or within 60 days in the case of non-compliance with the prohibition of the AI practices referred to in Article 5, starting from the notification referred to in Article 79(5), decide whether the national measure is justified and shall notify its decision to the market surveillance authority of the Member State concerned. The Commission shall also inform all other market surveillance authorities of its decision.\n2. Where the Commission considers the measure taken by the relevant Member State to be justified, all Member States shall ensure that they take appropriate restrictive measures in respect of the AI system concerned, such as requiring the withdrawal of the AI system from their market without undue delay, and shall inform the Commission accordingly. Where the Commission considers the national measure to be unjustified, the Member State concerned shall withdraw the measure and shall inform the Commission accordingly.\n3. Where the national measure is considered justified and the non-compliance of the AI system is attributed to shortcomings in the harmonised standards or common specifications referred to in Articles 40 and 41 of this Regulation, the Commission shall apply the procedure provided for in Article 11 of Regulation (EU) No 1025/2012.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 82","ordinal":82,"division":"CHAPTER IX / SECTION 3","heading":"Compliant AI systems which present a risk","text":"1. Where, having performed an evaluation under Article 79, after consulting the relevant national public authority referred to in Article 77(1), the market surveillance authority of a Member State finds that although a high-risk AI system complies with this Regulation, it nevertheless presents a risk to the health or safety of persons, to fundamental rights, or to other aspects of public interest protection, it shall require the relevant operator to take all appropriate measures to ensure that the AI system concerned, when placed on the market or put into service, no longer presents that risk without undue delay, within a period it may prescribe.\n2. The provider or other relevant operator shall ensure that corrective action is taken in respect of all the AI systems concerned that it has made available on the Union market within the timeline prescribed by the market surveillance authority of the Member State referred to in paragraph 1.\n3. The Member States shall immediately inform the Commission and the other Member States of a finding under paragraph 1. That information shall include all available details, in particular the data necessary for the identification of the AI system concerned, the origin and the supply chain of the AI system, the nature of the risk involved and the nature and duration of the national measures taken.\n4. The Commission shall without undue delay enter into consultation with the Member States concerned and the relevant operators, and shall evaluate the national measures taken. On the basis of the results of that evaluation, the Commission shall decide whether the measure is justified and, where necessary, propose other appropriate measures.\n5. The Commission shall immediately communicate its decision to the Member States concerned and to the relevant operators. It shall also inform the other Member States.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 83","ordinal":83,"division":"CHAPTER IX / SECTION 3","heading":"Formal non-compliance","text":"1. Where the market surveillance authority of a Member State makes one of the following findings, it shall require the relevant provider to put an end to the non-compliance concerned, within a period it may prescribe:\n(a)\nthe CE marking has been affixed in violation of Article 48;\n(b)\nthe CE marking has not been affixed;\n(c)\nthe EU declaration of conformity referred to in Article 47 has not been drawn up;\n(d)\nthe EU declaration of conformity referred to in Article 47 has not been drawn up correctly;\n(e)\nthe registration in the EU database referred to in Article 71 has not been carried out;\n(f)\nwhere applicable, no authorised representative has been appointed;\n(g)\ntechnical documentation is not available.\n2. Where the non-compliance referred to in paragraph 1 persists, the market surveillance authority of the Member State concerned shall take appropriate and proportionate measures to restrict or prohibit the high-risk AI system being made available on the market or to ensure that it is recalled or withdrawn from the market without delay.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 84","ordinal":84,"division":"CHAPTER IX / SECTION 3","heading":"Union AI testing support structures","text":"1. The Commission shall designate one or more Union AI testing support structures to perform the tasks listed under Article 21(6) of Regulation (EU) 2019/1020 in the area of AI.\n2. Without prejudice to the tasks referred to in paragraph 1, Union AI testing support structures shall also provide independent technical or scientific advice at the request of the Board, the Commission, or of market surveillance authorities.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 85","ordinal":85,"division":"CHAPTER IX / SECTION 4","heading":"Right to lodge a complaint with a market surveillance authority","text":"Without prejudice to other administrative or judicial remedies, any natural or legal person having grounds to consider that there has been an infringement of the provisions of this Regulation may submit complaints to the relevant market surveillance authority.\nIn accordance with Regulation (EU) 2019/1020, such complaints shall be taken into account for the purpose of conducting market surveillance activities, and shall be handled in line with the dedicated procedures established therefor by the market surveillance authorities.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 86","ordinal":86,"division":"CHAPTER IX / SECTION 4","heading":"Right to explanation of individual decision-making","text":"1. Any affected person subject to a decision which is taken by the deployer on the basis of the output from a high-risk AI system listed in Annex III, with the exception of systems listed under point 2 thereof, and which produces legal effects or similarly significantly affects that person in a way that they consider to have an adverse impact on their health, safety or fundamental rights shall have the right to obtain from the deployer clear and meaningful explanations of the role of the AI system in the decision-making procedure and the main elements of the decision taken.\n2. Paragraph 1 shall not apply to the use of AI systems for which exceptions from, or restrictions to, the obligation under that paragraph follow from Union or national law in compliance with Union law.\n3. This Article shall apply only to the extent that the right referred to in paragraph 1 is not otherwise provided for under Union law.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 87","ordinal":87,"division":"CHAPTER IX / SECTION 4","heading":"Reporting of infringements and protection of reporting persons","text":"Directive (EU) 2019/1937 shall apply to the reporting of infringements of this Regulation and the protection of persons reporting such infringements.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 88","ordinal":88,"division":"CHAPTER IX / SECTION 5","heading":"Enforcement of the obligations of providers of general-purpose AI models","text":"1. The Commission shall have exclusive powers to supervise and enforce Chapter V, taking into account the procedural guarantees under Article 94. The Commission shall entrust the implementation of these tasks to the AI Office, without prejudice to the powers of organisation of the Commission and the division of competences between Member States and the Union based on the Treaties.\n2. Without prejudice to Article 75(3), market surveillance authorities may request the Commission to exercise the powers laid down in this Section, where that is necessary and proportionate to assist with the fulfilment of their tasks under this Regulation.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 89","ordinal":89,"division":"CHAPTER IX / SECTION 5","heading":"Monitoring actions","text":"1. For the purpose of carrying out the tasks assigned to it under this Section, the AI Office may take the necessary actions to monitor the effective implementation and compliance with this Regulation by providers of general-purpose AI models, including their adherence to approved codes of practice.\n2. Downstream providers shall have the right to lodge a complaint alleging an infringement of this Regulation. A complaint shall be duly reasoned and indicate at least:\n(a)\nthe point of contact of the provider of the general-purpose AI model concerned;\n(b)\na description of the relevant facts, the provisions of this Regulation concerned, and the reason why the downstream provider considers that the provider of the general-purpose AI model concerned infringed this Regulation;\n(c)\nany other information that the downstream provider that sent the request considers relevant, including, where appropriate, information gathered on its own initiative.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 90","ordinal":90,"division":"CHAPTER IX / SECTION 5","heading":"Alerts of systemic risks by the scientific panel","text":"1. The scientific panel may provide a qualified alert to the AI Office where it has reason to suspect that:\n(a)\na general-purpose AI model poses concrete identifiable risk at Union level; or\n(b)\na general-purpose AI model meets the conditions referred to in Article 51.\n2. Upon such qualified alert, the Commission, through the AI Office and after having informed the Board, may exercise the powers laid down in this Section for the purpose of assessing the matter. The AI Office shall inform the Board of any measure according to Articles 91 to 94.\n3. A qualified alert shall be duly reasoned and indicate at least:\n(a)\nthe point of contact of the provider of the general-purpose AI model with systemic risk concerned;\n(b)\na description of the relevant facts and the reasons for the alert by the scientific panel;\n(c)\nany other information that the scientific panel considers to be relevant, including, where appropriate, information gathered on its own initiative.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 91","ordinal":91,"division":"CHAPTER IX / SECTION 5","heading":"Power to request documentation and information","text":"1. The Commission may request the provider of the general-purpose AI model concerned to provide the documentation drawn up by the provider in accordance with Articles 53 and 55, or any additional information that is necessary for the purpose of assessing compliance of the provider with this Regulation.\n2. Before sending the request for information, the AI Office may initiate a structured dialogue with the provider of the general-purpose AI model.\n3. Upon a duly substantiated request from the scientific panel, the Commission may issue a request for information to a provider of a general-purpose AI model, where the access to information is necessary and proportionate for the fulfilment of the tasks of the scientific panel under Article 68(2).\n4. The request for information shall state the legal basis and the purpose of the request, specify what information is required, set a period within which the information is to be provided, and indicate the fines provided for in Article 101 for supplying incorrect, incomplete or misleading information.\n5. The provider of the general-purpose AI model concerned, or its representative shall supply the information requested. In the case of legal persons, companies or firms, or where the provider has no legal personality, the persons authorised to represent them by law or by their statutes, shall supply the information requested on behalf of the provider of the general-purpose AI model concerned. Lawyers duly authorised to act may supply information on behalf of their clients. The clients shall nevertheless remain fully responsible if the information supplied is incomplete, incorrect or misleading.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 92","ordinal":92,"division":"CHAPTER IX / SECTION 5","heading":"Power to conduct evaluations","text":"1. The AI Office, after consulting the Board, may conduct evaluations of the general-purpose AI model concerned:\n(a)\nto assess compliance of the provider with obligations under this Regulation, where the information gathered pursuant to Article 91 is insufficient; or\n(b)\nto investigate systemic risks at Union level of general-purpose AI models with systemic risk, in particular following a qualified alert from the scientific panel in accordance with Article 90(1), point (a).\n2. The Commission may decide to appoint independent experts to carry out evaluations on its behalf, including from the scientific panel established pursuant to Article 68. Independent experts appointed for this task shall meet the criteria outlined in Article 68(2).\n3. For the purposes of paragraph 1, the Commission may request access to the general-purpose AI model concerned through APIs or further appropriate technical means and tools, including source code.\n4. The request for access shall state the legal basis, the purpose and reasons of the request and set the period within which the access is to be provided, and the fines provided for in Article 101 for failure to provide access.\n5. The providers of the general-purpose AI model concerned or its representative shall supply the information requested. In the case of legal persons, companies or firms, or where the provider has no legal personality, the persons authorised to represent them by law or by their statutes, shall provide the access requested on behalf of the provider of the general-purpose AI model concerned.\n6. The Commission shall adopt implementing acts setting out the detailed arrangements and the conditions for the evaluations, including the detailed arrangements for involving independent experts, and the procedure for the selection thereof. Those implementing acts shall be adopted in accordance with the examination procedure referred to in Article 98(2).\n7. Prior to requesting access to the general-purpose AI model concerned, the AI Office may initiate a structured dialogue with the provider of the general-purpose AI model to gather more information on the internal testing of the model, internal safeguards for preventing systemic risks, and other internal procedures and measures the provider has taken to mitigate such risks.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 93","ordinal":93,"division":"CHAPTER IX / SECTION 5","heading":"Power to request measures","text":"1. Where necessary and appropriate, the Commission may request providers to:\n(a)\ntake appropriate measures to comply with the obligations set out in Articles 53 and 54;\n(b)\nimplement mitigation measures, where the evaluation carried out in accordance with Article 92 has given rise to serious and substantiated concern of a systemic risk at Union level;\n(c)\nrestrict the making available on the market, withdraw or recall the model.\n2. Before a measure is requested, the AI Office may initiate a structured dialogue with the provider of the general-purpose AI model.\n3. If, during the structured dialogue referred to in paragraph 2, the provider of the general-purpose AI model with systemic risk offers commitments to implement mitigation measures to address a systemic risk at Union level, the Commission may, by decision, make those commitments binding and declare that there are no further grounds for action.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 94","ordinal":94,"division":"CHAPTER IX / SECTION 5","heading":"Procedural rights of economic operators of the general-purpose AI model","text":"Article 18 of Regulation (EU) 2019/1020 shall apply mutatis mutandis to the providers of the general-purpose AI model, without prejudice to more specific procedural rights provided for in this Regulation.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 95","ordinal":95,"division":"CHAPTER X","heading":"Codes of conduct for voluntary application of specific requirements","text":"1. The AI Office and the Member States shall encourage and facilitate the drawing up of codes of conduct, including related governance mechanisms, intended to foster the voluntary application to AI systems, other than high-risk AI systems, of some or all of the requirements set out in Chapter III, Section 2 taking into account the available technical solutions and industry best practices allowing for the application of such requirements.\n2. The AI Office and the Member States shall facilitate the drawing up of codes of conduct concerning the voluntary application, including by deployers, of specific requirements to all AI systems, on the basis of clear objectives and key performance indicators to measure the achievement of those objectives, including elements such as, but not limited to:\n(a)\napplicable elements provided for in Union ethical guidelines for trustworthy AI;\n(b)\nassessing and minimising the impact of AI systems on environmental sustainability, including as regards energy-efficient programming and techniques for the efficient design, training and use of AI;\n(c)\npromoting AI literacy, in particular that of persons dealing with the development, operation and use of AI;\n(d)\nfacilitating an inclusive and diverse design of AI systems, including through the establishment of inclusive and diverse development teams and the promotion of stakeholders’ participation in that process;\n(e)\nassessing and preventing the negative impact of AI systems on vulnerable persons or groups of vulnerable persons, including as regards accessibility for persons with a disability, as well as on gender equality.\n3. Codes of conduct may be drawn up by individual providers or deployers of AI systems or by organisations representing them or by both, including with the involvement of any interested stakeholders and their representative organisations, including civil society organisations and academia. Codes of conduct may cover one or more AI systems taking into account the similarity of the intended purpose of the relevant systems.\n4. The AI Office and the Member States shall take into account the specific interests and needs of SMEs, including start-ups, when encouraging and facilitating the drawing up of codes of conduct.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 96","ordinal":96,"division":"CHAPTER X","heading":"Guidelines from the Commission on the implementation of this Regulation","text":"1. The Commission shall develop guidelines on the practical implementation of this Regulation, and in particular on:\n(a)\nthe application of the requirements and obligations referred to in Articles 8 to 15 and in Article 25;\n(b)\nthe prohibited practices referred to in Article 5;\n(c)\nthe practical implementation of the provisions related to substantial modification;\n(d)\nthe practical implementation of transparency obligations laid down in Article 50;\n(e)\ndetailed information on the relationship of this Regulation with the Union harmonisation legislation listed in Annex I, as well as with other relevant Union law, including as regards consistency in their enforcement;\n(f)\nthe application of the definition of an AI system as set out in Article 3, point (1).\nWhen issuing such guidelines, the Commission shall pay particular attention to the needs of SMEs including start-ups, of local public authorities and of the sectors most likely to be affected by this Regulation.\nThe guidelines referred to in the first subparagraph of this paragraph shall take due account of the generally acknowledged state of the art on AI, as well as of relevant harmonised standards and common specifications that are referred to in Articles 40 and 41, or of those harmonised standards or technical specifications that are set out pursuant to Union harmonisation law.\n2. At the request of the Member States or the AI Office, or on its own initiative, the Commission shall update guidelines previously adopted when deemed necessary.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 97","ordinal":97,"division":"CHAPTER XI","heading":"Exercise of the delegation","text":"1. The power to adopt delegated acts is conferred on the Commission subject to the conditions laid down in this Article.\n2. The power to adopt delegated acts referred to in Article 6(6) and (7), Article 7(1) and (3), Article 11(3), Article 43(5) and (6), Article 47(5), Article 51(3), Article 52(4) and Article 53(5) and (6) shall be conferred on the Commission for a period of five years from 1 August 2024. The Commission shall draw up a report in respect of the delegation of power not later than nine months before the end of the five-year period. The delegation of power shall be tacitly extended for periods of an identical duration, unless the European Parliament or the Council opposes such extension not later than three months before the end of each period.\n3. The delegation of power referred to in Article 6(6) and (7), Article 7(1) and (3), Article 11(3), Article 43(5) and (6), Article 47(5), Article 51(3), Article 52(4) and Article 53(5) and (6) may be revoked at any time by the European Parliament or by the Council. A decision of revocation shall put an end to the delegation of power specified in that decision. It shall take effect the day following that of its publication in the Official Journal of the European Union or at a later date specified therein. It shall not affect the validity of any delegated acts already in force.\n4. Before adopting a delegated act, the Commission shall consult experts designated by each Member State in accordance with the principles laid down in the Interinstitutional Agreement of 13 April 2016 on Better Law-Making.\n5. As soon as it adopts a delegated act, the Commission shall notify it simultaneously to the European Parliament and to the Council.\n6. Any delegated act adopted pursuant to Article 6(6) or (7), Article 7(1) or (3), Article 11(3), Article 43(5) or (6), Article 47(5), Article 51(3), Article 52(4) or Article 53(5) or (6) shall enter into force only if no objection has been expressed by either the European Parliament or the Council within a period of three months of notification of that act to the European Parliament and the Council or if, before the expiry of that period, the European Parliament and the Council have both informed the Commission that they will not object. That period shall be extended by three months at the initiative of the European Parliament or of the Council.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 98","ordinal":98,"division":"CHAPTER XI","heading":"Committee procedure","text":"1. The Commission shall be assisted by a committee. That committee shall be a committee within the meaning of Regulation (EU) No 182/2011.\n2. Where reference is made to this paragraph, Article 5 of Regulation (EU) No 182/2011 shall apply.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 99","ordinal":99,"division":"CHAPTER XII","heading":"Penalties","text":"1. In accordance with the terms and conditions laid down in this Regulation, Member States shall lay down the rules on penalties and other enforcement measures, which may also include warnings and non-monetary measures, applicable to infringements of this Regulation by operators, and shall take all measures necessary to ensure that they are properly and effectively implemented, thereby taking into account the guidelines issued by the Commission pursuant to Article 96. The penalties provided for shall be effective, proportionate and dissuasive. They shall take into account the interests of SMEs, including start-ups, and their economic viability.\n2. The Member States shall, without delay and at the latest by the date of entry into application, notify the Commission of the rules on penalties and of other enforcement measures referred to in paragraph 1, and shall notify it, without delay, of any subsequent amendment to them.\n3. Non-compliance with the prohibition of the AI practices referred to in Article 5 shall be subject to administrative fines of up to EUR 35 000 000 or, if the offender is an undertaking, up to 7 % of its total worldwide annual turnover for the preceding financial year, whichever is higher.\n4. Non-compliance with any of the following provisions related to operators or notified bodies, other than those laid down in Articles 5, shall be subject to administrative fines of up to EUR 15 000 000 or, if the offender is an undertaking, up to 3 % of its total worldwide annual turnover for the preceding financial year, whichever is higher:\n(a)\nobligations of providers pursuant to Article 16;\n(b)\nobligations of authorised representatives pursuant to Article 22;\n(c)\nobligations of importers pursuant to Article 23;\n(d)\nobligations of distributors pursuant to Article 24;\n(e)\nobligations of deployers pursuant to Article 26;\n(f)\nrequirements and obligations of notified bodies pursuant to Article 31, Article 33(1), (3) and (4) or Article 34;\n(g)\ntransparency obligations for providers and deployers pursuant to Article 50.\n5. The supply of incorrect, incomplete or misleading information to notified bodies or national competent authorities in reply to a request shall be subject to administrative fines of up to EUR 7 500 000 or, if the offender is an undertaking, up to 1 % of its total worldwide annual turnover for the preceding financial year, whichever is higher.\n6. In the case of SMEs, including start-ups, each fine referred to in this Article shall be up to the percentages or amount referred to in paragraphs 3, 4 and 5, whichever thereof is lower.\n7. When deciding whether to impose an administrative fine and when deciding on the amount of the administrative fine in each individual case, all relevant circumstances of the specific situation shall be taken into account and, as appropriate, regard shall be given to the following:\n(a)\nthe nature, gravity and duration of the infringement and of its consequences, taking into account the purpose of the AI system, as well as, where appropriate, the number of affected persons and the level of damage suffered by them;\n(b)\nwhether administrative fines have already been applied by other market surveillance authorities to the same operator for the same infringement;\n(c)\nwhether administrative fines have already been applied by other authorities to the same operator for infringements of other Union or national law, when such infringements result from the same activity or omission constituting a relevant infringement of this Regulation;\n(d)\nthe size, the annual turnover and market share of the operator committing the infringement;\n(e)\nany other aggravating or mitigating factor applicable to the circumstances of the case, such as financial benefits gained, or losses avoided, directly or indirectly, from the infringement;\n(f)\nthe degree of cooperation with the national competent authorities, in order to remedy the infringement and mitigate the possible adverse effects of the infringement;\n(g)\nthe degree of responsibility of the operator taking into account the technical and organisational measures implemented by it;\n(h)\nthe manner in which the infringement became known to the national competent authorities, in particular whether, and if so to what extent, the operator notified the infringement;\n(i)\nthe intentional or negligent character of the infringement;\n(j)\nany action taken by the operator to mitigate the harm suffered by the affected persons.\n8. Each Member State shall lay down rules on to what extent administrative fines may be imposed on public authorities and bodies established in that Member State.\n9. Depending on the legal system of the Member States, the rules on administrative fines may be applied in such a manner that the fines are imposed by competent national courts or by other bodies, as applicable in those Member States. The application of such rules in those Member States shall have an equivalent effect.\n10. The exercise of powers under this Article shall be subject to appropriate procedural safeguards in accordance with Union and national law, including effective judicial remedies and due process.\n11. Member States shall, on an annual basis, report to the Commission about the administrative fines they have issued during that year, in accordance with this Article, and about any related litigation or judicial proceedings.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 100","ordinal":100,"division":"CHAPTER XII","heading":"Administrative fines on Union institutions, bodies, offices and agencies","text":"1. The European Data Protection Supervisor may impose administrative fines on Union institutions, bodies, offices and agencies falling within the scope of this Regulation. When deciding whether to impose an administrative fine and when deciding on the amount of the administrative fine in each individual case, all relevant circumstances of the specific situation shall be taken into account and due regard shall be given to the following:\n(a)\nthe nature, gravity and duration of the infringement and of its consequences, taking into account the purpose of the AI system concerned, as well as, where appropriate, the number of affected persons and the level of damage suffered by them;\n(b)\nthe degree of responsibility of the Union institution, body, office or agency, taking into account technical and organisational measures implemented by them;\n(c)\nany action taken by the Union institution, body, office or agency to mitigate the damage suffered by affected persons;\n(d)\nthe degree of cooperation with the European Data Protection Supervisor in order to remedy the infringement and mitigate the possible adverse effects of the infringement, including compliance with any of the measures previously ordered by the European Data Protection Supervisor against the Union institution, body, office or agency concerned with regard to the same subject matter;\n(e)\nany similar previous infringements by the Union institution, body, office or agency;\n(f)\nthe manner in which the infringement became known to the European Data Protection Supervisor, in particular whether, and if so to what extent, the Union institution, body, office or agency notified the infringement;\n(g)\nthe annual budget of the Union institution, body, office or agency.\n2. Non-compliance with the prohibition of the AI practices referred to in Article 5 shall be subject to administrative fines of up to EUR 1 500 000.\n3. The non-compliance of the AI system with any requirements or obligations under this Regulation, other than those laid down in Article 5, shall be subject to administrative fines of up to EUR 750 000.\n4. Before taking decisions pursuant to this Article, the European Data Protection Supervisor shall give the Union institution, body, office or agency which is the subject of the proceedings conducted by the European Data Protection Supervisor the opportunity of being heard on the matter regarding the possible infringement. The European Data Protection Supervisor shall base his or her decisions only on elements and circumstances on which the parties concerned have been able to comment. Complainants, if any, shall be associated closely with the proceedings.\n5. The rights of defence of the parties concerned shall be fully respected in the proceedings. They shall be entitled to have access to the European Data Protection Supervisor’s file, subject to the legitimate interest of individuals or undertakings in the protection of their personal data or business secrets.\n6. Funds collected by imposition of fines in this Article shall contribute to the general budget of the Union. The fines shall not affect the effective operation of the Union institution, body, office or agency fined.\n7. The European Data Protection Supervisor shall, on an annual basis, notify the Commission of the administrative fines it has imposed pursuant to this Article and of any litigation or judicial proceedings it has initiated.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 101","ordinal":101,"division":"CHAPTER XII","heading":"Fines for providers of general-purpose AI models","text":"1. The Commission may impose on providers of general-purpose AI models fines not exceeding 3 % of their annual total worldwide turnover in the preceding financial year or EUR 15 000 000, whichever is higher., when the Commission finds that the provider intentionally or negligently:\n(a)\ninfringed the relevant provisions of this Regulation;\n(b)\nfailed to comply with a request for a document or for information pursuant to Article 91, or supplied incorrect, incomplete or misleading information;\n(c)\nfailed to comply with a measure requested under Article 93;\n(d)\nfailed to make available to the Commission access to the general-purpose AI model or general-purpose AI model with systemic risk with a view to conducting an evaluation pursuant to Article 92.\nIn fixing the amount of the fine or periodic penalty payment, regard shall be had to the nature, gravity and duration of the infringement, taking due account of the principles of proportionality and appropriateness. The Commission shall also into account commitments made in accordance with Article 93(3) or made in relevant codes of practice in accordance with Article 56.\n2. Before adopting the decision pursuant to paragraph 1, the Commission shall communicate its preliminary findings to the provider of the general-purpose AI model and give it an opportunity to be heard.\n3. Fines imposed in accordance with this Article shall be effective, proportionate and dissuasive.\n4. Information on fines imposed under this Article shall also be communicated to the Board as appropriate.\n5. The Court of Justice of the European Union shall have unlimited jurisdiction to review decisions of the Commission fixing a fine under this Article. It may cancel, reduce or increase the fine imposed.\n6. The Commission shall adopt implementing acts containing detailed arrangements and procedural safeguards for proceedings in view of the possible adoption of decisions pursuant to paragraph 1 of this Article. Those implementing acts shall be adopted in accordance with the examination procedure referred to in Article 98(2).","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 102","ordinal":102,"division":"CHAPTER XIII","heading":"Amendment to Regulation (EC) No 300/2008","text":"In Article 4(3) of Regulation (EC) No 300/2008, the following subparagraph is added:\n‘When adopting detailed measures related to technical specifications and procedures for approval and use of security equipment concerning Artificial Intelligence systems within the meaning of Regulation (EU) 2024/1689 of the European Parliament and of the Council (*), the requirements set out in Chapter III, Section 2, of that Regulation shall be taken into account.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 103","ordinal":103,"division":"CHAPTER XIII","heading":"Amendment to Regulation (EU) No 167/2013","text":"In Article 17(5) of Regulation (EU) No 167/2013, the following subparagraph is added:\n‘When adopting delegated acts pursuant to the first subparagraph concerning artificial intelligence systems which are safety components within the meaning of Regulation (EU) 2024/1689 of the European Parliament and of the Council (*), the requirements set out in Chapter III, Section 2, of that Regulation shall be taken into account.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 104","ordinal":104,"division":"CHAPTER XIII","heading":"Amendment to Regulation (EU) No 168/2013","text":"In Article 22(5) of Regulation (EU) No 168/2013, the following subparagraph is added:\n‘When adopting delegated acts pursuant to the first subparagraph concerning Artificial Intelligence systems which are safety components within the meaning of Regulation (EU) 2024/1689 of the European Parliament and of the Council (*), the requirements set out in Chapter III, Section 2, of that Regulation shall be taken into account.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 105","ordinal":105,"division":"CHAPTER XIII","heading":"Amendment to Directive 2014/90/EU","text":"In Article 8 of Directive 2014/90/EU, the following paragraph is added:\n‘5. For Artificial Intelligence systems which are safety components within the meaning of Regulation (EU) 2024/1689 of the European Parliament and of the Council (*), when carrying out its activities pursuant to paragraph 1 and when adopting technical specifications and testing standards in accordance with paragraphs 2 and 3, the Commission shall take into account the requirements set out in Chapter III, Section 2, of that Regulation.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 106","ordinal":106,"division":"CHAPTER XIII","heading":"Amendment to Directive (EU) 2016/797","text":"In Article 5 of Directive (EU) 2016/797, the following paragraph is added:\n‘12. When adopting delegated acts pursuant to paragraph 1 and implementing acts pursuant to paragraph 11 concerning Artificial Intelligence systems which are safety components within the meaning of Regulation (EU) 2024/1689 of the European Parliament and of the Council (*), the requirements set out in Chapter III, Section 2, of that Regulation shall be taken into account.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 107","ordinal":107,"division":"CHAPTER XIII","heading":"Amendment to Regulation (EU) 2018/858","text":"In Article 5 of Regulation (EU) 2018/858 the following paragraph is added:\n‘4. When adopting delegated acts pursuant to paragraph 3 concerning Artificial Intelligence systems which are safety components within the meaning of Regulation (EU) 2024/1689 of the European Parliament and of the Council (*), the requirements set out in Chapter III, Section 2, of that Regulation shall be taken into account.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 108","ordinal":108,"division":"CHAPTER XIII","heading":"Amendments to Regulation (EU) 2018/1139","text":"Regulation (EU) 2018/1139 is amended as follows:\n(1)\nin Article 17, the following paragraph is added:\n‘3. Without prejudice to paragraph 2, when adopting implementing acts pursuant to paragraph 1 concerning Artificial Intelligence systems which are safety components within the meaning of Regulation (EU) 2024/1689 of the European Parliament and of the Council (*), the requirements set out in Chapter III, Section 2, of that Regulation shall be taken into account.\n(*) Regulation (EU) 2024/1689 of the European Parliament and of the Council of 13 June 2024 laying down harmonised rules on artificial intelligence and amending Regulations (EC) No 300/2008, (EU) No 167/2013, (EU) No 168/2013, (EU) 2018/858, (EU) 2018/1139 and (EU) 2019/2144 and Directives 2014/90/EU, (EU) 2016/797 and (EU) 2020/1828 (Artificial Intelligence Act) (OJ L, 2024/1689, 12.7.2024, ELI: http://data.europa.eu/eli/reg/2024/1689/oj).’;\"\n(2)\nin Article 19, the following paragraph is added:\n‘4. When adopting delegated acts pursuant to paragraphs 1 and 2 concerning Artificial Intelligence systems which are safety components within the meaning of Regulation (EU) 2024/1689, the requirements set out in Chapter III, Section 2, of that Regulation shall be taken into account.’\n;\n(3)\nin Article 43, the following paragraph is added:\n‘4. When adopting implementing acts pursuant to paragraph 1 concerning Artificial Intelligence systems which are safety components within the meaning of Regulation (EU) 2024/1689, the requirements set out in Chapter III, Section 2, of that Regulation shall be taken into account.’\n;\n(4)\nin Article 47, the following paragraph is added:\n‘3. When adopting delegated acts pursuant to paragraphs 1 and 2 concerning Artificial Intelligence systems which are safety components within the meaning of Regulation (EU) 2024/1689, the requirements set out in Chapter III, Section 2, of that Regulation shall be taken into account.’\n;\n(5)\nin Article 57, the following subparagraph is added:\n‘When adopting those implementing acts concerning Artificial Intelligence systems which are safety components within the meaning of Regulation (EU) 2024/1689, the requirements set out in Chapter III, Section 2, of that Regulation shall be taken into account.’\n;\n(6)\nin Article 58, the following paragraph is added:\n‘3. When adopting delegated acts pursuant to paragraphs 1 and 2 concerning Artificial Intelligence systems which are safety components within the meaning of Regulation (EU) 2024/1689, the requirements set out in Chapter III, Section 2, of that Regulation shall be taken into account.’.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 109","ordinal":109,"division":"CHAPTER XIII","heading":"Amendment to Regulation (EU) 2019/2144","text":"In Article 11 of Regulation (EU) 2019/2144, the following paragraph is added:\n‘3. When adopting the implementing acts pursuant to paragraph 2, concerning artificial intelligence systems which are safety components within the meaning of Regulation (EU) 2024/1689 of the European Parliament and of the Council (*), the requirements set out in Chapter III, Section 2, of that Regulation shall be taken into account.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 110","ordinal":110,"division":"CHAPTER XIII","heading":"Amendment to Directive (EU) 2020/1828","text":"In Annex I to Directive (EU) 2020/1828 of the European Parliament and of the Council (58), the following point is added:\n‘(68)\nRegulation (EU) 2024/1689 of the European Parliament and of the Council of 13 June 2024 laying down harmonised rules on artificial intelligence and amending Regulations (EC) No 300/2008, (EU) No 167/2013, (EU) No 168/2013, (EU) 2018/858, (EU) 2018/1139 and (EU) 2019/2144 and Directives 2014/90/EU, (EU) 2016/797 and (EU) 2020/1828 (Artificial Intelligence Act) (OJ L, 2024/1689, 12.7.2024, ELI: http://data.europa.eu/eli/reg/2024/1689/oj).’.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 111","ordinal":111,"division":"CHAPTER XIII","heading":"AI systems already placed on the market or put into service and general-purpose AI models already placed on the marked","text":"1. Without prejudice to the application of Article 5 as referred to in Article 113(3), point (a), AI systems which are components of the large-scale IT systems established by the legal acts listed in Annex X that have been placed on the market or put into service before 2 August 2027 shall be brought into compliance with this Regulation by 31 December 2030.\nThe requirements laid down in this Regulation shall be taken into account in the evaluation of each large-scale IT system established by the legal acts listed in Annex X to be undertaken as provided for in those legal acts and where those legal acts are replaced or amended.\n2. Without prejudice to the application of Article 5 as referred to in Article 113(3), point (a), this Regulation shall apply to operators of high-risk AI systems, other than the systems referred to in paragraph 1 of this Article, that have been placed on the market or put into service before 2 August 2026, only if, as from that date, those systems are subject to significant changes in their designs. In any case, the providers and deployers of high-risk AI systems intended to be used by public authorities shall take the necessary steps to comply with the requirements and obligations of this Regulation by 2 August 2030.\n3. Providers of general-purpose AI models that have been placed on the market before 2 August 2025 shall take the necessary steps in order to comply with the obligations laid down in this Regulation by 2 August 2027.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 112","ordinal":112,"division":"CHAPTER XIII","heading":"Evaluation and review","text":"1. The Commission shall assess the need for amendment of the list set out in Annex III and of the list of prohibited AI practices laid down in Article 5, once a year following the entry into force of this Regulation, and until the end of the period of the delegation of power laid down in Article 97. The Commission shall submit the findings of that assessment to the European Parliament and the Council.\n2. By 2 August 2028 and every four years thereafter, the Commission shall evaluate and report to the European Parliament and to the Council on the following:\n(a)\nthe need for amendments extending existing area headings or adding new area headings in Annex III;\n(b)\namendments to the list of AI systems requiring additional transparency measures in Article 50;\n(c)\namendments enhancing the effectiveness of the supervision and governance system.\n3. By 2 August 2029 and every four years thereafter, the Commission shall submit a report on the evaluation and review of this Regulation to the European Parliament and to the Council. The report shall include an assessment with regard to the structure of enforcement and the possible need for a Union agency to resolve any identified shortcomings. On the basis of the findings, that report shall, where appropriate, be accompanied by a proposal for amendment of this Regulation. The reports shall be made public.\n4. The reports referred to in paragraph 2 shall pay specific attention to the following:\n(a)\nthe status of the financial, technical and human resources of the national competent authorities in order to effectively perform the tasks assigned to them under this Regulation;\n(b)\nthe state of penalties, in particular administrative fines as referred to in Article 99(1), applied by Member States for infringements of this Regulation;\n(c)\nadopted harmonised standards and common specifications developed to support this Regulation;\n(d)\nthe number of undertakings that enter the market after the entry into application of this Regulation, and how many of them are SMEs.\n5. By 2 August 2028, the Commission shall evaluate the functioning of the AI Office, whether the AI Office has been given sufficient powers and competences to fulfil its tasks, and whether it would be relevant and needed for the proper implementation and enforcement of this Regulation to upgrade the AI Office and its enforcement competences and to increase its resources. The Commission shall submit a report on its evaluation to the European Parliament and to the Council.\n6. By 2 August 2028 and every four years thereafter, the Commission shall submit a report on the review of the progress on the development of standardisation deliverables on the energy-efficient development of general-purpose AI models, and asses the need for further measures or actions, including binding measures or actions. The report shall be submitted to the European Parliament and to the Council, and it shall be made public.\n7. By 2 August 2028 and every three years thereafter, the Commission shall evaluate the impact and effectiveness of voluntary codes of conduct to foster the application of the requirements set out in Chapter III, Section 2 for AI systems other than high-risk AI systems and possibly other additional requirements for AI systems other than high-risk AI systems, including as regards environmental sustainability.\n8. For the purposes of paragraphs 1 to 7, the Board, the Member States and national competent authorities shall provide the Commission with information upon its request and without undue delay.\n9. In carrying out the evaluations and reviews referred to in paragraphs 1 to 7, the Commission shall take into account the positions and findings of the Board, of the European Parliament, of the Council, and of other relevant bodies or sources.\n10. The Commission shall, if necessary, submit appropriate proposals to amend this Regulation, in particular taking into account developments in technology, the effect of AI systems on health and safety, and on fundamental rights, and in light of the state of progress in the information society.\n11. To guide the evaluations and reviews referred to in paragraphs 1 to 7 of this Article, the AI Office shall undertake to develop an objective and participative methodology for the evaluation of risk levels based on the criteria outlined in the relevant Articles and the inclusion of new systems in:\n(a)\nthe list set out in Annex III, including the extension of existing area headings or the addition of new area headings in that Annex;\n(b)\nthe list of prohibited practices set out in Article 5; and\n(c)\nthe list of AI systems requiring additional transparency measures pursuant to Article 50.\n12. Any amendment to this Regulation pursuant to paragraph 10, or relevant delegated or implementing acts, which concerns sectoral Union harmonisation legislation listed in Section B of Annex I shall take into account the regulatory specificities of each sector, and the existing governance, conformity assessment and enforcement mechanisms and authorities established therein.\n13. By 2 August 2031, the Commission shall carry out an assessment of the enforcement of this Regulation and shall report on it to the European Parliament, the Council and the European Economic and Social Committee, taking into account the first years of application of this Regulation. On the basis of the findings, that report shall, where appropriate, be accompanied by a proposal for amendment of this Regulation with regard to the structure of enforcement and the need for a Union agency to resolve any identified shortcomings.","source_id":"SRC-EU-AIACT-OJ"},{"no":"Article 113","ordinal":113,"division":"CHAPTER XIII","heading":"Entry into force and application","text":"This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union.\nIt shall apply from 2 August 2026.\nHowever:\n(a)\nChapters I and II shall apply from 2 February 2025;\n(b)\nChapter III Section 4, Chapter V, Chapter VII and Chapter XII and Article 78 shall apply from 2 August 2025, with the exception of Article 101;\n(c)\nArticle 6(1) and the corresponding obligations in this Regulation shall apply from 2 August 2027.","source_id":"SRC-EU-AIACT-OJ"}],"amended_by":["EU-OMNIBUS-AI-2026"],"verification":"VERIFIED","evidence_grade":"A"},{"id":"EU-OMNIBUS-AI-2026","jurisdiction":"EU","title":"Regulation (EU) 2026/1744 of the European Parliament and of the Council","short_title":"Digital Omnibus on AI","issuer":"European Parliament、Council of the European Union","doc_number":"Regulation (EU) 2026/1744","level":"Regulation","instrument_type":"AI_SPECIFIC","status":"IN_FORCE","status_note":"修订性条例，只登记元数据，未拆条（其条文内嵌被替换的 AI Act 条文，按条切分会出错）；生效日按第 4 条与公报日期推算；各项修订的适用日期未逐项核查","published_at":"2026-07-24","effective_at":"2026-07-27","amends":["EU-AI-ACT-2024"],"language":"en","discovered_via":"tavily-search 2026-11-11","foreign_related":"DOMESTIC","source_id":"SRC-EU-OMNIBUS-AI-OJ","source_ids":["SRC-EU-OMNIBUS-AI-OJ"],"complete":false,"expected_provisions":null,"meta_evidence":{"doc_number":"REGULATION (EU) 2026/1744 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL","title":"amending Regulations (EU) 2024/1689, (EU) 2018/1139 and (EU) 2023/1230 as regards the simplification of the implementation of harmonised rules on artificial intelligence (Digital Omnibus on AI)","adopted_at":"Done at Strasbourg, 8 July 2026.","published_at":"24.7.2026","entry_into_force":"This Regulation shall enter into force on the third day following that of its publication in the Official Journal of the European Union.","issuer":"THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,","amends":"Regulation (EU) 2024/1689 is amended as follows:"},"derived_dates":{"effective_at":{"from":"published_at","plus_days":3,"basis":"entry_into_force"}},"generated_by":"ingest/instruments/EU-OMNIBUS-AI-2026.json","provisions":[],"amended_by":[],"verification":"VERIFIED","evidence_grade":"A"},{"id":"US-EO-14179","jurisdiction":"US","title":"Removing Barriers to American Leadership in Artificial Intelligence","short_title":"EO 14179","issuer":"President","doc_number":"Executive Order 14179","level":"Executive order","instrument_type":"AI_SPECIFIC","status":"ADOPTED","status_note":"日期为签署日（见原文），2025-01-31 刊载于 Federal Register；原文未另写生效日期；截至入库日是否被后续行政令修改或撤销未核查，故不标 IN_FORCE","published_at":"2025-01-23","effective_at":null,"language":"en","discovered_via":"federalregister.gov","foreign_related":"DOMESTIC","source_id":"SRC-US-EO-14179","source_ids":["SRC-US-EO-14179"],"complete":true,"expected_provisions":6,"meta_evidence":{"doc_number":"Executive Order 14179 of January 23, 2025","fr_doc":"[FR Doc No: 2025-02172]","published_at":"Executive Order 14179 of January 23, 2025","issuer":"By the authority vested in me as President by the Constitution and the laws of the United States of America, it is hereby ordered:"},"derived_dates":{},"generated_by":"ingest/instruments/US-EO-14179.json","provisions":[{"no":"Section 1.","ordinal":1,"division":"","text":"Purpose. The United States has long been at\nthe forefront of artificial intelligence (AI)\ninnovation, driven by the strength of our free markets,\nworld-class research institutions, and entrepreneurial\nspirit. To maintain this leadership, we must develop AI\nsystems that are free from ideological bias or\nengineered social agendas. With the right Government\npolicies, we can solidify our position as the global\nleader in AI and secure a brighter future for all\nAmericans. This order revokes certain existing AI\npolicies and directives that act as barriers to\nAmerican AI innovation, clearing a path for the United\nStates to act decisively to retain global leadership in\nartificial intelligence.","source_id":"SRC-US-EO-14179"},{"no":"Sec. 2.","ordinal":2,"division":"","text":"Policy. It is the policy of the United States\nto sustain and enhance America's global AI dominance in\norder to promote human flourishing, economic\ncompetitiveness, and national security.","source_id":"SRC-US-EO-14179"},{"no":"Sec. 3.","ordinal":3,"division":"","text":"Definition. For the purposes of this order,\n``artificial intelligence'' or ``AI'' has the meaning\nset forth in 15 U.S.C. 9401(3).","source_id":"SRC-US-EO-14179"},{"no":"Sec. 4.","ordinal":4,"division":"","text":"Developing an Artificial Intelligence Action\nPlan. (a) Within 180 days of this order, the Assistant\nto the President for Science and Technology (APST), the\nSpecial Advisor for AI and Crypto, and the Assistant to\nthe President for National Security Affairs (APNSA), in\ncoordination with the Assistant to the President for\nEconomic Policy, the Assistant to the President for\nDomestic Policy, the Director of the Office of\nManagement and Budget (OMB Director), and the heads of\nsuch executive departments and agencies (agencies) as\nthe APST and APNSA deem relevant, shall develop and\nsubmit to the President an action plan to achieve the\npolicy set forth in section 2 of this order.","source_id":"SRC-US-EO-14179"},{"no":"Sec. 5.","ordinal":5,"division":"","text":"Implementation of Order Revocation. (a) The\nAPST, the Special Advisor for AI and Crypto, and the\nAPNSA shall immediately review, in coordination with\nthe heads of all agencies as they deem relevant, all\npolicies, directives, regulations, orders, and other\nactions taken pursuant to the revoked Executive Order\n14110 of October 30, 2023 (Safe, Secure, and\nTrustworthy Development and Use of Artificial\nIntelligence). The APST, the Special Advisor for AI and\nCrypto, and the APNSA shall, in coordination with the\nheads of relevant agencies, identify any actions taken\npursuant to Executive Order 14110 that are or may be\ninconsistent with, or present obstacles to, the policy\nset forth in section 2 of this order. For any such\nagency actions identified, the heads of agencies shall,\nas appropriate and consistent with applicable law,\nsuspend, revise, or rescind such actions, or propose\nsuspending, revising, or rescinding such actions. If in\nany case such suspension, revision, or rescission\ncannot be finalized immediately, the APST and the heads\nof agencies shall promptly take steps to provide all\navailable exemptions authorized by any such orders,\nrules, regulations, guidelines, or policies, as\nappropriate and consistent with applicable law, until\nsuch action can be finalized.\n(b) Within 60 days of this order, the OMB Director,\nin coordination with the APST, shall revise OMB\nMemoranda M-24-10 and M-24-18 as necessary\n[[Page 8742]]\nto make them consistent with the policy set forth in\nsection 2 of this order.","source_id":"SRC-US-EO-14179"},{"no":"Sec. 6.","ordinal":6,"division":"","text":"General Provisions. (a) Nothing in this order\nshall be construed to impair or otherwise affect:\n(i) the authority granted by law to an executive department or agency, or\nthe head thereof; or\n(ii) the functions of the Director of the Office of Management and Budget\nrelating to budgetary, administrative, or legislative proposals.\n(b) This order shall be implemented consistent with\napplicable law and subject to the availability of\nappropriations.\n(c) This order is not intended to, and does not,\ncreate any right or benefit, substantive or procedural,\nenforceable at law or in equity by any party against\nthe United States, its departments, agencies, or\nentities, its officers, employees, or agents, or any\nother person.","source_id":"SRC-US-EO-14179"}],"amended_by":[],"verification":"VERIFIED","evidence_grade":"A"},{"id":"US-TAKE-IT-DOWN-2025","jurisdiction":"US","title":"Tools to Address Known Exploitation by Immobilizing Technological Deepfakes on Websites and Networks Act","short_title":"TAKE IT DOWN Act","issuer":"119th Congress","doc_number":"Public Law 119-12","level":"Federal statute","instrument_type":"AI_SPECIFIC","status":"ADOPTED","status_note":"已签署成为法律（签署日见原文）；各条施行日期未逐项核对，故标 ADOPTED 而非 IN_FORCE。规制对象是未经同意的私密影像，含 AI 生成的 digital forgery，不是综合性 AI 立法","published_at":"2025-05-19","effective_at":null,"language":"en","discovered_via":"govinfo","foreign_related":"DOMESTIC","source_id":"SRC-US-PL-119-12","source_ids":["SRC-US-PL-119-12"],"complete":true,"expected_provisions":5,"meta_evidence":{"doc_number":"Public Law 119-12 119th Congress","short_title":"or the ``TAKE IT DOWN Act''.","published_at":"Approved May 19, 2025.","issuer":"Public Law 119-12 119th Congress"},"derived_dates":{},"generated_by":"ingest/instruments/US-TAKE-IT-DOWN-2025.json","provisions":[{"no":"SECTION 1.","ordinal":1,"division":"","text":"\u003c\u003cNOTE: 47 USC 609 note.>> SHORT TITLE.\nThis Act may be cited as the ``Tools to Address Known Exploitation\nby Immobilizing Technological Deepfakes on Websites and Networks Act''\nor the ``TAKE IT DOWN Act''.","source_id":"SRC-US-PL-119-12"},{"no":"SEC. 2.","ordinal":2,"division":"","text":"CRIMINAL PROHIBITION ON INTENTIONAL DISCLOSURE OF\nNONCONSENSUAL INTIMATE VISUAL DEPICTIONS.\n(a) In General.--Section 223 of the Communications Act of 1934 (47\nU.S.C. 223) is amended--\n(1) by redesignating subsection (h) as subsection (i); and\n(2) by inserting after subsection (g) the following:\n``(h) Intentional Disclosure of Nonconsensual Intimate Visual\nDepictions.--\n``(1) Definitions.--In this subsection:\n``(A) Consent.--The term `consent' means an\naffirmative, conscious, and voluntary authorization made\nby an individual free from force, fraud, duress,\nmisrepresentation, or coercion.\n``(B) Digital forgery.--The term `digital forgery'\nmeans any intimate visual depiction of an identifiable\nindividual created through the use of software, machine\nlearning, artificial intelligence, or any other\ncomputer-generated or technological means, including by\nadapting, modifying, manipulating, or altering an\nauthentic visual depiction, that, when viewed as a whole\nby a reasonable person, is indistinguishable from an\nauthentic visual depiction of the individual.\n``(C) Identifiable individual.--The term\n`identifiable individual' means an individual--\n``(i) who appears in whole or in part in an\nintimate visual depiction; and\n``(ii) whose face, likeness, or other\ndistinguishing characteristic (including a unique\nbirthmark or other recognizable feature) is\ndisplayed in connection with such intimate visual\ndepiction.\n``(D) Interactive computer service.--The term\n`interactive computer service' has the meaning given the\nterm in section 230.\n[[Page 139 STAT. 56]]\n``(E) Intimate visual depiction.--The term `intimate\nvisual depiction' has the meaning given such term in\nsection 1309 of the Consolidated Appropriations Act,\n2022 (15 U.S.C. 6851).\n``(F) Minor.--The term `minor' means any individual\nunder the age of 18 years.\n``(2) Offense involving authentic intimate visual\ndepictions.--\n``(A) Involving adults.--Except as provided in\nsubparagraph (C), it shall be unlawful for any person,\nin interstate or foreign commerce, to use an interactive\ncomputer service to knowingly publish an intimate visual\ndepiction of an identifiable individual who is not a\nminor if--\n``(i) the intimate visual depiction was\nobtained or created under circumstances in which\nthe person knew or reasonably should have known\nthe identifiable individual had a reasonable\nexpectation of privacy;\n``(ii) what is depicted was not voluntarily\nexposed by the identifiable individual in a public\nor commercial setting;\n``(iii) what is depicted is not a matter of\npublic concern; and\n``(iv) publication of the intimate visual\ndepiction--\n``(I) is intended to cause harm; or\n``(II) causes harm, including\npsychological, financial, or\nreputational harm, to the identifiable\nindividual.\n``(B) Involving minors.--Except as provided in\nsubparagraph (C), it shall be unlawful for any person,\nin interstate or foreign commerce, to use an interactive\ncomputer service to knowingly publish an intimate visual\ndepiction of an identifiable individual who is a minor\nwith intent to--\n``(i) abuse, humiliate, harass, or degrade the\nminor; or\n``(ii) arouse or gratify the sexual desire of\nany person.\n``(C) Exceptions.--Subparagraphs (A) and (B) shall\nnot apply to--\n``(i) a lawfully authorized investigative,\nprotective, or intelligence activity of--\n``(I) a law enforcement agency of\nthe United States, a State, or a\npolitical subdivision of a State; or\n``(II) an intelligence agency of the\nUnited States;\n``(ii) a disclosure made reasonably and in\ngood faith--\n``(I) to a law enforcement officer\nor agency;\n``(II) as part of a document\nproduction or filing associated with a\nlegal proceeding;\n``(III) as part of medical\neducation, diagnosis, or treatment or\nfor a legitimate medical, scientific, or\neducation purpose;\n``(IV) in the reporting of unlawful\ncontent or unsolicited or unwelcome\nconduct or in pursuance\n[[Page 139 STAT. 57]]\nof a legal, professional, or other\nlawful obligation; or\n``(V) to seek support or help with\nrespect to the receipt of an unsolicited\nintimate visual depiction;\n``(iii) a disclosure reasonably intended to\nassist the identifiable individual;\n``(iv) a person who possesses or publishes an\nintimate visual depiction of himself or herself\nengaged in nudity or sexually explicit conduct (as\nthat term is defined in section 2256(2)(A) of\ntitle 18, United States Code); or\n``(v) the publication of an intimate visual\ndepiction that constitutes--\n``(I) child pornography (as that\nterm is defined in section 2256 of title\n18, United States Code); or\n``(II) a visual depiction described\nin subsection (a) or (b) of section\n1466A of title 18, United States Code\n(relating to obscene visual\nrepresentations of the sexual abuse of\nchildren).\n``(3) Offense involving digital forgeries.--\n``(A) Involving adults.--Except as provided in\nsubparagraph (C), it shall be unlawful for any person,\nin interstate or foreign commerce, to use an interactive\ncomputer service to knowingly publish a digital forgery\nof an identifiable individual who is not a minor if--\n``(i) the digital forgery was published\nwithout the consent of the identifiable\nindividual;\n``(ii) what is depicted was not voluntarily\nexposed by the identifiable individual in a public\nor commercial setting;\n``(iii) what is depicted is not a matter of\npublic concern; and\n``(iv) publication of the digital forgery--\n``(I) is intended to cause harm; or\n``(II) causes harm, including\npsychological, financial, or\nreputational harm, to the identifiable\nindividual.\n``(B) Involving minors.--Except as provided in\nsubparagraph (C), it shall be unlawful for any person,\nin interstate or foreign commerce, to use an interactive\ncomputer service to knowingly publish a digital forgery\nof an identifiable individual who is a minor with intent\nto--\n``(i) abuse, humiliate, harass, or degrade the\nminor; or\n``(ii) arouse or gratify the sexual desire of\nany person.\n``(C) Exceptions.--Subparagraphs (A) and (B) shall\nnot apply to--\n``(i) a lawfully authorized investigative,\nprotective, or intelligence activity of--\n``(I) a law enforcement agency of\nthe United States, a State, or a\npolitical subdivision of a State; or\n[[Page 139 STAT. 58]]\n``(II) an intelligence agency of the\nUnited States;\n``(ii) a disclosure made reasonably and in\ngood faith--\n``(I) to a law enforcement officer\nor agency;\n``(II) as part of a document\nproduction or filing associated with a\nlegal proceeding;\n``(III) as part of medical\neducation, diagnosis, or treatment or\nfor a legitimate medical, scientific, or\neducation purpose;\n``(IV) in the reporting of unlawful\ncontent or unsolicited or unwelcome\nconduct or in pursuance of a legal,\nprofessional, or other lawful\nobligation; or\n``(V) to seek support or help with\nrespect to the receipt of an unsolicited\nintimate visual depiction;\n``(iii) a disclosure reasonably intended to\nassist the identifiable individual;\n``(iv) a person who possesses or publishes a\ndigital forgery of himself or herself engaged in\nnudity or sexually explicit conduct (as that term\nis defined in section 2256(2)(A) of title 18,\nUnited States Code); or\n``(v) the publication of an intimate visual\ndepiction that constitutes--\n``(I) child pornography (as that\nterm is defined in section 2256 of title\n18, United States Code); or\n``(II) a visual depiction described\nin subsection (a) or (b) of section\n1466A of title 18, United States Code\n(relating to obscene visual\nrepresentations of the sexual abuse of\nchildren).\n``(4) Penalties.--\n``(A) Offenses involving adults.--Any person who\nviolates paragraph (2)(A) or (3)(A) shall be fined under\ntitle 18, United States Code, imprisoned not more than 2\nyears, or both.\n``(B) Offenses involving minors.--Any person who\nviolates paragraph (2)(B) or (3)(B) shall be fined under\ntitle 18, United States Code, imprisoned not more than 3\nyears, or both.\n``(5) Rules of construction.--For purposes of paragraphs (2)\nand (3)--\n``(A) the fact that the identifiable individual\nprovided consent for the creation of the intimate visual\ndepiction shall not establish that the individual\nprovided consent for the publication of the intimate\nvisual depiction; and\n``(B) the fact that the identifiable individual\ndisclosed the intimate visual depiction to another\nindividual shall not establish that the identifiable\nindividual provided consent for the publication of the\nintimate visual depiction by the person alleged to have\nviolated paragraph (2) or (3), respectively.\n``(6) Threats.--\n``(A) Threats involving authentic intimate visual\ndepictions.--Any person who intentionally threatens to\ncommit an offense under paragraph (2) for the purpose\n[[Page 139 STAT. 59]]\nof intimidation, coercion, extortion, or to create\nmental distress shall be punished as provided in\nparagraph (4).\n``(B) \u003c\u003cNOTE: Penalties. Time periods.>> Threats\ninvolving digital forgeries.--\n``(i) Threats involving adults.--Any person\nwho intentionally threatens to commit an offense\nunder paragraph (3)(A) for the purpose of\nintimidation, coercion, extortion, or to create\nmental distress shall be fined under title 18,\nUnited States Code, imprisoned not more than 18\nmonths, or both.\n``(ii) Threats involving minors.--Any person\nwho intentionally threatens to commit an offense\nunder paragraph (3)(B) for the purpose of\nintimidation, coercion, extortion, or to create\nmental distress shall be fined under title 18,\nUnited States Code, imprisoned not more than 30\nmonths, or both.\n``(7) Forfeiture.--\n``(A) \u003c\u003cNOTE: Courts.>> In general.--The court, in\nimposing a sentence on any person convicted of a\nviolation of paragraph (2) or (3), shall order, in\naddition to any other sentence imposed and irrespective\nof any provision of State law, that the person forfeit\nto the United States--\n``(i) any material distributed in violation of\nthat paragraph;\n``(ii) the person's interest in property, real\nor personal, constituting or derived from any\ngross proceeds of the violation, or any property\ntraceable to such property, obtained or retained\ndirectly or indirectly as a result of the\nviolation; and\n``(iii) any personal property of the person\nused, or intended to be used, in any manner or\npart, to commit or to facilitate the commission of\nthe violation.\n``(B) \u003c\u003cNOTE: Applicability.>> Procedures.--Section\n413 of the Controlled Substances Act (21 U.S.C. 853),\nwith the exception of subsections (a) and (d), shall\napply to the criminal forfeiture of property under\nsubparagraph (A).\n``(8) \u003c\u003cNOTE: Courts.>> Restitution.--The court shall order\nrestitution for an offense under paragraph (2) or (3) in the\nsame manner as under section 2264 of title 18, United States\nCode.\n``(9) Rule of construction.--Nothing in this subsection\nshall be construed to limit the application of any other\nrelevant law, including section 2252 of title 18, United States\nCode.''.\n(b) Defenses.--Section 223(e)(1) of the Communications Act of 1934\n(47 U.S.C. 223(e)(1)) is amended by striking ``or (d)'' and inserting\n``, (d), or (h)''.\n(c) Technical and Conforming Amendment.--Subsection (i) of section\n223 of the Communications Act of 1934 (47 U.S.C. 223), as so\nredesignated by subsection (a), is amended by inserting ``Definitions.--\n'' before ``For purposes of this section''.","source_id":"SRC-US-PL-119-12"},{"no":"SEC. 3.","ordinal":3,"division":"","text":"\u003c\u003cNOTE: 47 USC 223a note.>> NOTICE AND REMOVAL OF\nNONCONSENSUAL INTIMATE VISUAL DEPICTIONS.\n(a) In General.--\n(1) Notice and removal process.--\n(A) \u003c\u003cNOTE: Deadline.>> Establishment.--Not later\nthan 1 year after the date of enactment of this Act, a\ncovered platform shall establish a process whereby an\nidentifiable individual (or\n[[Page 139 STAT. 60]]\nan authorized person acting on behalf of such\nindividual) may--\n(i) notify the covered platform of an intimate\nvisual depiction published on the covered platform\nthat--\n(I) includes a depiction of the\nidentifiable individual; and\n(II) was published without the\nconsent of the identifiable individual;\nand\n(ii) submit a request for the covered platform\nto remove such intimate visual depiction.\n(B) Requirements.--A notification and request for\nremoval of an intimate visual depiction submitted under\nthe process established under subparagraph
